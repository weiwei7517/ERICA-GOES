<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>GOYA｜走呀</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#f5f4f1;
    --card:#ffffff;
    --text:#292929;
    --sub:#858585;
    --line:#e7e5e1;
    --soft:#eeece8;
    --dark:#333333;
    --radius:22px;
}

html,
body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================
   Header
========================= */

.header{
    width:100%;
    padding:22px 24px;
}

.header-inner{
    max-width:980px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:20px;
    font-weight:700;
    letter-spacing:.03em;
}

.logo span{
    font-weight:400;
    color:#888;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-email{
    color:#999;
    font-size:12px;
}

.simple-btn{
    border:0;
    background:none;
    color:#777;
    padding:5px;
    font-size:13px;
}

.simple-btn:hover{
    color:#222;
}

/* =========================
   Main
========================= */

.page{
    max-width:980px;
    margin:0 auto;
    padding:32px 24px 80px;
}

/* =========================
   Hero
========================= */

.hero{
    padding:38px 0 58px;
}

.eyebrow{
    font-size:11px;
    color:#999;
    letter-spacing:.18em;
    margin-bottom:18px;
}

.hero-title-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
}

.hero-title{
    margin:0;
    font-size:clamp(42px,7vw,72px);
    line-height:1.05;
    font-weight:600;
    letter-spacing:-.045em;
}

.hero-subtitle{
    margin:20px 0 0;
    font-size:17px;
    color:#888;
    line-height:1.7;
}

.edit-text{
    border:0;
    background:none;
    color:#aaa;
    font-size:12px;
    padding:5px 0;
    white-space:nowrap;
}

.edit-text:hover{
    color:#333;
}

/* =========================
   Section
========================= */

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:20px;
}

.section-title{
    font-size:21px;
    font-weight:600;
}

.section-caption{
    margin-top:5px;
    color:#aaa;
    font-size:12px;
}

.add-text-btn{
    border:0;
    background:none;
    color:#555;
    font-size:13px;
    padding:5px 0;
}

.add-text-btn:hover{
    color:#000;
}

/* =========================
   Destination Cards
========================= */

.destination-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.destination-card{
    position:relative;
    min-height:190px;
    background:var(--card);
    border:1px solid rgba(0,0,0,.035);
    border-radius:var(--radius);
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    user-select:none;
    -webkit-user-select:none;
    touch-action:pan-y;
    transition:
        transform .18s ease,
        box-shadow .18s ease,
        opacity .18s ease;
}

.destination-card:hover{
    box-shadow:0 10px 30px rgba(0,0,0,.045);
}

.destination-card.dragging{
    opacity:.45;
    transform:scale(.98);
}

.destination-card.drag-over{
    box-shadow:0 0 0 2px #d4d1ca inset;
}

.destination-number{
    color:#b0ada7;
    font-size:11px;
    letter-spacing:.12em;
}

.destination-name{
    margin-top:auto;
    padding-top:35px;
    font-size:28px;
    font-weight:600;
    letter-spacing:-.025em;
}

.destination-bottom{
    margin-top:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.destination-count{
    color:#999;
    font-size:12px;
}

.destination-actions{
    display:flex;
    gap:13px;
    opacity:0;
    transition:opacity .15s ease;
}

.destination-card:hover .destination-actions{
    opacity:1;
}

.small-action{
    border:0;
    background:none;
    color:#aaa;
    padding:0;
    font-size:12px;
}

.small-action:hover{
    color:#333;
}

.add-destination-card{
    min-height:190px;
    border:1px dashed #d8d5cf;
    background:transparent;
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:13px;
    transition:.2s;
}

.add-destination-card:hover{
    background:#faf9f7;
    color:#555;
}

/* =========================
   Login
========================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.login-box{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:26px;
    padding:38px;
}

.login-logo{
    font-size:24px;
    font-weight:700;
    margin-bottom:8px;
}

.login-sub{
    color:#999;
    font-size:13px;
    margin-bottom:30px;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:8px;
}

.input,
.textarea,
.select{
    width:100%;
    border:1px solid var(--line);
    background:#faf9f7;
    border-radius:13px;
    padding:12px 13px;
    color:#333;
    outline:none;
}

.input:focus,
.textarea:focus,
.select:focus{
    border-color:#bcb8b0;
    background:#fff;
}

.textarea{
    resize:vertical;
    min-height:90px;
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:13px;
    background:#333;
    color:#fff;
    padding:13px;
    margin-top:5px;
}

.login-message{
    min-height:20px;
    color:#999;
    font-size:12px;
    margin-top:12px;
}

/* =========================
   Destination page
========================= */

.back-btn{
    border:0;
    background:none;
    color:#999;
    padding:0;
    font-size:13px;
    margin-bottom:28px;
}

.back-btn:hover{
    color:#333;
}

.page-title{
    font-size:clamp(34px,6vw,55px);
    font-weight:600;
    letter-spacing:-.04em;
    margin:0;
}

.page-subtitle{
    color:#999;
    margin-top:10px;
    font-size:14px;
}

.journey-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.journey-card{
    background:#fff;
    border-radius:20px;
    padding:22px 24px;
    border:1px solid rgba(0,0,0,.035);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    user-select:none;
    touch-action:pan-y;
    transition:.18s;
}

.journey-card.dragging{
    opacity:.4;
}

.journey-card.drag-over{
    box-shadow:0 0 0 2px #d4d1ca inset;
}

.journey-info{
    min-width:0;
}

.journey-title{
    font-size:20px;
    font-weight:600;
}

.journey-subtitle{
    color:#999;
    font-size:13px;
    margin-top:6px;
}

.journey-meta{
    color:#aaa;
    font-size:11px;
    margin-top:12px;
}

.journey-arrow{
    color:#bbb;
    font-size:20px;
    flex:none;
}

.empty-state{
    padding:55px 20px;
    text-align:center;
    color:#aaa;
    background:#fff;
    border-radius:20px;
}

.add-journey{
    margin-top:15px;
    width:100%;
    border:1px dashed #d7d4ce;
    background:transparent;
    color:#999;
    border-radius:20px;
    padding:22px;
}

.add-journey:hover{
    background:#faf9f7;
    color:#555;
}

/* =========================
   Trip Detail
========================= */

.detail-top{
    margin-bottom:38px;
}

.detail-creator{
    color:#999;
    font-size:13px;
    margin-top:14px;
}

.detail-description{
    color:#777;
    font-size:14px;
    line-height:1.8;
    margin-top:18px;
    white-space:pre-wrap;
}

.total-box{
    margin:28px 0;
    background:#eae8e3;
    border-radius:20px;
    padding:23px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.total-label{
    color:#777;
    font-size:13px;
}

.total-price{
    font-size:28px;
    font-weight:600;
}

.detail-section{
    margin-top:38px;
}

.detail-section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.detail-section-title{
    font-size:20px;
    font-weight:600;
}

.day-card{
    background:#fff;
    border-radius:20px;
    padding:22px;
    margin-bottom:12px;
}

.day-title{
    font-size:17px;
    font-weight:600;
    margin-bottom:16px;
}

.item-card{
    border-top:1px solid var(--line);
    padding:17px 0;
}

.item-card:first-child{
    border-top:0;
    padding-top:0;
}

.item-title{
    font-weight:600;
    font-size:15px;
}

.item-location{
    color:#999;
    font-size:12px;
    margin-top:5px;
}

.item-info{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    color:#888;
    font-size:11px;
    margin-top:10px;
}

.item-notes{
    color:#777;
    font-size:12px;
    line-height:1.7;
    margin-top:8px;
    white-space:pre-wrap;
}

.stay-card{
    background:#fff;
    border-radius:20px;
    padding:21px;
    margin-bottom:10px;
}

.stay-name{
    font-weight:600;
}

.stay-address{
    color:#999;
    font-size:12px;
    margin-top:5px;
}

.stay-info{
    color:#888;
    font-size:11px;
    margin-top:10px;
    line-height:1.8;
}

.add-day-btn{
    width:100%;
    border:1px dashed #d7d4ce;
    background:transparent;
    color:#999;
    padding:17px;
    border-radius:17px;
    margin-top:4px;
}

.add-day-btn:hover{
    background:#faf9f7;
}

/* =========================
   Modal
========================= */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(30,30,30,.28);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:25px;
    padding:28px;
}

.modal-title{
    font-size:20px;
    font-weight:600;
    margin-bottom:22px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.modal-actions button{
    flex:1;
}

.cancel-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:12px;
    color:#777;
}

.save-btn{
    border:0;
    background:#333;
    color:#fff;
    border-radius:12px;
    padding:12px;
}

.danger-btn{
    border:0;
    background:#f0eeee;
    color:#888;
    border-radius:12px;
    padding:12px;
}

/* =========================
   Context Menu
========================= */

.context-menu{
    position:fixed;
    z-index:300;
    background:#fff;
    border-radius:16px;
    padding:7px;
    box-shadow:0 12px 40px rgba(0,0,0,.14);
    min-width:150px;
}

.context-menu button{
    width:100%;
    text-align:left;
    border:0;
    background:none;
    padding:11px 12px;
    border-radius:10px;
    color:#555;
    font-size:13px;
}

.context-menu button:hover{
    background:#f5f4f1;
}

.context-menu .danger{
    color:#a88;
}

/* =========================
   Responsive
========================= */

@media(max-width:680px){

    .header{
        padding:19px 20px;
    }

    .page{
        padding:20px 20px 60px;
    }

    .user-email{
        display:none;
    }

    .hero{
        padding:28px 0 44px;
    }

    .hero-title{
        font-size:45px;
    }

    .hero-subtitle{
        font-size:15px;
    }

    .destination-list{
        grid-template-columns:1fr;
        gap:12px;
    }

    .destination-card,
    .add-destination-card{
        min-height:165px;
    }

    .destination-actions{
        opacity:1;
    }

    .destination-name{
        font-size:26px;
    }

    .journey-card{
        padding:19px;
    }

    .modal-backdrop{
        align-items:flex-end;
        padding:0;
    }

    .modal{
        max-height:88vh;
        border-radius:25px 25px 0 0;
        padding:25px 20px calc(25px + env(safe-area-inset-bottom));
    }
}

/* =========================
   Drag helper
========================= */

.drag-placeholder{
    border:1px dashed #cfcac1;
    background:#eeeae4;
    border-radius:22px;
    min-height:165px;
}

.no-select{
    user-select:none !important;
    -webkit-user-select:none !important;
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login-page hidden">

    <div class="login-box">

        <div class="login-logo">
            GOYA｜走呀
        </div>

        <div class="login-sub">
            輕鬆規劃你的下一趟旅行
        </div>

        <div class="field">
            <label>Email</label>
            <input
                id="loginEmail"
                class="input"
                type="email"
                autocomplete="email"
                placeholder="輸入 Email"
            >
        </div>

        <div class="field">
            <label>密碼</label>
            <input
                id="loginPassword"
                class="input"
                type="password"
                autocomplete="current-password"
                placeholder="輸入密碼"
            >
        </div>

        <button id="loginBtn" class="primary-btn">
            登入
        </button>

        <div id="loginMessage" class="login-message"></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

    <header class="header">

        <div class="header-inner">

            <div class="logo">
                GOYA<span>｜走呀</span>
            </div>

            <div class="header-right">

                <div id="userEmail" class="user-email"></div>

                <button
                    id="logoutBtn"
                    class="simple-btn"
                >
                    登出
                </button>

            </div>

        </div>

    </header>


    <main class="page">

        <!-- HOME -->
        <section id="homeView">

            <div class="hero">

                <div class="eyebrow">
                    TRAVEL PLANNER
                </div>

                <div class="hero-title-row">

                    <div>
                        <h1 id="heroTitle" class="hero-title">
                            去哪裡玩？
                        </h1>

                        <p id="heroSubtitle" class="hero-subtitle">
                            小資也能輕鬆飛
                        </p>
                    </div>

                    <button
                        id="editHeroBtn"
                        class="edit-text"
                    >
                        編輯
                    </button>

                </div>

            </div>


            <div class="section-head">

                <div>
                    <div class="section-title">
                        旅行目的地
                    </div>

                    <div class="section-caption">
                        長按卡片，就可以移動順序
                    </div>
                </div>

                <button
                    id="addDestinationBtn"
                    class="add-text-btn"
                >
                    ＋ 新增
                </button>

            </div>


            <div
                id="destinationList"
                class="destination-list"
            ></div>

        </section>


        <!-- DESTINATION -->
        <section id="destinationView" class="hidden">

            <button
                id="backHomeBtn"
                class="back-btn"
            >
                ← 所有目的地
            </button>

            <div class="section-head">

                <div>

                    <h1
                        id="destinationTitle"
                        class="page-title"
                    ></h1>

                    <div
                        id="destinationSubtitle"
                        class="page-subtitle"
                    >
                        我的旅行
                    </div>

                </div>

                <button
                    id="editCurrentDestinationBtn"
                    class="edit-text"
                >
                    編輯
                </button>

            </div>


            <div
                id="journeyList"
                class="journey-list"
            ></div>

            <button
                id="addJourneyBtn"
                class="add-journey"
            >
                ＋ 新增一趟旅程
            </button>

        </section>


        <!-- TRIP DETAIL -->
        <section id="tripView" class="hidden">

            <button
                id="backDestinationBtn"
                class="back-btn"
            >
                ← 返回
            </button>

            <div class="detail-top">

                <h1
                    id="tripTitle"
                    class="page-title"
                ></h1>

                <div
                    id="tripSubtitle"
                    class="page-subtitle"
                ></div>

                <div
                    id="tripCreator"
                    class="detail-creator"
                ></div>

                <div
                    id="tripDescription"
                    class="detail-description"
                ></div>

            </div>


            <div class="total-box">

                <div class="total-label">
                    旅程總花費
                </div>

                <div
                    id="tripTotal"
                    class="total-price"
                >
                    NT$ 0
                </div>

            </div>


            <div class="detail-section">

                <div class="detail-section-head">

                    <div class="detail-section-title">
                        行程
                    </div>

                </div>

                <div id="itineraryContainer"></div>

                <button
                    id="addDayBtn"
                    class="add-day-btn"
                >
                    ＋ 新增一天
                </button>

            </div>


            <div class="detail-section">

                <div class="detail-section-head">

                    <div class="detail-section-title">
                        住宿
                    </div>

                    <button
                        id="addStayBtn"
                        class="add-text-btn"
                    >
                        ＋ 新增住宿
                    </button>

                </div>

                <div id="stayContainer"></div>

            </div>

        </section>

    </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div
    id="modalBackdrop"
    class="modal-backdrop hidden"
>

    <div
        id="modal"
        class="modal"
    ></div>

</div>


<!-- =========================
     CONTEXT MENU
========================= -->

<div
    id="contextMenu"
    class="context-menu hidden"
></div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://vkwriekcbvvvkmsmlbzu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YIXuILncvi7L4It4Mgi99A_neR0cFry";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let destinations = [];

let currentDestination = null;

let currentTrip = null;

let currentTrips = [];

let allItineraries = [];

let allStays = [];

let draggedElement = null;

let draggedType = null;

let draggedIndex = null;

let longPressTimer = null;


/* =========================================================
   DEFAULT DESTINATIONS
========================================================= */

const DEFAULT_DESTINATIONS = [
    "日本",
    "韓國",
    "越南",
    "黃刀鎮極光"
];


/* =========================================================
   DOM
========================================================= */

const loginPage =
    document.getElementById("loginPage");

const app =
    document.getElementById("app");

const homeView =
    document.getElementById("homeView");

const destinationView =
    document.getElementById("destinationView");

const tripView =
    document.getElementById("tripView");

const modalBackdrop =
    document.getElementById("modalBackdrop");

const modal =
    document.getElementById("modal");

const contextMenu =
    document.getElementById("contextMenu");


/* =========================================================
   INIT
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

    setupEvents();

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if(session?.user){

        currentUser = session.user;

        showApp();

    }else{

        showLogin();

    }

});


supabaseClient.auth.onAuthStateChange(
    (_event, session) => {

        if(session?.user){

            currentUser = session.user;

            showApp();

        }else{

            currentUser = null;

            showLogin();

        }

    }
);


/* =========================================================
   AUTH
========================================================= */

function showLogin(){

    loginPage.classList.remove("hidden");

    app.classList.add("hidden");

}


async function showApp(){

    loginPage.classList.add("hidden");

    app.classList.remove("hidden");

    document.getElementById("userEmail").textContent =
        currentUser?.email || "";

    await loadDestinations();

    showHome();

}


document
    .getElementById("loginBtn")
    .addEventListener("click", login);


document
    .getElementById("loginPassword")
    .addEventListener("keydown", e => {

        if(e.key === "Enter"){
            login();
        }

    });


async function login(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "登入中…";

    const {
        error
    } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if(error){

        message.textContent =
            "登入失敗：" + error.message;

    }else{

        message.textContent = "";

    }

}

            Array.isArray(data) &&
            data.length
        ){

            return data;

        }

    }catch(e){}

}

}


async function loadDestinations(){

    destinations =
        getStoredDestinations();

    saveDestinations();

    loadHero();

    await renderDestinations();

}


async function renderDestinations(){

    const container =
        document.getElementById("destinationList");

    container.innerHTML = "";

    if(!destinations.length){

        container.innerHTML = `
            <div class="empty-state">
                還沒有目的地
            </div>
        `;

        return;

    }

    const tripCounts =
        await getTripCounts();

    destinations.forEach(
        (destination, index) => {

            const card =
                document.createElement("div");

            card.className =
                "destination-card";

            card.dataset.index =
                index;

            card.innerHTML = `

                <div>
                    <div class="destination-number">
                        ${String(index + 1).padStart(2,"0")}
                    </div>
                </div>

                <div class="destination-name">
                    ${escapeHTML(destination)}
                </div>

                <div class="destination-bottom">

                    <div class="destination-count">
                        ${tripCounts[destination] || 0} 趟旅程
                    </div>

                    <div class="destination-actions">

                        <button
                            class="small-action"
                            data-action="edit"
                        >
                            編輯
                        </button>

                        <button
                            class="small-action"
                            data-action="delete"
                        >
                            刪除
                        </button>

                    </div>

                </div>
            `;


            card.addEventListener(
                "click",
                e => {

                    if(
                        e.target.closest(
                            ".destination-actions"
                        )
                    ){

                        return;

                    }

                    openDestination(destination);

                }
            );


            card
                .querySelector(
                    '[data-action="edit"]'
                )
                .addEventListener(
                    "click",
                    e => {

                        e.stopPropagation();

                        editDestination(
                            destination,
                            index
                        );

                    }
                );


            card
                .querySelector(
                    '[data-action="delete"]'
                )
                .addEventListener(
                    "click",
                    e => {

                        e.stopPropagation();

                        deleteDestination(
                            destination
                        );

                    }
                );


            setupDrag(card, "destination", index);


            container.appendChild(card);

        }
    );


    const addCard =
        document.createElement("div");

    addCard.className =
        "add-destination-card";

    addCard.textContent =
        "＋ 新增目的地";

    addCard.addEventListener(
        "click",
        addDestination
    );

    container.appendChild(addCard);

}


async function getTripCounts(){

    const counts = {};

    destinations.forEach(
        d => counts[d] = 0
    );

    const {
        data,
        error
    } = await supabaseClient
        .from("trips")
        .select("destination");

    if(error){

        console.error(error);

        return counts;

    }

    (data || []).forEach(
        trip => {

            if(
                Object.prototype.hasOwnProperty.call(
                    counts,
                    trip.destination
                )
            ){

                counts[trip.destination]++;

            }

        }
    );

    return counts;

}

async function saveEditedDestination(
    index,
    oldName
){

    const newName =
        document
            .getElementById(
                "editDestinationInput"
            )
            .value
            .trim();

    if(!newName){

        return;

    }

    if(
        newName !== oldName &&
        destinations.includes(newName)
    ){

        alert("這個目的地已經存在");

        return;

    }

    destinations[index] =
        newName;

    saveDestinations();


    if(newName !== oldName){

        const {
            error
        } = await supabaseClient
            .from("trips")
            .update({
                destination:newName
            })
            .eq(
                "destination",
                oldName
            );

        if(error){

            console.error(error);

        }


        const oldKey =
            "goya_journey_order_" +
            oldName;

        const newKey =
            "goya_journey_order_" +
            newName;

        const oldOrder =
            localStorage.getItem(oldKey);

        if(oldOrder){

            localStorage.setItem(
                newKey,
                oldOrder
            );

            localStorage.removeItem(
                oldKey
            );

        }

    }


    await renderDestinations();

    closeModal();

}

async function deleteDestination(
    destination
){

    const ok =
        confirm(
            `確定要移除「${destination}」嗎？\n\n目的地會從首頁移除，但原本的旅程資料不會刪除。`
        );

    if(!ok){

        return;

    }

    destinations =
        destinations.filter(
            d => d !== destination
        );

    saveDestinations();

    localStorage.removeItem(
        "goya_journey_order_" +
        destination
    );

    await renderDestinations();

}

async function renderJourneys(){

    const container =
        document.getElementById(
            "journeyList"
        );

    container.innerHTML = "";

    const {
        data,
        error
    } = await supabaseClient
        .from("trips")
        .select("*")
        .eq(
            "destination",
            currentDestination
        );

    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty-state">
                無法讀取旅程
            </div>
        `;

        return;

    }

    currentTrips =
        data || [];


    currentTrips =
        sortTripsBySavedOrder(
            currentTrips,
            currentDestination
        );


    if(!currentTrips.length){

        container.innerHTML = `
            <div class="empty-state">
                還沒有旅程<br>
                <span style="font-size:12px;">
                    新增你的第一趟旅行吧
                </span>
            </div>
        `;

        return;

    }


    currentTrips.forEach(
        (trip, index) => {

            const meta =
                parseTripDescription(
                    trip.description
                );

            const card =
                document.createElement("div");

            card.className =
                "journey-card";

            card.dataset.index =
                index;

            card.innerHTML = `

                <div class="journey-info">

                    <div class="journey-title">
                        ${escapeHTML(
                            trip.title ||
                            "未命名旅程"
                        )}
                    </div>

                    ${
                        meta.subtitle
                        ? `
                            <div class="journey-subtitle">
                                ${escapeHTML(
                                    meta.subtitle
                                )}
                            </div>
                        `
                        : ""
                    }

                    <div class="journey-meta">
                        ${
                            meta.creator
                            ? "by " +
                              escapeHTML(
                                  meta.creator
                              )
                            : "旅程"
                        }
                    </div>

                </div>

                <div class="journey-arrow">
                    ›
                </div>
            `;


            card.addEventListener(
                "click",
                () => openTrip(trip)
            );


            setupDrag(
                card,
                "journey",
                index
            );


            container.appendChild(card);

        }
    );

}


function parseTripDescription(
    description
){

    if(!description){

        return {
            subtitle:"",
            creator:"",
            description:""
        };

    }

    try{

        const parsed =
            JSON.parse(description);

        if(
            parsed &&
            typeof parsed === "object"
        ){

            return {
                subtitle:
                    parsed.subtitle || "",
                creator:
                    parsed.creator || "",
                description:
                    parsed.description || ""
            };

        }

    }catch(e){}

    return {
        subtitle:"",
        creator:"",
        description:description || ""
    };

}


function sortTripsBySavedOrder(
    trips,
    destination
){

    const key =
        "goya_journey_order_" +
        destination;

    let order = [];

    try{

        order =
            JSON.parse(
                localStorage.getItem(key)
            ) || [];

    }catch(e){

        order = [];

    }


    const map =
        new Map(
            trips.map(
                trip => [trip.id, trip]
            )
        );


    const sorted = [];


    order.forEach(
        id => {

            if(map.has(id)){

                sorted.push(
                    map.get(id)
                );

                map.delete(id);

            }

        }
    );


    trips.forEach(
        trip => {

            if(map.has(trip.id)){

                sorted.push(trip);

            }

        }
    );


    return sorted;

}


function saveJourneyOrder(){

    if(!currentDestination){

        return;

    }

    const key =
        "goya_journey_order_" +
        currentDestination;

    localStorage.setItem(
        key,
        JSON.stringify(
            currentTrips.map(
                trip => trip.id
            )
        )
    );

}

async function saveJourney(){

        document
            .getElementById(

            .value
            .trim();

    const subtitle =
        document
            .getElementById(
                "journeySubtitleInput"
            )
            .value
            .trim();

    const creator =
        document
            .getElementById(
                "journeyCreatorInput"
            )
            .value
            .trim();

    const startDate =
        document
            .getElementById(
                "journeyStartInput"
            )
            .value || null;

    const endDate =
        document
            .getElementById(
                "journeyEndInput"
            )
            .value || null;

    const description =
        document
            .getElementById(
                "journeyDescriptionInput"
            )
            .value
            .trim();


    if(!title){

        alert("請輸入旅程名稱");

        return;

    }


    const storedDescription =
        JSON.stringify({
            subtitle,
            creator,
            description
        });

        data,
        error
    } = await supabaseClient
        .from("trips")
        .insert({
            owner_id:currentUser.id,
            title,
            destination:currentDestination,
            start_date:startDate,
            end_date:endDate,
            description:storedDescription
        })
        .select()
        .single();


    if(error){

        alert(
            "建立失敗：" +
            error.message
        );

        return;

    }


    currentTrips.push(data);

    saveJourneyOrder();

    closeModal();

    await renderJourneys();

}

async function openTrip(trip){

    currentTrip = trip;

    homeView.classList.add(
        "hidden"
    );

    destinationView.classList.add(
        "hidden"
    );

    tripView.classList.remove(
        "hidden"
    );


    const meta =
        parseTripDescription(
            trip.description
        );


    document.getElementById(
        "tripTitle"
    ).textContent =
        trip.title || "未命名旅程";


    document.getElementById(
        "tripSubtitle"
    ).textContent =
        meta.subtitle;


    document.getElementById(
        "tripCreator"
    ).textContent =
        meta.creator
        ? "by " + meta.creator
        : "";


    document.getElementById(
        "tripDescription"
    ).textContent =
        meta.description;


    await loadTripData();

}


async function loadTripData(){

    if(!currentTrip){

        return;

    }


    const [
        itineraryResult,
        stayResult
    ] = await Promise.all([

        supabaseClient
            .from("itineraries")
            .select("*")
            .eq(
                "trip_id",
                currentTrip.id
            )
            .order(
                "day_number",
                {
                    ascending:true
                }
            )
            .order(
                "start_time",
                {
                    ascending:true
                }
            ),

        supabaseClient
            .from("stays")
            .select("*")
            .eq(
                "trip_id",
                currentTrip.id
            )
            .order(
                "check_in",
                {
                    ascending:true
                }
            )

    ]);


    if(itineraryResult.error){

        console.error(
            itineraryResult.error
        );

    }


    if(stayResult.error){

        console.error(
            stayResult.error
        );

    }


    allItineraries =
        itineraryResult.data || [];

    allStays =
        stayResult.data || [];


    renderItineraries();

    renderStays();

    calculateTotal();

}

function renderItineraries(){

    const container =
        document.getElementById(
            "itineraryContainer"
        );

    container.innerHTML = "";


    const dayNumbers =
        [
            ...new Set(
                allItineraries.map(
                    item => item.day_number
                )
            )
        ]
        .sort(
            (a,b) => a-b
        );


    if(!dayNumbers.length){

        return;

    }


    dayNumbers.forEach(
        dayNumber => {

            const dayItems =
                allItineraries.filter(
                    item =>
                        item.day_number ===
                        dayNumber
                );


            const day =
                document.createElement(
                    "div"
                );

            day.className =
                "day-card";


            day.innerHTML = `

                <div class="day-title">
                    Day ${dayNumber}
                </div>

            `;


            dayItems.forEach(
                item => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "item-card";


                    const price =
                        Number(item.price || 0);


                    card.innerHTML = `

                        <div class="item-title">
                            ${escapeHTML(
                                item.title ||
                                "未命名行程"
                            )}
                        </div>

                        ${
                            item.location
                            ? `
                                <div class="item-location">
                                    ${escapeHTML(
                                        item.location
                                    )}
                                </div>
                            `
                            : ""
                        }

                        <div class="item-info">

                            ${
                                item.transport
                                ? `<span>${escapeHTML(item.transport)}</span>`
                                : ""
                            }

                            ${
                                item.duration
                                ? `<span>${escapeHTML(item.duration)}</span>`
                                : ""
                            }

                            ${
                                item.start_time
                                ? `<span>${escapeHTML(formatTime(item.start_time))}</span>`
                                : ""
                            }

                            ${
                                item.end_time
                                ? `<span>～ ${escapeHTML(formatTime(item.end_time))}</span>`
                                : ""
                            }

                            ${
                                price
                                ? `<span>NT$ ${formatMoney(price)}</span>`
                                : ""
                            }

                        </div>

                        ${
                            item.notes
                            ? `
                                <div class="item-notes">
                                    ${escapeHTML(
                                        item.notes
                                    )}
                                </div>
                            `
                            : ""
                        }

                    `;


                    card.addEventListener(
                        "click",
                        () => editItinerary(item)
                    );


                    day.appendChild(card);

                }
            );


            container.appendChild(day);

        }
    );

}

            ).value.trim(),

            document.getElementById(
                "itemTransport"
            ).value.trim(),

        price:
            Number(
                document.getElementById(
                    "itemPrice"
                ).value
            ) || 0,

        duration:
            document.getElementById(
                "itemDuration"
            ).value.trim(),

        start_time:
            document.getElementById(
                "itemStart"
            ).value || null,

        end_time:
            document.getElementById(
                "itemEnd"
            ).value || null,

        notes:
            document.getElementById(
                "itemNotes"
            ).value.trim()

    };


    if(!payload.title){

        alert("請輸入行程名稱");

        return;

    }


    let result;


    if(existingId){

        result =
            await supabaseClient
                .from("itineraries")
                .update(payload)
                .eq(
                    "id",
                    existingId
                );

    }else{

        result =
            await supabaseClient
                .from("itineraries")
                .insert(payload);

    }


    if(result.error){

        alert(
            "儲存失敗：" +
            result.error.message
        );

        return;

    }


    closeModal();

    await loadTripData();

}

/* =========================================================
   DRAG SORT
========================================================= */

/*
    這裡不是用箭頭。

    電腦：
    按住卡片拖曳

    手機：
    長按約 350ms 後開始拖曳
*/

function setupDrag(
    element,
    type,
    index
){

    element.draggable = true;


    element.addEventListener(
        "dragstart",
        e => {

            draggedElement =
                element;

            draggedType =
                type;

            draggedIndex =
                index;

            element.classList.add(
                "dragging"
            );

            e.dataTransfer.effectAllowed =
                "move";

        }
    );


    element.addEventListener(
        "dragend",
        async () => {

            element.classList.remove(
                "dragging"
            );

            document
                .querySelectorAll(
                    ".drag-over"
                )
                .forEach(
                    el =>
                        el.classList.remove(
                            "drag-over"
                        )
                );

            draggedElement = null;

        }
    );


    element.addEventListener(
        "dragover",
        e => {

            e.preventDefault();

            if(
                draggedElement &&
                draggedElement !== element
            ){

                element.classList.add(
                    "drag-over"
                );

            }

        }
    );


    element.addEventListener(
        "dragleave",
        () => {

            element.classList.remove(
                "drag-over"
            );

        }
    );


    element.addEventListener(
        "drop",
        async e => {

            e.preventDefault();

            element.classList.remove(
                "drag-over"
            );

            if(
                !draggedElement ||
                draggedElement === element
            ){

                return;

            }


            const targetIndex =
                Number(
                    element.dataset.index
                );


            if(
                draggedType !== type
            ){

                return;

            }


            if(type === "destination"){

                moveDestination(
                    draggedIndex,
                    targetIndex
                );

            }


            if(type === "journey"){

                moveJourney(
                    draggedIndex,
                    targetIndex
                );

            }

        }
    );


    /* =========================
       MOBILE LONG PRESS
    ========================= */

    element.addEventListener(
        "pointerdown",
        e => {

            if(
                e.pointerType === "mouse"
            ){

                return;

            }


            if(
                e.target.closest("button")
            ){

                return;

            }


            longPressTimer =
                setTimeout(
                    () => {

                        element.classList.add(
                            "dragging"
                        );

                        element.setPointerCapture(
                            e.pointerId
                        );

                        startMobileDrag(
                            element,
                            type,
                            index
                        );

                    },
                    350
                );

        }
    );


    element.addEventListener(
        "pointermove",
        e => {

            if(
                !element.classList.contains(
                    "mobile-dragging"
                )
            ){

                return;

            }


            moveMobileDrag(
                e,
                element,
                type
            );

        }
    );


    element.addEventListener(
        "pointerup",
        async e => {

            clearTimeout(
                longPressTimer
            );


            if(
                !element.classList.contains(
                    "mobile-dragging"
                )
            ){

                return;

            }


            element.classList.remove(
                "mobile-dragging"
            );

            element.classList.remove(
                "dragging"
            );


            const target =
                findDropTarget(
                    e.clientX,
                    e.clientY,
                    type,
                    element
                );


            if(target){

                const targetIndex =
                    Number(
                        target.dataset.index
                    );


                if(type === "destination"){

                    moveDestination(
                        index,
                        targetIndex
                    );

                }


                if(type === "journey"){

                    moveJourney(
                        index,
                        targetIndex
                    );

                }

            }

        }
    );


    element.addEventListener(
        "pointercancel",
        () => {

            clearTimeout(
                longPressTimer
            );

            element.classList.remove(
                "mobile-dragging"
            );

            element.classList.remove(
                "dragging"
            );

        }
    );

}


function startMobileDrag(
    element,
    type,
    index
){

    element.classList.add(
        "mobile-dragging"
    );

    draggedElement =
        element;

    draggedType =
        type;

    draggedIndex =
        index;

    document.body.classList.add(
        "no-select"
    );

}


function moveMobileDrag(
    event,
    element,
    type
){

    const target =
        findDropTarget(
            event.clientX,
            event.clientY,
            type,
            element
        );


    document
        .querySelectorAll(
            ".drag-over"
        )
        .forEach(
            el =>
                el.classList.remove(
                    "drag-over"
                )
        );


    if(target){

        target.classList.add(
            "drag-over"
        );

    }

}


function findDropTarget(
    x,
    y,
    type,
    dragged
){

    const selector =
        type === "destination"
        ? ".destination-card"
        : ".journey-card";


    const elements =
        [...document.querySelectorAll(
            selector
        )];


    let closest = null;

    let closestDistance =
        Infinity;


    elements.forEach(
        element => {

            if(element === dragged){

                return;

            }


            const rect =
                element.getBoundingClientRect();


            if(
                x >= rect.left &&
                x <= rect.right &&
                y >= rect.top &&
                y <= rect.bottom
            ){

                closest =
                    element;

            }


            const centerY =
                rect.top +
                rect.height / 2;


            const distance =
                Math.abs(
                    y - centerY
                );


            if(
                distance <
                closestDistance
            ){

                closestDistance =
                    distance;

                closest =
                    element;

            }

        }
    );


    return closest;

}


async function moveDestination(
    from,
    to
){

    if(from === to){

        return;

    }


    const moved =
        destinations.splice(
            from,
            1
        )[0];


    destinations.splice(
        to,
        0,
        moved
    );


    saveDestinations();

    await renderDestinations();

}


function moveJourney(
    from,
    to
){

    if(from === to){

        return;

    }


    const moved =
        currentTrips.splice(
            from,
            1
        )[0];


    currentTrips.splice(
        to,
        0,
        moved
    );


    saveJourneyOrder();

    renderJourneys();

}

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttr(
    value
){

    return escapeHTML(value);

}


function formatMoney(
    value
){

    return Number(
        value || 0
    ).toLocaleString(
        "zh-TW"
    );

}


function formatTime(
    value
){

    if(!value){

        return "";

    }

    return String(
        value
    ).slice(
        0,
        5
    );

}
