<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GOYA｜走呀</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f4f1;color:#292929;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:900px;margin:0 auto;min-height:100vh;padding-bottom:60px}
:root{--bg:#f5f4f1;--card:#fff;--text:#292929;--sub:#777;--line:#e6e3de;--accent:#6b6b6b;--soft:#efede9;--danger:#b55a5a}
body{background:var(--bg)}
.header{position:sticky;top:0;z-index:20;background:rgba(245,244,241,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-inner{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:22px;font-weight:800;letter-spacing:.5px}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.icon-btn:hover{background:var(--soft)}
.container{padding:20px}
.page-title{font-size:30px;font-weight:800;margin:0 0 8px}
.page-subtitle{font-size:14px;color:var(--sub);margin-bottom:20px}
.section{margin-top:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-title{font-size:20px;font-weight:800;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:640px){.container{padding:14px}.grid{grid-template-columns:1fr}}
.btn{border:0;border-radius:12px;padding:10px 15px;background:#292929;color:#fff;font-weight:700}
.btn.secondary{background:var(--soft);color:var(--text)}
.btn.danger{background:#f4dddd;color:var(--danger)}
.btn.small{padding:8px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none}
.input:focus,textarea:focus,select:focus{border-color:#aaa}
textarea{resize:vertical;min-height:90px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.form-group{margin-bottom:12px}
.form-label{font-size:13px;font-weight:700;margin-bottom:6px;display:block}
.modal-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}
.modal-mask.show{display:flex}
.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.modal-title{font-size:20px;font-weight:800}
.modal-close{border:0;background:var(--soft);width:36px;height:36px;border-radius:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.empty{padding:30px 15px;text-align:center;color:var(--sub)}
.country-card,.trip-card{position:relative}
.country-card{min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.country-cover{position:absolute;inset:0;background-size:cover;background-position:center}
.country-overlay{position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(0,0,0,.7))}
.country-content{position:relative;z-index:1;color:#fff}
.country-name{font-size:23px;font-weight:800}
.country-count{font-size:13px;opacity:.85;margin-top:4px}
.trip-card{cursor:pointer}
.trip-card:hover{transform:translateY(-1px)}
.trip-card{transition:.15s}
.trip-title{font-size:18px;font-weight:800;margin-bottom:7px}
.trip-meta{font-size:13px;color:var(--sub);line-height:1.7}
.trip-actions{display:flex;gap:6px;margin-top:12px}
.trip-actions button{flex:1}
.back-row{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.back-btn{border:0;background:transparent;padding:5px 0;font-weight:700;color:#555}
.breadcrumb{font-size:13px;color:var(--sub);margin-bottom:8px}
.hero{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.hero-image{width:100%;height:240px;object-fit:cover;display:block}
.hero-body{padding:18px}
.hero-title{font-size:27px;font-weight:850;margin:0 0 8px}
.hero-desc{font-size:14px;line-height:1.8;color:#666;white-space:pre-wrap}
.layer-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.layer-tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:999px;white-space:nowrap;font-size:13px;font-weight:700}
.layer-tab.active{background:#292929;color:#fff;border-color:#292929}
.day-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;background:#faf9f7;border-bottom:1px solid var(--line)}
.day-title{font-weight:800}
.day-actions{display:flex;gap:6px}
.item-list{padding:8px}
.item-card{display:flex;gap:12px;padding:12px;border-radius:14px}
.item-card:hover{background:#faf9f7}
.item-time{width:65px;flex:none;font-size:13px;font-weight:800;color:#666;padding-top:2px}
.item-main{min-width:0;flex:1}
.item-title{font-weight:800;margin-bottom:4px}
.item-info{font-size:13px;color:#777;line-height:1.7;white-space:pre-wrap}
.item-actions{display:flex;gap:4px}
.item-actions button{border:0;background:transparent;width:32px;height:32px;border-radius:9px}
.item-actions button:hover{background:#eee}
.add-item{width:100%;border:1px dashed #ccc;background:#fff;color:#666;border-radius:12px;padding:10px;margin-top:6px}
.add-day-wrap{margin-top:10px}
.cost-list,.visa-list,.stay-list{display:flex;flex-direction:column;gap:12px}
.cost-card,.visa-card,.stay-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}
.cost-head,.visa-head,.stay-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cost-name,.visa-name,.stay-name{font-weight:800;font-size:16px}
.cost-price{font-size:18px;font-weight:800;margin-top:5px}
.sub-text{font-size:13px;color:#777;line-height:1.7}
.link-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;text-decoration:none}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:500px){.photo-grid{grid-template-columns:repeat(2,1fr)}}
.photo-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.photo-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.photo-note{padding:9px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.photo-card-actions{display:flex;gap:4px;padding:0 8px 8px}
.photo-card-actions button{flex:1;border:0;background:var(--soft);border-radius:9px;padding:6px;font-size:12px}
.photo-note-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.upload-row{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.notice{background:#f0efec;border-radius:14px;padding:12px 14px;font-size:13px;color:#666;line-height:1.7}
.loading{padding:40px 20px;text-align:center;color:#777}
.error{padding:16px;background:#f9e5e5;color:#a33;border-radius:14px;font-size:13px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:300;background:#292929;color:#fff;padding:11px 17px;border-radius:999px;font-size:13px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.show{display:block}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.05)}
.auth-logo{font-size:30px;font-weight:900;margin-bottom:5px}
.auth-sub{font-size:13px;color:#777;margin-bottom:20px}
.switch-row{display:flex;gap:6px;background:#f2f1ee;padding:4px;border-radius:12px;margin-bottom:18px}
.switch-row button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:#777}
.switch-row button.active{background:#fff;color:#292929;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.user-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.user-info{font-size:13px;color:#777}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.flight-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}
.flight-price{font-size:18px;font-weight:800;margin-bottom:10px}
.flight-route{font-size:16px;font-weight:800;margin-bottom:4px}
.flight-airline{font-size:13px;color:#777;margin-bottom:10px}
.flight-line{font-size:14px;line-height:1.9}
.flight-note{font-size:13px;color:#777;white-space:pre-wrap;margin-top:8px}
.detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.detail-row:last-child{border-bottom:0}
.detail-label{color:#777}
.detail-value{font-weight:700;text-align:right;white-space:pre-wrap}
.stay-meta{font-size:13px;color:#777;line-height:1.7;margin-top:6px}
.currency-row{display:grid;grid-template-columns:1fr 120px;gap:8px}
@media(max-width:500px){.currency-row{grid-template-columns:1fr}}
.twd-value{font-size:13px;color:#777;margin-top:5px}
.item-detail{background:#faf9f7;border-radius:13px;padding:12px;margin-top:8px}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px}
.checkbox-row input{width:auto}
.drag-handle{cursor:grab;color:#aaa;padding-top:2px}
.trip-order-actions{display:flex;gap:5px}
.trip-order-actions button{border:0;background:var(--soft);border-radius:8px;width:30px;height:30px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modalMask" class="modal-mask">
<div id="modal" class="modal"></div>
</div>
<script>
const SUPABASE_URL="https://iutemzxxdxvcobndrnii.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_xoMl-Lyx5VgkRm5iP5-j0Q_DPWUtQBN";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser=null;
let currentLayer=1;
let currentDestination=null;
let currentTrip=null;
let currentDay=null;
let destinations=[];
let currentTrips=[];
let currentItineraries=[];
let currentCosts=[];
let currentVisas=[];
let currentStays=[];
let currentPhotos=[];
let editingItemId=null;
let editingCostId=null;
let editingVisaId=null;
let editingStayId=null;
let editingPhotoId=null;
let navigationRestoring=false;

const app=document.getElementById("app");
const modalMask=document.getElementById("modalMask");
const modal=document.getElementById("modal");
const toastEl=document.getElementById("toast");

function showToast(message){
toastEl.textContent=message;
toastEl.classList.add("show");
clearTimeout(window.__toastTimer);
window.__toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2200);
}

function escapeHtml(value){
return String(value??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function formatDate(value){
if(!value)return"";
const d=new Date(value);
if(Number.isNaN(d.getTime()))return String(value);
return`${d.getMonth()+1}/${d.getDate()}`;
}

function formatMoney(value,currency="TWD"){
const n=Number(value||0);
return`${n.toLocaleString("en-US",{maximumFractionDigits:2})} ${currency}`;
}

function simpleFlightDateTime(value){
if(!value)return"";
const d=new Date(value);
if(Number.isNaN(d.getTime()))return String(value).replace("T"," ");
return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function openModal(html){
modal.innerHTML=html;
modalMask.classList.add("show");
}

function closeModal(){
modalMask.classList.remove("show");
modal.innerHTML="";
editingItemId=null;
editingCostId=null;
editingVisaId=null;
editingStayId=null;
editingPhotoId=null;
}

modalMask.addEventListener("click",e=>{
if(e.target===modalMask)closeModal();
});

function saveNavigationState(){
try{
localStorage.setItem("goya_navigation",JSON.stringify({
layer:currentLayer,
destinationId:currentDestination?.id||null,
tripId:currentTrip?.id||null,
dayId:currentDay?.id||null
}));
}catch(e){}
}

function getNavigationState(){
try{
return JSON.parse(localStorage.getItem("goya_navigation")||"null");
}catch(e){
return null;
}
}

function saveTripOrder(tripId,ids){
try{
localStorage.setItem("goya_itinerary_order_"+String(tripId),JSON.stringify(ids));
}catch(e){}
}

function getTripOrder(tripId){
try{
const value=JSON.parse(localStorage.getItem("goya_itinerary_order_"+String(tripId)||"[]"));
return Array.isArray(value)?value:[];
}catch(e){
return[];
}
}

function applyTripOrder(items,tripId){
const saved=getTripOrder(tripId);
const map=new Map(items.map(x=>[String(x.id),x]));
const ordered=[];
saved.forEach(id=>{
const item=map.get(String(id));
if(item){
ordered.push(item);
map.delete(String(id));
}
});
[...map.values()]
.sort((a,b)=>{
const da=Number(a.day_number||0);
const db=Number(b.day_number||0);
if(da!==db)return da-db;
return 0;
})
.forEach(x=>ordered.push(x));
saveTripOrder(tripId,ordered.map(x=>x.id));
return ordered;
}

async function loadUser(){
const{data,error}=await supabaseClient.auth.getUser();
if(error){
console.error(error);
}
currentUser=data?.user||null;
}

async function signOut(){
await supabaseClient.auth.signOut();
currentUser=null;
currentLayer=1;
currentDestination=null;
currentTrip=null;
currentDay=null;
renderAuth();
}

function renderAuth(){
app.innerHTML=`
<div class="auth-wrap">
<div class="auth-card">
<div class="auth-logo">GOYA｜走呀</div>
<div class="auth-sub">小資也能飛，走呀就對了。</div>
<div class="switch-row">
<button id="loginTab" class="active" onclick="switchAuthMode('login')">登入</button>
<button id="signupTab" onclick="switchAuthMode('signup')">註冊</button>
</div>
<div id="authForm"></div>
</div>
</div>`;
switchAuthMode("login");
}

function switchAuthMode(mode){
const loginTab=document.getElementById("loginTab");
const signupTab=document.getElementById("signupTab");
if(!loginTab||!signupTab)return;
loginTab.classList.toggle("active",mode==="login");
signupTab.classList.toggle("active",mode==="signup");
const form=document.getElementById("authForm");
if(mode==="login"){
form.innerHTML=`
<div class="form-group">
<label class="form-label">Email</label>
<input id="authEmail" class="input" type="email" autocomplete="email">
</div>
<div class="form-group">
<label class="form-label">密碼</label>
<input id="authPassword" class="input" type="password" autocomplete="current-password">
</div>
<button class="btn" style="width:100%" onclick="handleLogin()">登入</button>`;
}else{
form.innerHTML=`
<div class="form-group">
<label class="form-label">Email</label>
<input id="authEmail" class="input" type="email" autocomplete="email">
</div>
<div class="form-group">
<label class="form-label">密碼</label>
<input id="authPassword" class="input" type="password" autocomplete="new-password">
</div>
<button class="btn" style="width:100%" onclick="handleSignup()">建立帳號</button>`;
}
}

async function handleLogin(){
const email=document.getElementById("authEmail")?.value.trim();
const password=document.getElementById("authPassword")?.value;
if(!email||!password){
showToast("請輸入 Email 與密碼");
return;
}
const{error}=await supabaseClient.auth.signInWithPassword({email,password});
if(error){
showToast(error.message||"登入失敗");
return;
}
await init();
}

async function handleSignup(){
const email=document.getElementById("authEmail")?.value.trim();
const password=document.getElementById("authPassword")?.value;
if(!email||!password){
showToast("請輸入 Email 與密碼");
return;
}
if(password.length<6){
showToast("密碼至少需要 6 碼");
return;
}
const{error}=await supabaseClient.auth.signUp({email,password});
if(error){
showToast(error.message||"註冊失敗");
return;
}
showToast("註冊成功，請依 Email 驗證後登入");
}

function renderHeader(title="",showBack=false){
return`
<div class="header">
<div class="header-inner">
<div style="display:flex;align-items:center;gap:8px">
${showBack?`<button class="icon-btn" onclick="goBack()">←</button>`:""}
<div class="logo">${escapeHtml(title||"GOYA｜走呀")}</div>
</div>
<div class="header-actions">
${currentUser?`<button class="icon-btn" title="登出" onclick="signOut()">↪</button>`:""}
</div>
</div>
</div>`;
}

function goBack(){
if(currentLayer===4){
currentLayer=3;
currentDay=null;
renderTrip();
}else if(currentLayer===3){
currentLayer=2;
currentTrip=null;
renderDestination();
}else if(currentLayer===2){
currentLayer=1;
currentDestination=null;
renderHome();
}else{
renderHome();
}
saveNavigationState();
}

async function renderHome(){
currentLayer=1;
currentDestination=null;
currentTrip=null;
currentDay=null;
saveNavigationState();
app.innerHTML=renderHeader("GOYA｜走呀")+`
<div class="container">
<div class="user-bar">
<div>
<div class="page-title">走呀，去哪裡？</div>
<div class="user-info">${escapeHtml(currentUser?.email||"")}</div>
</div>
<div class="page-actions">
<button class="btn" onclick="openDestinationModal()">＋新增目的地</button>
</div>
</div>
<div class="section">
<div class="section-head">
<h2 class="section-title">我的旅遊目的地</h2>
</div>
<div id="destinationList" class="grid"><div class="loading">載入中…</div></div>
</div>
</div>`;
await loadDestinations();
renderDestinationList();
}

async function loadDestinations(){
if(!currentUser){
destinations=[];
return;
}
const{data,error}=await supabaseClient
.from("destinations")
.select("*")
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false});
if(error){
console.error(error);
destinations=[];
return;
}
destinations=data||[];
}

function renderDestinationList(){
const el=document.getElementById("destinationList");
if(!el)return;
if(!destinations.length){
el.innerHTML=`<div class="card empty" style="grid-column:1/-1">還沒有目的地<br><button class="btn small" style="margin-top:12px" onclick="openDestinationModal()">＋新增第一個目的地</button></div>`;
return;
}
el.innerHTML=destinations.map(d=>`
<div class="card country-card" onclick="openDestination(${Number(d.id)})">
${d.image_url?`<div class="country-cover" style="background-image:url('${escapeHtml(d.image_url)}')"></div>`:`<div class="country-cover" style="background:#ddd"></div>`}
<div class="country-overlay"></div>
<div class="country-content">
<div class="country-name">${escapeHtml(d.name||"未命名目的地")}</div>
<div class="country-count">${escapeHtml(d.description||"")}</div>
</div>
</div>`).join("");
}

function openDestinationModal(id=null){
const d=id?destinations.find(x=>String(x.id)===String(id)):null;
openModal(`
<div class="modal-head">
<div class="modal-title">${d?"編輯目的地":"新增目的地"}</div>
<button class="modal-close" onclick="closeModal()">×</button>
</div>
<div class="form-group">
<label class="form-label">目的地名稱</label>
<input id="destinationName" class="input" value="${escapeHtml(d?.name||"")}">
</div>
<div class="form-group">
<label class="form-label">封面圖片網址</label>
<input id="destinationImage" class="input" value="${escapeHtml(d?.image_url||"")}" placeholder="https://...">
</div>
<div class="form-group">
<label class="form-label">備注</label>
<textarea id="destinationDescription">${escapeHtml(d?.description||"")}</textarea>
</div>
<div class="modal-actions">
${d?`<button class="btn danger" onclick="deleteDestination(${Number(d.id)})">刪除</button>`:""}
<button class="btn secondary" onclick="closeModal()">取消</button>
<button class="btn" onclick="saveDestination(${d?Number(d.id):"null"})">儲存</button>
</div>`);
}

async function saveDestination(id){
const name=document.getElementById("destinationName")?.value.trim();
const image_url=document.getElementById("destinationImage")?.value.trim();
const description=document.getElementById("destinationDescription")?.value.trim();
if(!name){
showToast("請輸入目的地名稱");
return;
}
const payload={name,image_url,description};
let result;
if(id){
result=await supabaseClient.from("destinations").update(payload).eq("id",id).eq("user_id",currentUser.id);
}else{
result=await supabaseClient.from("destinations").insert({...payload,user_id:currentUser.id});
}
if(result.error){
console.error(result.error);
showToast(result.error.message||"儲存失敗");
return;
}
closeModal();

price:price===""?null:Number(price),
currency,

async function convertToTwd(price,currency){
if(!price||currency==="TWD")return Number(price||0);
try{
const response=await fetch(`https://api.frankfurter.dev/v2/rate/${encodeURIComponent(currency)}/twd`);
if(!response.ok)throw new Error("rate error");
const data=await response.json();
return Number(price)*Number(data.rate);
}catch(e){
console.error(e);
return null;
}
}

</div>`);

file?.addEventListener("change",()=>{
const f=file.files?.[0];
if(f)previewPhotoFile(f);
});
const paste=document.getElementById("photoPaste");
paste?.addEventListener("paste",e=>{
const items=e.clipboardData?.items||[];
for(const item of items){
if(item.type.startsWith("image/")){
const file=item.getAsFile();
if(file)previewPhotoFile(file);
e.preventDefault();
break;
}
}
});
if(p?.image_data||p?.image_url){
document.getElementById("photoPreview").innerHTML=`<img src="${escapeHtml(p.image_data||p.image_url)}" style="width:100%;max-height:300px;object-fit:contain;border-radius:12px">`;
}
}

function previewPhotoFile(file){
const reader=new FileReader();
reader.onload=()=>{
window.__photoData=reader.result;
const el=document.getElementById("photoPreview");
if(el)el.innerHTML=`<img src="${escapeHtml(reader.result)}" style="width:100%;max-height:300px;object-fit:contain;border-radius:12px">`;
};
reader.readAsDataURL(file);
}

async function restoreNavigation(){
const nav=getNavigationState();
if(!nav||!currentUser){
renderHome();
return;
}
if(nav.layer===1){
renderHome();
return;
}
await loadDestinations();
const destination=destinations.find(x=>String(x.id)===String(nav.destinationId));
if(!destination){
renderHome();
return;
}
currentDestination=destination;
await loadTrips();
if(nav.layer===2){
currentLayer=2;
renderDestination();
return;
}
const trip=currentTrips.find(x=>String(x.id)===String(nav.tripId));
if(!trip){
currentLayer=2;
renderDestination();
return;
}
currentTrip=trip;
await Promise.all([loadItineraries(),loadCosts(),loadVisas(),loadStays(),loadPhotos()]);
if(nav.layer===4){
currentLayer=4;
renderTripDetail(nav.section||"cost");
}else{
currentLayer=3;
renderTrip();
}
}

async function init(){
await loadUser();
if(!currentUser){
renderAuth();
return;
}
await restoreNavigation();
}

supabaseClient.auth.onAuthStateChange(async(event,session)=>{
if(event==="SIGNED_OUT"){
currentUser=null;
renderAuth();
}else if(event==="SIGNED_IN"&&session){
currentUser=session.user;
await restoreNavigation();
}
});

init();
</script>
