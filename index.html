<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>GOYA｜走呀</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#f5f4f1;
    --card:#ffffff;
    --text:#292929;
    --muted:#8b8b87;
    --line:#e4e2dd;
    --soft:#eeece7;
    --dark:#292929;
    --danger:#a85d55;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
}

.app{
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(245,244,241,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(0,0,0,.05);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    min-height:66px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.logo{
    border:0;
    background:none;
    padding:0;
    font-weight:800;
    font-size:20px;
    letter-spacing:.5px;
    color:var(--text);
}

.logo span{
    font-size:11px;
    color:var(--muted);
    margin-left:5px;
    font-weight:500;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    width:40px;
    height:40px;
}

/* =========================
   MAIN
========================= */

.main{
    max-width:1100px;
    margin:auto;
    padding:25px 18px 80px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.hero{
    padding:35px 5px 28px;
}

.hero h1{
    margin:0;
    font-size:38px;
    letter-spacing:-1px;
}

.hero p{
    margin:10px 0 0;
    color:var(--muted);
    line-height:1.7;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:25px 0 14px;
}

.section-head h2{
    margin:0;
    font-size:21px;
}

.btn{
    border:0;
    border-radius:12px;
    padding:11px 15px;
    background:var(--dark);
    color:#fff;
    font-weight:700;
}

.btn.light{
    background:#fff;
    color:var(--text);
    border:1px solid var(--line);
}

.btn.danger{
    background:var(--danger);
}

.btn.small{
    padding:8px 11px;
    font-size:13px;
}

/* =========================
   CARDS
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    background:var(--card);
    border:1px solid rgba(0,0,0,.04);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

.card-photo{
    width:100%;
    aspect-ratio:1/1;
    background:#ebe9e4;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa7a1;
    overflow:hidden;
}

.card-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-body{
    padding:16px;
}

.card-title{
    font-weight:800;
    font-size:18px;
}

.card-sub{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

.card-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.card-actions button{
    flex:1;
}

/* =========================
   DESTINATION
========================= */

.destination-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.destination-card{
    background:#fff;
    border-radius:20px;
    padding:22px;
    border:1px solid var(--line);
    min-height:150px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.destination-card h3{
    margin:0;
    font-size:21px;
}

.destination-card p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:13px;
}

.destination-card .arrow{
    margin-top:20px;
    font-size:13px;
    font-weight:700;
}

/* =========================
   TRIP
========================= */

.trip-header{
    background:#fff;
    border-radius:22px;
    padding:24px;
    border:1px solid var(--line);
}

.back{
    border:0;
    background:none;
    padding:0;
    color:var(--muted);
    margin-bottom:18px;
}

.trip-title{
    font-size:30px;
    font-weight:800;
    margin:0;
}

.trip-sub{
    color:var(--muted);
    margin-top:8px;
    line-height:1.6;
}

.trip-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
    flex-wrap:wrap;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:15px;
}

.info-box{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
}

.info-box .label{
    color:var(--muted);
    font-size:12px;
}

.info-box .value{
    margin-top:7px;
    font-weight:700;
    word-break:break-word;
}

/* =========================
   DAY
========================= */

.day-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.day-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
}

.day-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-start;
}

.day-title{
    font-size:20px;
    font-weight:800;
}

.day-note{
    margin-top:5px;
    color:var(--muted);
    white-space:pre-wrap;
}

.day-actions{
    display:flex;
    gap:6px;
}

.day-items{
    margin-top:15px;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.activity{
    background:#f7f6f3;
    border-radius:14px;
    padding:13px;
}

.activity-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.activity-name{
    font-weight:800;
}

.activity-time{
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
}

.activity-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
}

.meta-chip{
    background:#eae8e2;
    padding:5px 8px;
    border-radius:8px;
    font-size:12px;
}

.activity-note{
    color:#666;
    font-size:13px;
    line-height:1.6;
    margin-top:8px;
    white-space:pre-wrap;
}

.activity-actions{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.activity-actions button{
    font-size:12px;
    padding:6px 9px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
}

/* =========================
   VISA
========================= */

.visa-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.visa-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:17px;
    padding:17px;
}

.visa-main{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}

.visa-name{
    font-weight:800;
    font-size:17px;
}

.visa-price{
    font-weight:800;
    white-space:pre-wrap;
    text-align:right;
}

.visa-link{
    display:inline-block;
    margin-top:9px;
    font-size:13px;
    color:#666;
    word-break:break-all;
}

.visa-actions{
    display:flex;
    gap:6px;
    margin-top:12px;
}

/* =========================
   PHOTOS
========================= */

.photo-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.photo-item{
    aspect-ratio:1/1;
    border-radius:13px;
    overflow:hidden;
    background:#e9e7e2;
    position:relative;
}

.photo-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-delete{
    position:absolute;
    top:6px;
    right:6px;
    width:30px;
    height:30px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:#fff;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:50px 20px;
    text-align:center;
    color:var(--muted);
    background:#fff;
    border:1px dashed var(--line);
    border-radius:18px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(650px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:22px;
    padding:22px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-head h2{
    margin:0;
}

.close{
    width:38px;
    height:38px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
}

.form{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    font-size:13px;
    font-weight:700;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid var(--line);
    border-radius:11px;
    padding:12px;
    outline:none;
    background:#fff;
}

.field textarea{
    min-height:95px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#aaa;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:5px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#292929;
    color:#fff;
    padding:12px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
    font-size:14px;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){
    .grid,
    .destination-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .photo-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:560px){
    .main{
        padding:18px 14px 70px;
    }

    .hero{
        padding:25px 3px 20px;
    }

    .hero h1{
        font-size:31px;
    }

    .grid,
    .destination-grid{
        grid-template-columns:1fr;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .photo-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .trip-title{
        font-size:26px;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .header-inner{
        padding:0 14px;
    }

    .logo{
        font-size:18px;
    }

    .logo span{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="header-inner">

        <button class="logo" onclick="goHome()">
            GOYA｜走呀
            <span>旅行規劃</span>
        </button>

        <div class="header-actions">
            <button class="icon-btn" onclick="openDestinationModal()">＋</button>
        </div>

    </div>
</header>

<main class="main">

    <!-- =========================
         第1層：主頁
    ========================== -->

    <section id="page-home" class="page">

        <div class="hero">
            <h1>想去哪裡，走呀。</h1>
            <p>
                把想去的國家、旅程、Day 行程全部整理在一起。
            </p>
        </div>

        <div class="section-head">
            <h2>我的目的地</h2>
            <button class="btn" onclick="openDestinationModal()">
                ＋ 新增目的地
            </button>
        </div>

        <div id="destinationGrid" class="destination-grid"></div>

    </section>


    <!-- =========================
         第2層：國家／目的地
    ========================== -->

    <section id="page-destination" class="page">

        <button class="back" onclick="goHome()">
            ← 回主頁
        </button>

        <div class="trip-header">
            <div class="trip-title" id="destinationTitle"></div>
            <div class="trip-sub" id="destinationSubtitle"></div>

            <div class="trip-actions">
                <button class="btn" onclick="openTripModal()">
                    ＋ 新增旅程
                </button>

                <button class="btn light" onclick="editCurrentDestination()">
                    編輯目的地
                </button>

                <button class="btn danger" onclick="deleteCurrentDestination()">
                    刪除
                </button>
            </div>
        </div>

        <div class="section-head">
            <h2>旅程</h2>
        </div>

        <div id="tripGrid" class="grid"></div>

    </section>


    <!-- =========================
         第3層：單一旅程
    ========================== -->

    <section id="page-trip" class="page">

        <button class="back" onclick="goDestination()">
            ← 回目的地
        </button>

        <div class="trip-header">

            <div class="trip-title" id="tripTitle"></div>

            <div class="trip-sub" id="tripSubtitle"></div>

            <div class="trip-actions">

                <button class="btn" onclick="openDayModal()">
                    ＋ 新增 Day
                </button>

                <button class="btn light" onclick="openTripModal(currentTripId)">
                    編輯旅程
                </button>

                <button class="btn light" onclick="openVisaModal()">
                    ＋ 新增簽證
                </button>

            </div>

        </div>


        <div class="info-grid">

            <div class="info-box">
                <div class="label">日期</div>
                <div class="value" id="tripDate"></div>
            </div>

            <div class="info-box">
                <div class="label">天數</div>
                <div class="value" id="tripDays"></div>
            </div>

            <div class="info-box">
                <div class="label">備註</div>
                <div class="value" id="tripNote"></div>
            </div>

        </div>


        <!-- DAY -->

        <div class="section-head">
            <h2>旅程行程</h2>

            <button class="btn small" onclick="openDayModal()">
                ＋ Day
            </button>
        </div>

        <div id="dayList" class="day-list"></div>


        <!-- VISA -->

        <div class="section-head">
            <h2>簽證</h2>

            <button class="btn small" onclick="openVisaModal()">
                ＋ 新增
            </button>
        </div>

        <div id="visaList" class="visa-list"></div>


    </section>


    <!-- =========================
         第4層：Day 詳細
    ========================== -->

    <section id="page-day" class="page">

        <button class="back" onclick="goTrip()">
            ← 回旅程
        </button>

        <div class="trip-header">

            <div class="trip-title" id="dayDetailTitle"></div>

            <div class="trip-sub" id="dayDetailNote"></div>

            <div class="trip-actions">

                <button class="btn" onclick="openActivityModal()">
                    ＋ 新增行程
                </button>

                <button class="btn light" onclick="editCurrentDay()">
                    編輯 Day
                </button>

            </div>

        </div>

        <div class="section-head">
            <h2>行程</h2>
        </div>

        <div id="activityList" class="day-list"></div>


        <div class="section-head">
            <h2>照片</h2>

            <button class="btn small" onclick="document.getElementById('photoInput').click()">
                ＋ 新增照片
            </button>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
                multiple
                style="display:none"
                onchange="handlePhotos(event)"
            >
        </div>

        <div id="photoGrid" class="photo-grid"></div>

    </section>

</main>

</div>


<!-- =========================
     DESTINATION MODAL
========================= -->

<div id="destinationModal" class="modal">

    <div class="modal-box">

        <div class="modal-head">
            <h2 id="destinationModalTitle">新增目的地</h2>
            <button class="close" onclick="closeModal('destinationModal')">×</button>
        </div>

        <form class="form" onsubmit="saveDestination(event)">

            <input type="hidden" id="destinationEditId">

            <div class="field">
                <label>國家／目的地名稱</label>
                <input id="destinationName" required placeholder="例如：日本">
            </div>

            <div class="field">
                <label>副標題</label>
                <input id="destinationSubtitle" placeholder="例如：東京・大阪・京都">
            </div>

            <div class="field">
                <label>照片網址（可留白）</label>
                <input id="destinationPhoto" placeholder="https://...">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn light" onclick="closeModal('destinationModal')">
                    取消
                </button>

                <button class="btn" type="submit">
                    儲存
                </button>
            </div>

        </form>

    </div>

</div>


<!-- =========================
     TRIP MODAL
========================= -->

<div id="tripModal" class="modal">

    <div class="modal-box">

        <div class="modal-head">
            <h2 id="tripModalTitle">新增旅程</h2>
            <button class="close" onclick="closeModal('tripModal')">×</button>
        </div>

        <form class="form" onsubmit="saveTrip(event)">

            <input type="hidden" id="tripEditId">

            <div class="field">
                <label>旅程名稱</label>
                <input id="tripName" required placeholder="例如：2026 大阪京都自由行">
            </div>

            <div class="field">
                <label>副標題</label>
                <input id="tripSubtitleInput" placeholder="例如：五天四夜">
            </div>

            <div class="form-row">

                <div class="field">
                    <label>開始日期</label>
                    <input id="tripStart" type="date">
                </div>

                <div class="field">
                    <label>結束日期</label>
                    <input id="tripEnd" type="date">
                </div>

            </div>

            <div class="field">
                <label>備註</label>
                <textarea id="tripNoteInput" placeholder="旅程備註"></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn light" onclick="closeModal('tripModal')">
                    取消
                </button>

                <button class="btn" type="submit">
                    儲存
                </button>
            </div>

        </form>

    </div>

</div>


<!-- =========================
     DAY MODAL
========================= -->

<div id="dayModal" class="modal">

    <div class="modal-box">

        <div class="modal-head">
            <h2 id="dayModalTitle">新增 Day</h2>
            <button class="close" onclick="closeModal('dayModal')">×</button>
        </div>

        <form class="form" onsubmit="saveDay(event)">

            <input type="hidden" id="dayEditId">

            <div class="field">
                <label>Day</label>
                <input id="dayNumber" type="number" min="1" required>
            </div>

            <div class="field">
                <label>標題</label>
                <input id="dayTitleInput" placeholder="例如：大阪市區">
            </div>

            <div class="field">
                <label>備註</label>
                <textarea id="dayNoteInput" placeholder="今天的行程備註"></textarea>
            </div>

            <div class="modal-actions">

                <button type="button" class="btn light" onclick="closeModal('dayModal')">
                    取消
                </button>

                <button class="btn" type="submit">
                    儲存 Day
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     ACTIVITY MODAL
========================= -->

<div id="activityModal" class="modal">

    <div class="modal-box">

        <div class="modal-head">
            <h2 id="activityModalTitle">新增行程</h2>
            <button class="close" onclick="closeModal('activityModal')">×</button>
        </div>

        <form class="form" onsubmit="saveActivity(event)">

            <input type="hidden" id="activityEditId">

            <div class="field">
                <label>時間</label>
                <input id="activityTime" placeholder="例如：10:30">
            </div>

            <div class="field">
                <label>行程名稱</label>
                <input id="activityName" required placeholder="例如：清水寺">
            </div>

            <div class="field">
                <label>交通資訊</label>
                <input id="activityTransport" placeholder="例如：搭乘 JR">
            </div>

            <div class="form-row">

                <div class="field">
                    <label>價格</label>
                    <input
                        id="activityPrice"
                        type="text"
                        placeholder="自由輸入，例如 ₩50,000 / ¥3,000 / 免費"
                    >
                </div>

                <div class="field">
                    <label>需要時間</label>
                    <input
                        id="activityDuration"
                        type="text"
                        placeholder="例如：2 小時"
                    >
                </div>

            </div>

            <div class="field">
                <label>連結</label>
                <input id="activityLink" placeholder="https://...">
            </div>

            <div class="field">
                <label>備註</label>
                <textarea id="activityNote" placeholder="備註"></textarea>
            </div>

            <div class="modal-actions">

                <button type="button" class="btn light" onclick="closeModal('activityModal')">
                    取消
                </button>

                <button class="btn" type="submit">
                    儲存行程
                </button>

            </div>

        </form>

    </div>

</div>

     VISA MODAL
========================= -->

<div id="visaModal" class="modal">

        <div class="modal-head">

                <label>連結</label>
                <input

                    placeholder="https://..."
                >
            </div>

                <label>價格</label>
                <input
                    id="visaPrice"
                    type="text"
                    placeholder="自由輸入，例如 NT$1,000 / USD 30 / 免費"
                >

                </button>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* ============================================================
   GOYA｜走呀
   資料儲存
============================================================ */

const STORAGE_KEY = "GOYA_TRAVEL_DATA_V2";
const STATE_KEY = "GOYA_PAGE_STATE_V2";

let data = loadData();

let state = {
    page:"home",
    destinationId:null,
    tripId:null,
    dayId:null
};

loadState();


/* ============================================================
   DATA
============================================================ */

function loadData(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(saved){
            return JSON.parse(saved);
        }

    }catch(e){

        console.error(e);

    }

    return {
        destinations:[]
    };

}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


function loadState(){

    try{

        const saved = localStorage.getItem(STATE_KEY);

        if(saved){
            state = {
                ...state,
                ...JSON.parse(saved)
            };
        }

    }catch(e){

        console.error(e);

    }

}


function saveState(){

    localStorage.setItem(
        STATE_KEY,
        JSON.stringify(state)
    );

}


/* ============================================================
   HELPERS
============================================================ */

function uid(){

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2);

}


function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(m){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[m];

        });

}


function getDestination(){

    return data.destinations.find(
        x => x.id === state.destinationId
    );

}


function getTrip(){

    const destination = getDestination();

    if(!destination) return null;

    return destination.trips.find(
        x => x.id === state.tripId
    );

}


function getDay(){

    const trip = getTrip();

    if(!trip) return null;

    return trip.days.find(
        x => x.id === state.dayId
    );

}


function toast(message){

    const el = document.getElementById("toast");

    el.textContent = message;

    el.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(function(){

        el.classList.remove("show");

    },1800);

}


function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}


function openModal(id){

    document
        .getElementById(id)
        .classList.add("show");

}


/* ============================================================
   PAGE NAVIGATION
============================================================ */

function showPage(id){

    document
        .querySelectorAll(".page")
        .forEach(page => page.classList.remove("active"));

    document
        .getElementById(id)
        .classList.add("active");

}


function goHome(){

    state.page = "home";
    state.destinationId = null;
    state.tripId = null;
    state.dayId = null;

    saveState();

    renderHome();

}


function goDestination(){

    if(!state.destinationId){

        goHome();
        return;

    }

    state.page = "destination";
    state.tripId = null;
    state.dayId = null;

    saveState();

    renderDestination();

}


function goTrip(){

    if(!state.destinationId || !state.tripId){

        goHome();
        return;

    }

    state.page = "trip";
    state.dayId = null;

    saveState();

    renderTrip();

}


function goDay(){

    if(!state.destinationId ||
       !state.tripId ||
       !state.dayId){

        goTrip();
        return;

    }

    state.page = "day";

    saveState();

    renderDay();

}


/* ============================================================
   HOME
============================================================ */

function renderHome(){

    showPage("page-home");

    const grid =
        document.getElementById("destinationGrid");

    if(!data.destinations.length){

        grid.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                還沒有目的地。<br>
                點上面的「＋」開始建立你的旅行。
            </div>
        `;

        return;

    }

    grid.innerHTML = data.destinations.map(function(destination){

        const photo =
            destination.photo
            ? `<img src="${esc(destination.photo)}">`
            : "";

        const count =
            (destination.trips || []).length;

        return `
            <article class="card">

                <div
                    class="card-photo"
                    onclick="openDestination('${destination.id}')"
                    style="cursor:pointer"
                >
                    ${photo || "GOYA"}
                </div>

                <div class="card-body">

                    <div
                        class="card-title"
                        onclick="openDestination('${destination.id}')"
                        style="cursor:pointer"
                    >
                        ${esc(destination.name)}
                    </div>

                    <div class="card-sub">
                        ${esc(destination.subtitle || "")}
                    </div>

                    <div class="card-sub">
                        ${count} 個旅程
                    </div>

                    <div class="card-actions">

                        <button
                            class="btn"
                            onclick="openDestination('${destination.id}')"
                        >
                            查看
                        </button>

                        <button
                            class="btn light"
                            onclick="openDestinationModal('${destination.id}')"
                        >
                            編輯
                        </button>

                    </div>

                </div>

            </article>
        `;

    }).join("");

}


/* ============================================================
   DESTINATION
============================================================ */

function openDestination(id){

    state.destinationId = id;
    state.tripId = null;
    state.dayId = null;
    state.page = "destination";

    saveState();

    renderDestination();

}


function renderDestination(){

    const destination = getDestination();

    if(!destination){

        goHome();
        return;

    }

    showPage("page-destination");

    document.getElementById("destinationTitle")
        .textContent = destination.name;

    document.getElementById("destinationSubtitle")
        .textContent = destination.subtitle || "";

    const grid =
        document.getElementById("tripGrid");

    const trips =
        destination.trips || [];

    if(!trips.length){

        grid.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                這個目的地還沒有旅程。
            </div>
        `;

        return;

    }

    grid.innerHTML = trips.map(function(trip){

        const days =
            (trip.days || []).length;

        return `
            <article class="card">

                <div class="card-body">

                    <div
                        class="card-title"
                        onclick="openTrip('${trip.id}')"
                        style="cursor:pointer"
                    >
                        ${esc(trip.name)}
                    </div>

                    <div class="card-sub">
                        ${esc(trip.subtitle || "")}
                    </div>

                    <div class="card-sub">
                        ${days} Day
                    </div>

                    <div class="card-sub">
                        ${esc(formatDateRange(trip.start,trip.end))}
                    </div>

                    <div class="card-actions">

                        <button
                            class="btn"
                            onclick="openTrip('${trip.id}')"
                        >
                            開啟旅程
                        </button>

                        <button
                            class="btn light"
                            onclick="openTripModal('${trip.id}')"
                        >
                            編輯
                        </button>

                    </div>

                </div>

            </article>
        `;

    }).join("");

}


/* ============================================================
   DESTINATION CRUD
============================================================ */

function openDestinationModal(id=null){

    document.getElementById("destinationEditId").value =
        id || "";

    if(id){

        const destination =
            data.destinations.find(
                x => x.id === id
            );

        if(!destination) return;

        document.getElementById("destinationModalTitle")
            .textContent = "編輯目的地";

        document.getElementById("destinationName")
            .value = destination.name || "";

        document.getElementById("destinationSubtitle")
            .value = destination.subtitle || "";

        document.getElementById("destinationPhoto")
            .value = destination.photo || "";

    }else{

        document.getElementById("destinationModalTitle")
            .textContent = "新增目的地";

        document.getElementById("destinationName")
            .value = "";

        document.getElementById("destinationSubtitle")
            .value = "";

        document.getElementById("destinationPhoto")
            .value = "";

    }

    openModal("destinationModal");

}


function saveDestination(event){

    event.preventDefault();

    const id =
        document.getElementById("destinationEditId").value;

    const name =
        document.getElementById("destinationName")
            .value.trim();

    const subtitle =
        document.getElementById("destinationSubtitle")
            .value.trim();

    const photo =
        document.getElementById("destinationPhoto")
            .value.trim();

    if(!name){

        toast("請輸入目的地名稱");
        return;

    }

    if(id){

        const destination =
            data.destinations.find(
                x => x.id === id
            );

        destination.name = name;
        destination.subtitle = subtitle;
        destination.photo = photo;

        toast("目的地已更新");

    }else{

        const destination = {

            id:uid(),

            name:name,

            subtitle:subtitle,

            photo:photo,

            trips:[]

        };

        data.destinations.push(destination);

        state.destinationId =
            destination.id;

        state.page = "destination";

        state.tripId = null;
        state.dayId = null;

        toast("目的地已新增");

    }

    saveData();
    saveState();

    closeModal("destinationModal");

    if(state.page === "destination"){

        renderDestination();

    }else{

        renderHome();

    }

}


function editCurrentDestination(){

    if(state.destinationId){

        openDestinationModal(
            state.destinationId
        );

    }

}


function deleteCurrentDestination(){

    const destination =
        getDestination();

    if(!destination) return;

    if(!confirm(
        `確定要刪除「${destination.name}」嗎？`
    )) return;

    data.destinations =
        data.destinations.filter(
            x => x.id !== destination.id
        );

    saveData();

    goHome();

    toast("已刪除");

}


/* ============================================================
   TRIP
============================================================ */

function openTrip(id){

    state.tripId = id;
    state.dayId = null;
    state.page = "trip";

    saveState();

    renderTrip();

}


function renderTrip(){

    const trip = getTrip();

    if(!trip){

        goDestination();
        return;

    }

    showPage("page-trip");

    document.getElementById("tripTitle")
        .textContent = trip.name;

    document.getElementById("tripSubtitle")
        .textContent = trip.subtitle || "";

    document.getElementById("tripDate")
        .textContent =
        formatDateRange(trip.start,trip.end) || "尚未設定";

    document.getElementById("tripDays")
        .textContent =
        `${(trip.days || []).length} Day`;

    document.getElementById("tripNote")
        .textContent =
        trip.note || "—";

    renderDayList();

    renderVisaList();

}


function formatDateRange(start,end){

    if(start && end){

        return `${start} ～ ${end}`;

    }

    if(start){

        return start;

    }

    if(end){

        return end;

    }

    return "";

}


function openTripModal(id=null){

    const destination =
        getDestination();

    if(!destination) return;

    document.getElementById("tripEditId").value =
        id || "";

    if(id){

        const trip =
            destination.trips.find(
                x => x.id === id
            );

        if(!trip) return;

        document.getElementById("tripModalTitle")
            .textContent = "編輯旅程";

        document.getElementById("tripName")
            .value = trip.name || "";

        document.getElementById("tripSubtitleInput")
            .value = trip.subtitle || "";

        document.getElementById("tripStart")
            .value = trip.start || "";

        document.getElementById("tripEnd")
            .value = trip.end || "";

        document.getElementById("tripNoteInput")
            .value = trip.note || "";

    }else{

        document.getElementById("tripModalTitle")
            .textContent = "新增旅程";

        document.getElementById("tripName")
            .value = "";

        document.getElementById("tripSubtitleInput")
            .value = "";

        document.getElementById("tripStart")
            .value = "";

        document.getElementById("tripEnd")
            .value = "";

        document.getElementById("tripNoteInput")
            .value = "";

    }

    openModal("tripModal");

}


function saveTrip(event){

    event.preventDefault();

    const destination =
        getDestination();

    if(!destination) return;

    const id =
        document.getElementById("tripEditId").value;

    const name =
        document.getElementById("tripName")
            .value.trim();

    if(!name){

        toast("請輸入旅程名稱");
        return;

    }

    const obj = {

        name:name,

        subtitle:
            document.getElementById("tripSubtitleInput")
                .value.trim(),

        start:
            document.getElementById("tripStart")
                .value,

        end:
            document.getElementById("tripEnd")
                .value,

        note:
            document.getElementById("tripNoteInput")
                .value.trim()

    };

    if(id){

        const trip =
            destination.trips.find(
                x => x.id === id
            );

        Object.assign(trip,obj);

        toast("旅程已更新");

    }else{

        const trip = {

            id:uid(),

            ...obj,

            days:[],

            visas:[]

        };

        destination.trips.push(trip);

        state.tripId = trip.id;
        state.page = "trip";
        state.dayId = null;

        toast("旅程已新增");

    }

    saveData();
    saveState();

    closeModal("tripModal");

    renderTrip();

}


/* ============================================================
   DAY
============================================================ */

function renderDayList(){

    const trip = getTrip();

    const list =
        document.getElementById("dayList");

    const days =
        [...(trip.days || [])]
        .sort((a,b)=>Number(a.number)-Number(b.number));

    if(!days.length){

        list.innerHTML = `
            <div class="empty">
                還沒有 Day。<br>
                點「＋新增 Day」開始安排。
            </div>
        `;

        return;

    }

    list.innerHTML =
        days.map(function(day){

            const activityCount =
                (day.activities || []).length;

            return `
                <article class="day-card">

                    <div class="day-top">

                        <div
                            onclick="openDay('${day.id}')"
                            style="cursor:pointer"
                        >

                            <div class="day-title">
                                Day ${esc(day.number)}
                                ${day.title
                                    ? "｜"+esc(day.title)
                                    : ""}
                            </div>

                            <div class="day-note">
                                ${esc(day.note || "")}
                            </div>

                        </div>

                        <div class="day-actions">

                            <button
                                class="btn small"
                                onclick="openDay('${day.id}')"
                            >
                                開啟
                            </button>

                            <button
                                class="btn small light"
                                onclick="openDayModal('${day.id}')"
                            >
                                編輯
                            </button>

                            <button
                                class="btn small danger"
                                onclick="deleteDay('${day.id}')"
                            >
                                刪除
                            </button>

                        </div>

                    </div>

                    <div class="day-note">
                        ${activityCount} 個行程
                    </div>

                </article>
            `;

        }).join("");

}


function openDay(id){

    state.dayId = id;
    state.page = "day";

    saveState();

    renderDay();

}


function openDayModal(id=null){

    const trip = getTrip();

    if(!trip) return;

    document.getElementById("dayEditId").value =
        id || "";

    if(id){

        const day =
            trip.days.find(
                x => x.id === id
            );

        if(!day) return;

        document.getElementById("dayModalTitle")
            .textContent = "編輯 Day";

        document.getElementById("dayNumber")
            .value = day.number;

        document.getElementById("dayTitleInput")
            .value = day.title || "";

        document.getElementById("dayNoteInput")
            .value = day.note || "";

    }else{

        document.getElementById("dayModalTitle")
            .textContent = "新增 Day";

        const maxDay =
            Math.max(
                0,
                ...(trip.days || [])
                    .map(x=>Number(x.number)||0)
            );

        document.getElementById("dayNumber")
            .value = maxDay + 1;

        document.getElementById("dayTitleInput")
            .value = "";

        document.getElementById("dayNoteInput")
            .value = "";

    }

    openModal("dayModal");

}


function saveDay(event){

    event.preventDefault();

    const trip = getTrip();

    if(!trip) return;

    const id =
        document.getElementById("dayEditId")
            .value;

    const number =
        Number(
            document.getElementById("dayNumber")
                .value
        );

    if(!number){

        toast("請輸入 Day");
        return;

    }

    const title =
        document.getElementById("dayTitleInput")
            .value.trim();

    const note =
        document.getElementById("dayNoteInput")
            .value.trim();

    /*
       這裡特別處理：
       不直接 replace 整個 trip，
       所以新增 Day 時原本的 activities / photos
       都不會被洗掉。
    */

    if(id){

        const day =
            trip.days.find(
                x => x.id === id
            );

        if(!day) return;

        day.number = number;
        day.title = title;
        day.note = note;

        if(!Array.isArray(day.activities)){
            day.activities = [];
        }

        if(!Array.isArray(day.photos)){
            day.photos = [];
        }

        toast("Day 已儲存");

    }else{

        const newDay = {

            id:uid(),

            number:number,

            title:title,

            note:note,

            activities:[],

            photos:[]

        };

        if(!Array.isArray(trip.days)){
            trip.days = [];
        }

        trip.days.push(newDay);

        state.dayId = newDay.id;

        toast(`Day ${number} 已新增`);

    }

    saveData();

    /*
       重點：
       儲存後不跳回首頁。
       直接留在目前旅程。
    */

    state.page = "trip";

    saveState();

    closeModal("dayModal");

    renderTrip();

}


function editCurrentDay(){

    if(state.dayId){

        openDayModal(
            state.dayId
        );

    }

}


function deleteDay(id){

    const trip = getTrip();

    if(!trip) return;

    const day =
        trip.days.find(
            x => x.id === id
        );

    if(!day) return;

    if(!confirm(
        `確定刪除 Day ${day.number} 嗎？`
    )) return;

    trip.days =
        trip.days.filter(
            x => x.id !== id
        );

    saveData();

    if(state.dayId === id){

        state.dayId = null;
        state.page = "trip";

    }

    saveState();

    renderTrip();

    toast("Day 已刪除");

}


/* ============================================================
   DAY DETAIL
============================================================ */

function renderDay(){

    const day = getDay();

    if(!day){

        goTrip();
        return;

    }

    showPage("page-day");

    document.getElementById("dayDetailTitle")
        .textContent =
        `Day ${day.number}${day.title ? "｜"+day.title : ""}`;

    document.getElementById("dayDetailNote")
        .textContent =
        day.note || "";

    renderActivityList();

    renderPhotoGrid();

}


function renderActivityList(){

    const day = getDay();

    const list =
        document.getElementById("activityList");

    const activities =
        day.activities || [];

    if(!activities.length){

        list.innerHTML = `
            <div class="empty">
                今天還沒有行程。
            </div>
        `;

        return;

    }

    list.innerHTML =
        activities.map(function(item){

            const price =
                item.price
                ? `<span class="meta-chip">
                    價格：${esc(item.price)}
                   </span>`
                : "";

            const transport =
                item.transport
                ? `<span class="meta-chip">
                    交通：${esc(item.transport)}
                   </span>`
                : "";

            const duration =
                item.duration
                ? `<span class="meta-chip">
                    需要時間：${esc(item.duration)}
                   </span>`
                : "";

            const link =
                item.link
                ? `<a
                    class="meta-chip"
                    href="${esc(item.link)}"
                    target="_blank"
                    rel="noopener"
                  >
                    連結
                  </a>`
                : "";

            return `
                <article class="activity">

                    <div class="activity-top">

                        <div class="activity-name">
                            ${esc(item.name)}
                        </div>

                        <div class="activity-time">
                            ${esc(item.time || "")}
                        </div>

                    </div>

                    <div class="activity-meta">
                        ${transport}
                        ${price}
                        ${duration}
                        ${link}
                    </div>

                    ${
                        item.note
                        ? `
                        <div class="activity-note">
                            ${esc(item.note)}
                        </div>
                        `
                        : ""
                    }

                    <div class="activity-actions">

                        <button
                            onclick="openActivityModal('${item.id}')"
                        >
                            編輯
                        </button>

                        <button
                            onclick="deleteActivity('${item.id}')"
                        >
                            刪除
                        </button>

                    </div>

                </article>
            `;

        }).join("");

}


function openActivityModal(id=null){

    const day = getDay();

    if(!day) return;

    document.getElementById("activityEditId")
        .value = id || "";

    if(id){

        const item =
            day.activities.find(
                x => x.id === id
            );

        if(!item) return;

        document.getElementById("activityModalTitle")
            .textContent = "編輯行程";

        document.getElementById("activityTime")
            .value = item.time || "";

        document.getElementById("activityName")
            .value = item.name || "";

        document.getElementById("activityTransport")
            .value = item.transport || "";

        document.getElementById("activityPrice")
            .value = item.price || "";

        document.getElementById("activityDuration")
            .value = item.duration || "";

        document.getElementById("activityLink")
            .value = item.link || "";

        document.getElementById("activityNote")
            .value = item.note || "";

    }else{

        document.getElementById("activityModalTitle")
            .textContent = "新增行程";

        document.getElementById("activityTime")
            .value = "";

        document.getElementById("activityName")
            .value = "";

        document.getElementById("activityTransport")
            .value = "";

        document.getElementById("activityPrice")
            .value = "";

        document.getElementById("activityDuration")
            .value = "";

        document.getElementById("activityLink")
            .value = "";

        document.getElementById("activityNote")
            .value = "";

    }

    openModal("activityModal");

}


function saveActivity(event){

    event.preventDefault();

    const day = getDay();

    if(!day) return;

    if(!Array.isArray(day.activities)){
        day.activities = [];
    }

    const id =
        document.getElementById("activityEditId")
            .value;

    const obj = {

        time:
            document.getElementById("activityTime")
                .value.trim(),

        name:
            document.getElementById("activityName")
                .value.trim(),

        transport:
            document.getElementById("activityTransport")
                .value.trim(),

        /*
           價格故意使用文字，
           不 parseInt、不限制幣別。
        */

        price:
            document.getElementById("activityPrice")
                .value.trim(),

        duration:
            document.getElementById("activityDuration")
                .value.trim(),

        link:
            document.getElementById("activityLink")
                .value.trim(),

        note:
            document.getElementById("activityNote")
                .value.trim()

    };

    if(!obj.name){

        toast("請輸入行程名稱");
        return;

    }

    if(id){

        const item =
            day.activities.find(
                x => x.id === id
            );

        Object.assign(item,obj);

        toast("行程已更新");

    }else{

        day.activities.push({

            id:uid(),

            ...obj

        });

        toast("行程已新增");

    }

    saveData();

    closeModal("activityModal");

    /*
       儲存行程後留在第4層，
       不跳回第1層。
    */

    state.page = "day";

    saveState();

    renderDay();

}


function deleteActivity(id){

    const day = getDay();

    if(!day) return;

    if(!confirm("確定要刪除這個行程嗎？")){
        return;
    }

    day.activities =
        day.activities.filter(
            x => x.id !== id
        );

    saveData();

    renderDay();

    toast("行程已刪除");

}


/* ============================================================
   VISA
============================================================ */

function renderVisaList(){

    const trip = getTrip();

    const list =
        document.getElementById("visaList");

    const visas =
        trip.visas || [];

    if(!visas.length){

        list.innerHTML = `
            <div class="empty">
                還沒有簽證資料。
            </div>
        `;

        return;

    }

    /*
       簽證這裡故意只有：
       名稱
       連結
       價格

       不顯示主標題、副標題。
    */

    list.innerHTML =
        visas.map(function(visa){

            return `
                <article class="visa-card">

                    <div class="visa-main">

                        <div>

                            <div class="visa-name">
                                ${esc(visa.name)}
                            </div>

                            ${
                                visa.link
                                ? `
                                <a
                                    class="visa-link"
                                    href="${esc(visa.link)}"
                                    target="_blank"
                                    rel="noopener"
                                >
                                    ${esc(visa.link)}
                                </a>
                                `
                                : ""
                            }

                        </div>

                        <div class="visa-price">
                            ${esc(visa.price || "")}
                        </div>

                    </div>

                    <div class="visa-actions">

                        <button
                            class="btn small light"
                            onclick="openVisaModal('${visa.id}')"
                        >
                            編輯
                        </button>

                        <button
                            class="btn small danger"
                            onclick="deleteVisa('${visa.id}')"
                        >
                            刪除
                        </button>

                    </div>

                </article>
            `;

        }).join("");

}


function openVisaModal(id=null){

    const trip = getTrip();

    if(!trip) return;

    document.getElementById("visaEditId")
        .value = id || "";

    if(id){

        const visa =
            trip.visas.find(
                x => x.id === id
            );

        if(!visa) return;

        document.getElementById("visaModalTitle")
            .textContent = "編輯簽證";

        document.getElementById("visaName")
            .value = visa.name || "";

        document.getElementById("visaLink")
            .value = visa.link || "";

        document.getElementById("visaPrice")
            .value = visa.price || "";

    }else{

        document.getElementById("visaModalTitle")
            .textContent = "新增簽證";

        document.getElementById("visaName")
            .value = "";

        document.getElementById("visaLink")
            .value = "";

        document.getElementById("visaPrice")
            .value = "";

    }

    openModal("visaModal");

}


function saveVisa(event){

    event.preventDefault();

    const trip = getTrip();

    if(!trip) return;

    if(!Array.isArray(trip.visas)){
        trip.visas = [];
    }

    const id =
        document.getElementById("visaEditId")
            .value;

    const name =
        document.getElementById("visaName")
            .value.trim();

    const link =
        document.getElementById("visaLink")
            .value.trim();

    /*
       重要：
       價格完全不轉數字。
       使用者輸入什麼就儲存什麼。
    */

    const price =
        document.getElementById("visaPrice")
            .value.trim();

    if(!name){

        toast("請輸入簽證名稱");
        return;

    }

    if(id){

        const visa =
            trip.visas.find(
                x => x.id === id
            );

        visa.name = name;
        visa.link = link;
        visa.price = price;

        toast("簽證已更新");

    }else{

        trip.visas.push({

            id:uid(),

            name:name,

            link:link,

            price:price

        });

        toast("簽證已新增");

    }

    saveData();

    closeModal("visaModal");

    /*
       仍然停留在目前的第3層旅程頁。
    */

    state.page = "trip";

    saveState();

    renderTrip();

}


function deleteVisa(id){

    const trip = getTrip();

    if(!trip) return;

    if(!confirm("確定要刪除這個簽證嗎？")){
        return;
    }

    trip.visas =
        trip.visas.filter(
            x => x.id !== id
        );

    saveData();

    renderTrip();

    toast("簽證已刪除");

}


/* ============================================================
   PHOTOS
============================================================ */

function renderPhotoGrid(){

    const day = getDay();

    const grid =
        document.getElementById("photoGrid");

    const photos =
        day.photos || [];

    if(!photos.length){

        grid.innerHTML = `
            <div
                class="empty"
                style="grid-column:1/-1"
            >
                還沒有照片。
            </div>
        `;

        return;

    }

    grid.innerHTML =
        photos.map(function(photo,index){

            return `
                <div class="photo-item">

                    <img
                        src="${photo}"
                    >

                    <button
                        class="photo-delete"
                        onclick="deletePhoto(${index})"
                    >
                        ×
                    </button>

                </div>
            `;

        }).join("");

}


function handlePhotos(event){

    const day = getDay();

    if(!day) return;

    if(!Array.isArray(day.photos)){
        day.photos = [];
    }

    const files =
        Array.from(event.target.files || []);

    if(!files.length) return;

    let pending = files.length;

    files.forEach(function(file){

        const reader =
            new FileReader();

        reader.onload = function(e){

            /*
               照片直接存成 base64。
               這樣目前單檔 HTML 就可以直接使用。
            */

            day.photos.push(
                e.target.result
            );

            pending--;

            if(pending === 0){

                saveData();

                renderPhotoGrid();

                toast("照片已新增");

            }

        };

        reader.readAsDataURL(file);

    });

    event.target.value = "";

}


function deletePhoto(index){

    const day = getDay();

    if(!day) return;

    if(!confirm("確定刪除這張照片嗎？")){
        return;
    }

    day.photos.splice(index,1);

    saveData();

    renderPhotoGrid();

    toast("照片已刪除");

}


/* ============================================================
   REFRESH RESTORE
============================================================ */

/*
   這一段就是處理你說的：

   「刷新後不要一直跳回第一頁」

   每次操作都把：
   page
   destinationId
   tripId
   dayId

   存進 localStorage。

   重新整理時直接依照最後位置恢復。
*/

function restorePage(){

    /*
       如果資料已經被刪除，
       自動退回還存在的上一層，
       不會卡死。
    */

    if(
        state.destinationId &&
        !getDestination()
    ){

        state.destinationId = null;
        state.tripId = null;
        state.dayId = null;
        state.page = "home";

    }

    if(
        state.tripId &&
        !getTrip()
    ){

        state.tripId = null;
        state.dayId = null;
        state.page = "destination";

    }

    if(
        state.dayId &&
        !getDay()
    ){

        state.dayId = null;
        state.page = "trip";

    }

    saveState();

    if(state.page === "day"){

        renderDay();

    }else if(state.page === "trip"){

        renderTrip();

    }else if(state.page === "destination"){

        renderDestination();

    }else{

        state.page = "home";

        saveState();

        renderHome();

    }

}


/* ============================================================
   MODAL OUTSIDE CLICK
============================================================ */

document
    .querySelectorAll(".modal")
    .forEach(function(modal){

        modal.addEventListener(
            "click",
            function(event){

                if(event.target === modal){

                    modal.classList.remove("show");

                }

            }
        );

    });


/* ============================================================
   START
============================================================ */

restorePage();
