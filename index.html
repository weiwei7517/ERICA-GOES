<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOYA｜走呀</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg: #f5f4f1;
    --card-bg: #ffffff;
    --text-main: #292929;
    --text-sec: #777777;
    --border: #e1dfda;
    --btn-dark: #292929;
    --btn-dark-text: #ffffff;
    --btn-light: #e8e6e1;
    --btn-light-hover: #d4d1ca;
    --danger: #9a4b43;
}
body.dark-mode {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --text-main: #e0e0e0;
    --text-sec: #aaaaaa;
    --border: #333333;
    --btn-dark: #ffffff;
    --btn-dark-text: #121212;
    --btn-light: #333333;
    --btn-light-hover: #444444;
    --danger: #ff8a80;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; transition: background 0.3s, color 0.3s; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.app { max-width: 900px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; }
.header { padding: 28px 20px 18px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.logo { font-size: 34px; font-weight: 900; letter-spacing: 1.5px; color: var(--text-main); line-height: 1; }
.logo span { font-size: 30px; font-weight: 600; color: var(--text-sec); }
.header-right { display: flex; align-items: center; gap: 8px; }
.user-email { font-size: 13px; color: var(--text-sec); }
.btn { border: none; border-radius: 12px; padding: 10px 15px; background: var(--btn-dark); color: var(--btn-dark-text); transition: 0.2s;}
.btn-light { background: var(--btn-light); color: var(--text-main); }
.btn-small { padding: 7px 10px; font-size: 13px; }
.btn-danger { background: #eee3e1; color: var(--danger); }

.login-box { max-width: 420px; margin: 100px auto; background: var(--card-bg); border-radius: 24px; padding: 30px; box-shadow: 0 10px 35px rgba(0,0,0,.06); transition: 0.3s;}
.login-message { margin-top: 15px; color: var(--danger); font-size: 14px; }
.field { margin-bottom: 15px; }
.field label { display: block; margin-bottom: 7px; font-size: 14px; color: var(--text-sec); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--border); background: transparent; border-radius: 12px; padding: 12px; color: var(--text-main); outline: none; transition: 0.3s;}
.field textarea { min-height: 100px; resize: vertical; }

.section { padding: 10px 20px; }
.section-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
.destination-list, .journey-list, .visa-list, .photo-list { display: flex; flex-direction: column; gap: 12px; }
.destination-card, .cooperation-card, .journey-card, .info-box, .day-card, .photo-note-card, .photo-paste-box { background: var(--card-bg); border-radius: 18px; padding: 16px; box-shadow: 0 4px 18px rgba(0,0,0,.035); transition: 0.3s;}
.destination-card { display: flex; align-items: center; gap: 12px; }
.destination-main, .journey-main { flex: 1; min-width: 0; cursor: pointer; }
.destination-name, .journey-title { font-size: 19px; font-weight: 700; }
.destination-count, .journey-subtitle, .journey-creator { margin-top: 4px; color: var(--text-sec); font-size: 13px; }
.destination-actions, .journey-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.icon-btn, .text-action { width: auto; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; background: transparent; color: var(--text-main); font-size: 13px; transition: .2s ease; display: inline-flex; align-items: center; justify-content: center;}
.text-action.delete { color: var(--danger); }
.add-destination, .visa-add-btn, .add-item-btn, .photo-add-btn { width: 100%; border: 1px dashed var(--border); background: transparent; color: var(--text-sec); border-radius: 16px; padding: 15px; margin-top: 3px; }
.cooperation-link, .visa-link, .map-link { display: inline-block; margin-top: 12px; padding: 8px 12px; background: var(--btn-light); border-radius: 10px; text-decoration: none; font-size: 13px; color: var(--text-main);}
.back-btn { border: none; background: transparent; color: var(--text-sec); padding: 0; margin-bottom: 15px; }

.detail-header { padding: 20px; }
.detail-title { font-size: 32px; margin: 0; }
.detail-subtitle, .detail-meta { color: var(--text-sec); font-size: 14px; margin-top:7px; }
.total-box { margin-top: 20px; background: var(--btn-dark); color: var(--btn-dark-text); border-radius: 20px; padding: 20px; transition: 0.3s;}
.total-price { font-size: 30px; font-weight: 800; margin-top: 5px; }
.visa-card, .item-card, .stay-card, .visa-editor { border: 1px solid var(--border); border-radius: 14px; padding: 13px; background: transparent; margin-bottom: 10px; }
.visa-name, .item-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
.visa-info, .item-info { margin-top: 6px; font-size: 13px; color: var(--text-sec); line-height:1.8; }
.visa-price, .item-price { font-weight: 700; color: var(--text-main); margin-top:8px;}
.day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
.day-title { font-size: 21px; font-weight: 750; }
.stay-section { margin-top: 25px; }
.photo-note-image { display: block; width: 100%; max-height: 520px; object-fit: contain; border-radius:15px; background: var(--bg);}
.empty { text-align: center; padding: 40px 20px; color: var(--text-sec); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; z-index: 1000; padding: 15px; }
.modal-backdrop.show { display: flex; }
.modal { width: 100%; max-width: 600px; max-height: 90vh; overflow: auto; background: var(--card-bg); border-radius: 24px; padding: 24px; transition: 0.3s;}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-header h2 { margin: 0; }
.close-btn { border: none; background: var(--btn-light); width: 36px; height: 36px; border-radius: 50%; color: var(--text-main); }
.modal-footer { display: flex; gap: 10px; margin-top: 20px; }
.modal-footer button { flex: 1; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rating-group { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.rating-option input { position: absolute; opacity: 0; }
.rating-option label { display: flex; align-items: center; justify-content: center; min-height: 45px; border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 13px; cursor: pointer; transition: .2s ease; }
.rating-option input:checked + label { background: var(--text-main); border-color: var(--border); color: var(--bg); }
.loading { padding: 60px 20px; text-align: center; color: var(--text-sec); }
@media(max-width:600px) { .header{padding: 22px 16px 12px;} .user-email{display:none;} .modal{border-radius: 24px 24px 0 0; max-height: 94vh;} }

#toast { position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg); padding: 12px 24px; border-radius: 30px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9999; opacity: 0; pointer-events: none;}
#toast.show { bottom: 30px; opacity: 1; }
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>

<!-- ========================= 設定 Modal ========================= -->
<div id="settingsModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h2>⚙️ 系統設定</h2>
            <button class="close-btn" onclick="closeModal('settingsModal')">×</button>
        </div>
        <div class="field" style="display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid var(--border);">
            <label style="margin:0; color:inherit; font-size:16px;">🌙 深色模式</label>
            <input type="checkbox" id="toggleDarkMode" style="width:20px; height:20px;" onchange="updateSettings()">
        </div>
        <div class="field" style="display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid var(--border);">
            <label style="margin:0; color:inherit; font-size:16px;">🔗 網址路由 (刷新不跑版)</label>
            <input type="checkbox" id="toggleRouting" style="width:20px; height:20px;" onchange="updateSettings()">
        </div>
        <div class="field" style="display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid var(--border);">
            <label style="margin:0; color:inherit; font-size:16px;">💬 浮動提示 (取代 Alert)</label>
            <input type="checkbox" id="toggleToast" style="width:20px; height:20px;" onchange="updateSettings()">
        </div>
        <div class="field" style="display:flex; justify-content:space-between; align-items:center; padding-bottom:10px;">
            <div>
                <label style="margin:0; color:inherit; font-size:16px;">☁️ 雲端相簿上傳</label>
            </div>
            <input type="checkbox" id="toggleCloudPhoto" style="width:20px; height:20px;" onchange="updateSettings()">
        </div>
    </div>
</div>

<!-- ========================= 其餘通用 Modal ========================= -->
<div id="introModal" class="modal-backdrop"><div class="modal"><div class="modal-header"><h2>編輯主頁文案</h2><button class="close-btn" onclick="closeModal('introModal')">×</button></div><div class="field"><label>主標題</label><input id="introTitleInput" type="text"></div><div class="field"><label>副標題</label><input id="introSubtitleInput" type="text"></div><div class="modal-footer"><button class="btn btn-light" onclick="closeModal('introModal')">取消</button><button class="btn" onclick="saveIntro()">儲存</but
