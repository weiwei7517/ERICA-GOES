<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERICA GOES｜躺平也能玩，小資也能飛</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#f4f3f0;
    --card:#ffffff;
    --text:#292929;
    --sub:#777;
    --line:#e5e3df;
    --soft:#eeece8;
    --dark:#292929;
    --danger:#a94442;
    --green:#55745d;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(244,243,240,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
}

.topbar-inner{
    max-width:1100px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.logo{
    font-weight:800;
    letter-spacing:.5px;
}

.logo small{
    display:block;
    color:var(--sub);
    font-weight:500;
    font-size:11px;
    margin-top:2px;
}

.top-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.container{
    width:min(1100px,calc(100% - 32px));
    margin:0 auto;
    padding:32px 0 70px;
}

.hero{
    padding:35px 0 25px;
}

.hero h1{
    margin:0;
    font-size:clamp(30px,6vw,54px);
    letter-spacing:-1.5px;
    line-height:1.05;
}

.hero p{
    margin:12px 0 0;
    color:var(--sub);
    line-height:1.7;
}

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin:15px 0 20px;
    flex-wrap:wrap;
}

.section-title{
    font-size:20px;
    font-weight:800;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.035);
}

.trip-card{
    transition:.2s;
}

.trip-card:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 35px rgba(0,0,0,.07);
}

.trip-cover{
    width:100%;
    aspect-ratio:16/8;
    border-radius:16px;
    background:var(--soft);
    overflow:hidden;
    margin-bottom:16px;
}

.trip-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.trip-cover.empty-cover{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    font-size:34px;
}

.trip-title{
    font-size:22px;
    font-weight:800;
    margin-bottom:8px;
}

.trip-meta{
    color:var(--sub);
    font-size:14px;
    line-height:1.7;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 10px;
    border-radius:999px;
    background:var(--soft);
    font-size:12px;
    color:#555;
    margin-bottom:10px;
}

.btn{
    border:0;
    border-radius:12px;
    padding:11px 15px;
    background:var(--dark);
    color:white;
    font-weight:700;
}

.btn:hover{
    opacity:.9;
}

.btn.secondary{
    background:var(--soft);
    color:var(--text);
}

.btn.danger{
    background:#f3e5e3;
    color:var(--danger);
}

.btn.small{
    padding:8px 11px;
    font-size:13px;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:var(--sub);
    background:white;
    border:1px dashed var(--line);
    border-radius:20px;
}

.error-box{
    background:#fff1ef;
    color:#9c4038;
    border:1px solid #efc5c0;
    padding:16px;
    border-radius:15px;
    margin:15px 0;
    white-space:pre-wrap;
    line-height:1.6;
    font-size:14px;
}

.success-box{
    background:#edf4ee;
    color:#4e6b55;
    border:1px solid #cdddcf;
    padding:16px;
    border-radius:15px;
    margin:15px 0;
}

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal-backdrop.show{
    display:flex;
}

.modal{
    width:min(620px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:24px;
    padding:24px;
}

.modal h2{
    margin:0 0 20px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
    flex-wrap:wrap;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid var(--line);
    background:#faf9f7;
    border-radius:12px;
    padding:12px 13px;
    outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#aaa;
    background:white;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.detail-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:22px;
}

.back-btn{
    background:none;
    border:0;
    padding:0;
    color:#666;
}

.detail-title{
    font-size:32px;
    font-weight:850;
    margin:8px 0;
}

.detail-sub{
    color:var(--sub);
}

.detail-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.section{
    margin-top:22px;
}

.section h3{
    margin:0 0 12px;
    font-size:19px;
}

.day-card{
    margin-bottom:15px;
}

.day-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.day-title{
    font-weight:800;
    font-size:18px;
}

.item{
    padding:14px 0;
    border-top:1px solid var(--line);
}

.item:first-child{
    border-top:0;
}

.item-title{
    font-weight:750;
}

.item-meta{
    color:var(--sub);
    font-size:13px;
    margin-top:5px;
    line-height:1.6;
}

.item-note{
    background:#f7f6f3;
    padding:10px;
    border-radius:10px;
    margin-top:9px;
    color:#666;
    font-size:13px;
}

.item-actions{
    display:flex;
    gap:6px;
    margin-top:9px;
}

.login-status{
    font-size:12px;
    color:var(--sub);
}

.loading{
    padding:50px 20px;
    text-align:center;
    color:var(--sub);
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#292929;
    color:#fff;
    padding:12px 18px;
    border-radius:999px;
    z-index:500;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    font-size:14px;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.auth-user{
    color:#666;
    font-size:12px;
    max-width:170px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }

    .topbar-inner{
        padding:13px 14px;
    }

    .container{
        width:min(100% - 22px,1100px);
        padding-top:22px;
    }

    .hero{
        padding-top:20px;
    }

    .detail-header{
        flex-direction:column;
    }

    .detail-title{
        font-size:27px;
    }

    .top-actions .auth-user{
        display:none;
    }
}
</style>
</head>

<body>

<header class="topbar">

<main class="container">

    <section id="homeView">

<!-- LOGIN -->

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://iutemzxxdxvcobndrnii.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xoMl-Lyx5VgkRm5iP5-j0Q_DPWUtQBN";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let trips = [];
let itineraries = [];
let stays = [];
let flights = [];

let currentTrip = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHTML(value){
    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function showToast(message){
    const el = document.getElementById("toast");

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer =
        setTimeout(() => {
            el.classList.remove("show");
        },2600);
}


function formatDate(date){
    if(!date){
        return "";
    }

    const d = new Date(date + "T00:00:00");

    if(Number.isNaN(d.getTime())){
        return date;
    }

    return d.toLocaleDateString(
        "zh-TW",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    );
}


function showError(containerId,title,error){
    const container =
        document.getElementById(containerId);

    if(!container){
        return;
    }

    const message =
        error?.message ||
        error?.error_description ||
        String(error) ||
        "未知錯誤";

    const code =
        error?.code ||
        "無";

    const status =
        error?.status ||
        "無";

    container.innerHTML = `
        <div class="error-box">
            <strong>${escapeHTML(title)}</strong>

            <div style="margin-top:8px;">
                ${escapeHTML(message)}
            </div>

            <div style="margin-top:8px;font-size:12px;">
                Code：${escapeHTML(code)}　
                Status：${escapeHTML(status)}
            </div>
        </div>
    `;
}


function clearError(containerId){
    const container =
        document.getElementById(containerId);

    if(container){
        container.innerHTML = "";
    }
}


/* =========================================================
   MODALS
========================================================= */

function openModal(id){
    document.getElementById(id)
        ?.classList.add("show");
}


function closeModals(){
    document
        .querySelectorAll(".modal-backdrop")
        .forEach(el => el.classList.remove("show"));
}


function openLoginModal(){
    clearError("loginError");
    openModal("loginModal");
}


function openTripModal(trip = null){

    clearError("tripError");

    document.getElementById("tripModalTitle").textContent =
        trip ? "編輯旅行" : "新增旅行";

    document.getElementById("tripId").value =
        trip?.id || "";

    document.getElementById("tripName").value =
        trip?.name || "";

    document.getElementById("tripCountry").value =
        trip?.country || "";

    document.getElementById("tripStart").value =
        trip?.start_date || "";

    document.getElementById("tripEnd").value =
        trip?.end_date || "";

    document.getElementById("tripCover").value =
        trip?.cover_image || "";

    document.getElementById("tripNote").value =
        trip?.note || "";

    openModal("tripModal");
}


function openItineraryModal(item = null){

    clearError("itineraryError");

    document.getElementById("itineraryModalTitle").textContent =
        item ? "編輯行程" : "新增行程";

    document.getElementById("itineraryId").value =
        item?.id || "";

    document.getElementById("itineraryDay").value =
        item?.day || "";

    document.getElementById("itineraryTitle").value =
        item?.title || "";

    document.getElementById("itineraryTransport").value =
        item?.transport || "";

    document.getElementById("itineraryPrice").value =
        item?.price || "";

    document.getElementById("itineraryTime").value =
        item?.duration || "";

    document.getElementById("itineraryNote").value =
        item?.note || "";

    openModal("itineraryModal");
}


function openStayModal(item = null){

    clearError("stayError");

    document.getElementById("stayId").value =
        item?.id || "";

    document.getElementById("stayName").value =
        item?.name || "";

    document.getElementById("stayCheckin").value =
        item?.checkin || "";

    document.getElementById("stayCheckout").value =
        item?.checkout || "";

    document.getElementById("stayAddress").value =
        item?.address || "";

    document.getElementById("stayPrice").value =
        item?.price || "";

    document.getElementById("stayNote").value =
        item?.note || "";

    openModal("stayModal");
}


function openFlightModal(item = null){

    clearError("flightError");

    document.getElementById("flightId").value =
        item?.id || "";

    document.getElementById("flightAirline").value =
        item?.airline || "";

    document.getElementById("flightNumber").value =
        item?.flight_number || "";

    document.getElementById("flightFrom").value =
        item?.from_location || "";

    document.getElementById("flightTo").value =
        item?.to_location || "";

    document.getElementById("flightDate").value =
        item?.flight_date || "";

    document.getElementById("flightDeparture").value =
        item?.departure_time || "";

    document.getElementById("flightArrival").value =
        item?.arrival_time || "";

    document.getElementById("flightNote").value =
        item?.note || "";

    openModal("flightModal");
}


/* =========================================================
   AUTH UI
========================================================= */

function updateAuthUI(){

/* =========================================================
   LOGIN
========================================================= */

async function login(){

    clearError("loginError");

    const email =
        document.getElementById("authEmail")
            .value
            .trim();

    const password =
        document.getElementById("authPassword")
            .value;

    if(!email || !password){

        showError(
            "loginError",
            "請輸入 Email 與密碼",
            {
                message:"Email 或密碼不能空白",
                code:"MISSING_FIELDS",
                status:"400"
            }
        );

        return;
    }

    const button =
        document.getElementById("loginSubmitBtn");

    button.disabled = true;
    button.textContent = "登入中...";

    try{

        console.log("開始登入:",email);

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });

        if(error){

            console.error(
                "Supabase Login Error:",
                error
            );

            showError(
                "loginError",
                "登入失敗",
                error
            );

            return;
        }

        console.log(
            "Auth 登入成功:",
            data?.user
        );

        const {
            data:sessionData,
            error:sessionError
        } =
            await supabaseClient.auth
                .getSession();

        if(sessionError){

            console.error(
                "Session Error:",
                sessionError
            );

            showError(
                "loginError",
                "登入成功，但 Session 取得失敗",
                sessionError
            );

            return;
        }

        currentUser =
            sessionData?.session?.user ||
            data?.user ||
            null;

        if(!currentUser){

            showError(
                "loginError",
                "登入沒有完成",
                {
                    message:
                    "Supabase 沒有回傳登入使用者。",
                    code:"NO_USER",
                    status:"401"
                }
            );

            return;
        }

        console.log(
            "目前登入使用者:",
            currentUser.id
        );

        closeModals();

        updateAuthUI();

        showToast("登入成功 ✓");

        await loadTrips();

    }catch(error){

        console.error(
            "Login unexpected error:",
            error
        );

        showError(
            "loginError",
            "登入發生未預期錯誤",
            error
        );

    }finally{

        button.disabled = false;
        button.textContent = "登入";
    }
}

/* =========================================================
   LOAD TRIPS
========================================================= */

async function loadTrips(){

    const container =
        document.getElementById("tripsContainer");

    const globalError =
        document.getElementById("globalError");

    globalError.innerHTML = "";

    container.innerHTML =
        `<div class="loading">載入旅行資料中...</div>`;

    try{

        console.log(
            "開始載入 trips，使用者:",
            currentUser?.id || "未登入"
        );

        const {
            data,
            error
        } =
            await supabaseClient
                .from("trips")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );

        if(error){

            console.error(
                "Trips Load Error:",
                error
            );

            showError(
                "globalError",
                "旅行資料載入失敗",
                error
            );

            container.innerHTML = `
                <div class="empty">
                    無法載入旅行資料。
                    <br><br>
                    請看上方紅色錯誤訊息。
                </div>
            `;

            return false;
        }

        trips = data || [];

        console.log(
            "Trips 載入成功:",
            trips
        );

        await loadChildData();

        renderTrips();

        return true;

    }catch(error){

        console.error(
            "loadTrips unexpected error:",
            error
        );

        showError(
            "globalError",
            "載入旅行時發生錯誤",
            error
        );

        container.innerHTML = `
            <div class="empty">
                旅行資料載入失敗。
            </div>
        `;

        return false;
    }
}


/* =========================================================
   LOAD CHILD DATA
========================================================= */

async function loadChildData(){

    const tripIds =
        trips
            .map(trip => trip.id)
            .filter(Boolean);

    itineraries = [];
    stays = [];
    flights = [];

    if(!tripIds.length){
        return;
    }

    const [
        itineraryResult,
        stayResult,
        flightResult
    ] =
        await Promise.all([
            supabaseClient
                .from("itineraries")
                .select("*")
                .in("trip_id",tripIds)
                .order("day",{ascending:true}),

            supabaseClient
                .from("stays")
                .select("*")
                .in("trip_id",tripIds),

            supabaseClient
                .from("flights")
                .select("*")
                .in("trip_id",tripIds)
        ]);

    if(itineraryResult.error){

        console.error(
            "Itineraries Load Error:",
            itineraryResult.error
        );

    }else{

        itineraries =
            itineraryResult.data || [];
    }

    if(stayResult.error){

        console.error(
            "Stays Load Error:",
            stayResult.error
        );

    }else{

        stays =
            stayResult.data || [];
    }

    if(flightResult.error){

        console.error(
            "Flights Load Error:",
            flightResult.error
        );

    }else{

        flights =
            flightResult.data || [];
    }
}

function isOwner(trip){

    if(!currentUser){
        return false;
    }

    return String(trip.owner_id) ===
           String(currentUser.id);
}

function renderItineraries(){

    const container =
        document.getElementById("itineraryContainer");

    if(!currentTrip){
        return;
    }

    const list =
        itineraries
            .filter(item =>
                String(item.trip_id) ===
                String(currentTrip.id)
            )
            .sort((a,b) =>
                Number(a.day || 0) -
                Number(b.day || 0)
            );

    if(!list.length){

        container.innerHTML = `
            <div class="card">
                <div class="empty">
                    目前還沒有行程
                </div>
            </div>
        `;

        return;
    }

    const days = {};

    list.forEach(item => {

        const day =
            item.day || 1;

        if(!days[day]){
            days[day] = [];
        }

        days[day].push(item);
    });

    container.innerHTML =
        Object.keys(days)
            .sort((a,b)=>Number(a)-Number(b))
            .map(day => {

                return `
                    <div class="card day-card">

                        <div class="day-head">
                            <div class="day-title">
                                DAY ${escapeHTML(day)}
                            </div>

                            ${
                                isOwner(currentTrip)
                                ?
                                `
                                <button
                                    class="btn small secondary"
                                    onclick="openItineraryModal()"
                                >
                                    ＋
                                </button>
                                `
                                :
                                ""
                            }
                        </div>

                        ${
                            days[day]
                                .map(renderItineraryItem)
                                .join("")
                        }

                    </div>
                `;

            })
            .join("");
}

async function saveItinerary(){

    if(!currentUser || !currentTrip){
        return;
    }

    clearError("itineraryError");

    const id =
        document.getElementById("itineraryId").value;

    const payload = {

        trip_id:currentTrip.id,

        day:
            Number(
                document.getElementById("itineraryDay").value
            ) || 1,

        title:
            document.getElementById("itineraryTitle")
                .value
                .trim(),

        transport:
            document.getElementById("itineraryTransport")
                .value
                .trim(),

        price:
            document.getElementById("itineraryPrice")
                .value
                .trim(),

        duration:
            document.getElementById("itineraryTime")
                .value
                .trim(),

        note:
            document.getElementById("itineraryNote")
                .value
                .trim()
    };

    if(!payload.title){

        showError(
            "itineraryError",
            "請輸入行程名稱",
            {
                message:"行程名稱不能空白",
                code:"MISSING_TITLE",
                status:"400"
            }
        );

        return;
    }

    let result;

    if(id){

        result =
            await supabaseClient
                .from("itineraries")
                .update(payload)
                .eq("id",id);

    }else{

        result =
            await supabaseClient
                .from("itineraries")
                .insert(payload);
    }

    if(result.error){

        console.error(
            "Save itinerary error:",
            result.error
        );

        showError(
            "itineraryError",
            "儲存行程失敗",
            result.error
        );

        return;
    }

    closeModals();

    showToast("行程已儲存 ✓");

    await loadTrips();

    if(currentTrip){
        currentTrip =
            trips.find(
                x => String(x.id) === String(currentTrip.id)
            ) || currentTrip;

        renderDetailActions();
        renderDetail();
    }
}


async function deleteItinerary(id){

    if(!confirm("確定要刪除這個行程嗎？")){

}

                    .join("")
            }
        </div>
        `;
}


function openFlightModalById(id){

    const item =
        flights.find(
            x => String(x.id) === String(id)
        );

    if(item){
        openFlightModal(item);
    }
}


async function saveFlight(){

    if(!currentUser || !currentTrip){
        return;
    }

    clearError("flightError");

    const id =
        document.getElementById("flightId").value;

    const payload = {

        trip_id:currentTrip.id,

        airline:
            document.getElementById("flightAirline")
                .value
                .trim(),

        flight_number:
            document.getElementById("flightNumber")
                .value
                .trim(),

        from_location:
            document.getElementById("flightFrom")
                .value
                .trim(),

        to_location:
            document.getElementById("flightTo")
                .value
                .trim(),

        flight_date:
            document.getElementById("flightDate").value ||
            null,

        departure_time:
            document.getElementById("flightDeparture").value ||
            null,

        arrival_time:
            document.getElementById("flightArrival").value ||
            null,

        note:
            document.getElementById("flightNote")
                .value
                .trim()
    };

    let result;

    if(id){

        result =
            await supabaseClient
                .from("flights")
                .update(payload)
                .eq("id",id);

    }else{

        result =
            await supabaseClient
                .from("flights")
                .insert(payload);
    }

    if(result.error){

        showError(
            "flightError",
            "儲存航班失敗",
            result.error
        );

        return;
    }

    closeModals();

    showToast("航班已儲存 ✓");

    await loadTrips();

    renderDetail();
}


async function deleteFlight(id){

    if(!confirm("確定要刪除這筆航班嗎？")){
        return;
    }

    const {
        error
    } =
        await supabaseClient
            .from("flights")
            .delete()
            .eq("id",id);

    if(error){

        alert(
            "刪除失敗\n\n" +
            error.message
        );

        return;
    }

    showToast("已刪除");

    await loadTrips();

    renderDetail();
}


/* =========================================================
   PARTNERS
   localStorage
========================================================= */

function partnerStorageKey(){

    return currentTrip
        ?
        `erica_goes_partners_${currentTrip.id}`
        :
        "";
}


function getPartners(){

    if(!currentTrip){
        return [];
    }

    try{

        return JSON.parse(
            localStorage.getItem(
                partnerStorageKey()
            ) || "[]"
        );

    }catch{

        return [];
    }
}


function savePartners(list){

    if(!currentTrip){
        return;
    }

    localStorage.setItem(
        partnerStorageKey(),
        JSON.stringify(list)
    );
}


function renderPartners(){

    const container =
        document.getElementById("partnerContainer");

    const list =
        getPartners();

    if(!list.length){

        container.innerHTML = `
            <div class="card">
                <div class="empty">
                    目前還沒有同行者
                </div>

                ${
                    isOwner(currentTrip)
                    ?
                    `
                    <div style="text-align:center;margin-top:15px;">
                        <button
                            class="btn small"
                            onclick="addPartner()"
                        >
                            ＋ 新增同行者
                        </button>
                    </div>
                    `
                    :
                    ""
                }

            </div>
        `;

        return;
    }

    container.innerHTML = `
        <div class="card">

            ${
                list
                    .map((name,index) => `

                        <div class="item">

                            <div class="item-title">
                                👤 ${escapeHTML(name)}
                            </div>

                            ${
                                isOwner(currentTrip)
                                ?
                                `
                                <div class="item-actions">

                                    <button
                                        class="btn small danger"
                                        onclick="deletePartner(${index})"
                                    >
                                        刪除
                                    </button>

                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                    `)
                    .join("")
            }

            ${
                isOwner(currentTrip)
                ?
                `
                <div style="margin-top:15px;">
                    <button
                        class="btn small"
                        onclick="addPartner()"
                    >
                        ＋ 新增同行者
                    </button>
                </div>
                `
                :
                ""
            }

        </div>
    `;
}


function addPartner(){

    const name =
        prompt("請輸入同行者名稱");

    if(!name){
        return;
    }

    const list =
        getPartners();

    list.push(name.trim());

    savePartners(list);

    renderPartners();

    showToast("已新增同行者");
}


function deletePartner(index){

    const list =
        getPartners();

    list.splice(index,1);

    savePartners(list);

    renderPartners();
}


/* =========================================================
   TRIP CRUD
========================================================= */

function openTripModalById(id){

    const trip =
        trips.find(
            x => String(x.id) === String(id)
        );

    if(trip){
        openTripModal(trip);
    }
}


async function saveTrip(){

    if(!currentUser){

        showError(
            "tripError",
            "請先登入",
            {
                message:"登入後才能新增旅行。",
                code:"NOT_AUTHENTICATED",
                status:"401"
            }
        );

        return;
    }

    clearError("tripError");

    const id =
        document.getElementById("tripId").value;

    const payload = {

        name:
            document.getElementById("tripName")
                .value
                .trim(),

        country:
            document.getElementById("tripCountry")
                .value
                .trim(),

        start_date:
            document.getElementById("tripStart").value ||
            null,

        end_date:
            document.getElementById("tripEnd").value ||
            null,

        cover_image:
            document.getElementById("tripCover")
                .value
                .trim(),

        note:
            document.getElementById("tripNote")
                .value
                .trim()
    };

    if(!payload.name){

        showError(
            "tripError",
            "請輸入旅行名稱",
            {
                message:"旅行名稱不能空白",
                code:"MISSING_NAME",
                status:"400"
            }
        );

        return;
    }

    let result;

    if(id){

        result =
            await supabaseClient
                .from("trips")
                .update(payload)
                .eq("id",id)
                .eq("owner_id",currentUser.id);

    }else{

        payload.owner_id =
            currentUser.id;

        result =
            await supabaseClient
                .from("trips")
                .insert(payload);
    }

    if(result.error){

        console.error(
            "Save trip error:",
            result.error
        );

        showError(
            "tripError",
            "儲存旅行失敗",
            result.error
        );

        return;
    }

    closeModals();

    showToast(
        id
        ? "旅行已更新 ✓"
        : "旅行已建立 ✓"
    );

    await loadTrips();

    if(currentTrip){

        currentTrip =
            trips.find(
                x =>
                String(x.id) ===
                String(currentTrip.id)
            ) || null;

        if(currentTrip){

            renderDetailActions();
            renderDetail();

        }else{

            showHome();
        }
    }
}


async function deleteTrip(id){

    const trip =
        trips.find(
            x => String(x.id) === String(id)
        );

    if(!trip){
        return;
    }

    if(!isOwner(trip)){

        alert("只有旅行建立者可以刪除。");

        return;
    }

    const ok =
        confirm(
            `確定要刪除「${trip.name || "這個旅行"}」嗎？\n\n旅行底下的行程、住宿、航班也會受到資料庫權限影響。`
        );

    if(!ok){
        return;
    }

    const {
        error
    } =
        await supabaseClient
            .from("trips")
            .delete()
            .eq("id",id)
            .eq("owner_id",currentUser.id);

    if(error){

        console.error(
            "Delete trip error:",
            error
        );

        alert(
            "刪除失敗\n\n" +
            error.message
        );

        return;
    }

    showToast("旅行已刪除");

    if(
        currentTrip &&
        String(currentTrip.id) === String(id)
    ){
        showHome();
    }

    await loadTrips();
}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    (event,session) => {

        console.log(
            "Auth event:",
            event,
            session?.user?.email || ""
        );

        currentUser =
            session?.user || null;

        updateAuthUI();

        if(
            event === "SIGNED_IN" ||
            event === "SIGNED_OUT"
        ){

            setTimeout(
                () => {
                    loadTrips();
                },
                0
            );
        }
    }
);


/* =========================================================
   CHECK SESSION
========================================================= */

async function checkSession(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .getSession();

        if(error){

            console.error(
                "getSession Error:",
                error
            );

            showError(
                "globalError",
                "Session 讀取失敗",
                error
            );

            return;
        }

        currentUser =
            data?.session?.user ||
            null;

        console.log(
            "目前 Session:",
            currentUser
        );

        updateAuthUI();

        await loadTrips();

    }catch(error){

        console.error(
            "checkSession Error:",
            error
        );

        showError(
            "globalError",
            "初始化失敗",
            error
        );
    }
}

document

        backdrop.addEventListener(
            "click",
            event => {

                if(event.target === backdrop){
                    closeModals();
                }

            }
        );

    });
