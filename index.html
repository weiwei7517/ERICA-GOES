<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOYA｜走呀</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f4f1;
    color:#292929;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1100px,92%);
    margin:auto;
}

header{
    padding:30px 0 25px;
}

.header-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:800;
    letter-spacing:1px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-email{
    color:#888;
    font-size:13px;
}

.btn{
    border:0;
    border-radius:12px;
    padding:11px 17px;
    background:#292929;
    color:white;
    font-weight:700;
}

.btn-light{
    background:#e9e7e2;
    color:#333;
}

.btn-danger{
    background:#eee7e5;
    color:#8c5148;
}

.btn:hover{
    opacity:.86;
}

.page{
    padding-bottom:70px;
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin:10px 0 25px;
}

.page-title h1{
    margin:0;
    font-size:27px;
}

.page-title p{
    margin:7px 0 0;
    color:#888;
    font-size:14px;
}

/* =========================
   LOGIN
========================= */

.login-page{
    min-height:75vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:min(420px,100%);
    background:white;
    padding:32px;
    border-radius:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.login-box h1{
    margin:0;
    font-size:28px;
}

.login-box p{
    color:#888;
    margin:8px 0 25px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:700;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:12px;
    padding:12px 13px;
    outline:none;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    background:white;
    border-color:#999;
}

.full{
    width:100%;
}

.message{
    margin-top:12px;
    font-size:14px;
    color:#a0554b;
}

/* =========================
   DESTINATION
========================= */

.destination-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.destination-card{
    background:white;
    border-radius:23px;
    padding:25px;
    min-height:145px;
    position:relative;
    box-shadow:0 5px 25px rgba(0,0,0,.045);
    cursor:pointer;
    transition:.2s;
}

.destination-card:hover{
    transform:translateY(-2px);
    box-shadow:0 9px 30px rgba(0,0,0,.07);
}

.destination-card.dragging{
    opacity:.45;
}

.drag-handle{
    position:absolute;
    top:20px;
    right:20px;
    color:#aaa;
    font-size:18px;
}

.destination-name{
    font-size:24px;
    font-weight:800;
    padding-right:30px;
}

.destination-count{
    margin-top:10px;
    color:#999;
    font-size:13px;
}

.destination-actions{
    margin-top:18px;
    display:flex;
    gap:7px;
}

.destination-actions button{
    border:0;
    border-radius:9px;
    padding:7px 10px;
    background:#f0efeb;
    color:#666;
    font-size:12px;
}

.destination-actions .delete{
    color:#95554d;
}

/* =========================
   JOURNEYS
========================= */

.back-btn{
    border:0;
    background:none;
    padding:7px 0;
    color:#666;
    font-weight:700;
}

.journey-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.journey-card{
    background:white;
    border-radius:23px;
    padding:23px;
    box-shadow:0 5px 25px rgba(0,0,0,.045);
    cursor:pointer;
    transition:.2s;
}

.journey-card:hover{
    transform:translateY(-2px);
}

.journey-card.dragging{
    opacity:.45;
}

.journey-title{
    font-size:21px;
    font-weight:800;
    line-height:1.4;
}

.journey-subtitle{
    margin-top:7px;
    color:#777;
    line-height:1.5;
}

.journey-creator{
    margin-top:14px;
    color:#999;
    font-size:13px;
}

.journey-actions{
    display:flex;
    gap:7px;
    margin-top:17px;
}

.journey-actions button{
    border:0;
    border-radius:9px;
    padding:8px 11px;
    background:#f0efeb;
    color:#555;
    font-size:12px;
}

.journey-actions .delete{
    color:#95554d;
}

/* =========================
   DETAIL
========================= */

.detail-top{
    display:grid;
    grid-template-columns:1fr 250px;
    gap:18px;
    margin-top:15px;
}

.detail-info{
    background:white;
    border-radius:24px;
    padding:28px;
}

.detail-destination{
    color:#888;
    font-size:13px;
    margin-bottom:8px;
}

.detail-info h1{
    margin:0;
    font-size:29px;
    line-height:1.4;
}

.detail-subtitle{
    margin-top:8px;
    color:#777;
}

.detail-creator{
    margin-top:15px;
    color:#999;
    font-size:13px;
}

.detail-description{
    margin-top:18px;
    color:#666;
    line-height:1.7;
    white-space:pre-wrap;
}

.cost-card{
    background:#292929;
    color:white;
    border-radius:24px;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.cost-label{
    font-size:13px;
    opacity:.7;
}

.cost-number{
    margin-top:7px;
    font-size:31px;
    font-weight:800;
}

.section{
    margin-top:25px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:13px;
}

.section-header h2{
    margin:0;
    font-size:21px;
}

.day-card{
    background:white;
    border-radius:22px;
    padding:22px;
    margin-bottom:15px;
}

.day-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.day-head h3{
    margin:0;
    font-size:19px;
}

.itinerary{
    border:1px solid #ecebe7;
    border-radius:16px;
    padding:16px;
    margin-top:10px;
}

.itinerary-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.itinerary-title{
    font-weight:800;
}

.itinerary-price{
    font-weight:800;
    white-space:nowrap;
}

.itinerary-info{
    color:#777;
    font-size:13px;
    line-height:1.8;
    margin-top:8px;
}

.itinerary-notes{
    color:#666;
    font-size:13px;
    margin-top:8px;
    white-space:pre-wrap;
}

.item-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.small-btn{
    border:0;
    background:#f0efeb;
    color:#555;
    border-radius:9px;
    padding:7px 11px;
    font-size:12px;
}

.small-btn.delete{
    color:#95554d;
}

.empty-day{
    color:#aaa;
    font-size:13px;
    padding:10px 0;
}

.stay-card{
    background:white;
    border-radius:22px;
    padding:22px;
    margin-bottom:13px;
}

.stay-head{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.stay-name{
    font-size:18px;
    font-weight:800;
}

.stay-price{
    font-weight:800;
}

.stay-info{
    margin-top:10px;
    color:#777;
    font-size:13px;
    line-height:1.8;
}

.stay-notes{
    margin-top:8px;
    color:#666;
    font-size:13px;
    white-space:pre-wrap;
}

/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:25px;
    padding:25px;
}

.modal h2{
    margin:0 0 20px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .logo{
        font-size:24px;
    }

    .user-email{
        display:none;
    }

    .destination-grid,
    .journey-grid{
        grid-template-columns:1fr;
    }

    .page-title{
        align-items:flex-start;
        flex-direction:column;
    }

    .page-title .btn{
        width:100%;
    }

    .detail-top{
        grid-template-columns:1fr;
    }

    .detail-info h1{
        font-size:25px;
    }

    .itinerary-head,
    .stay-head{
        flex-direction:column;
    }

    .itinerary-price,
    .stay-price{
        align-self:flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="header-inner">

        <div class="logo">
            GOYA｜走呀
        </div>

        <div class="header-right" id="headerRight"></div>

    </div>
</header>


<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <h1>GOYA｜走呀</h1>

        <p>躺平也能玩，小資也能飛。</p>

        <div class="field">
            <label>Email</label>
            <input
                id="loginEmail"
                type="email"
                placeholder="輸入 Email"
            >
        </div>

        <div class="field">
            <label>密碼</label>
            <input
                id="loginPassword"
                type="password"
                placeholder="輸入密碼"
            >
        </div>

        <button class="btn full" onclick="login()">
            登入
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</div>


<!-- =========================
     DESTINATION PAGE
========================= -->

<div id="destinationPage" class="page" style="display:none;">

    <div class="page-title">

        <div>
            <h1>去哪裡玩？</h1>
            <p>選一個目的地開始探索旅程。</p>
        </div>

        <button class="btn" onclick="openDestinationModal()">
            ＋新增目的地
        </button>

    </div>

    <div id="destinationGrid" class="destination-grid"></div>

</div>


<!-- =========================
     JOURNEY PAGE
========================= -->

<div id="journeyPage" class="page" style="display:none;">

    <button class="back-btn" onclick="showDestinations()">
        ← 所有目的地
    </button>

    <div class="page-title">

        <div>
            <h1 id="journeyPageTitle"></h1>
            <p>選擇一個旅程開始查看。</p>
        </div>

        <button class="btn" onclick="openJourneyModal()">
            ＋新增旅程
        </button>

    </div>

    <div id="journeyGrid" class="journey-grid"></div>

</div>


<!-- =========================
     DETAIL PAGE
========================= -->

<div id="detailPage" class="page" style="display:none;">

    <button class="back-btn" onclick="showJourneys(currentDestination)">
        ← 返回旅程
    </button>

    <div id="detailContent"></div>

</div>

</div>


<!-- =========================
     DESTINATION MODAL
========================= -->

<div id="destinationModal" class="modal-bg">

    <div class="modal">

        <h2 id="destinationModalTitle">
            新增目的地
        </h2>

        <div class="field">

            <label>
                目的地名稱
            </label>

            <input
                id="destinationInput"
                placeholder="例如：日本"
            >

        </div>

        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeModal('destinationModal')"
            >
                取消
            </button>

            <button
                class="btn"
                onclick="saveDestination()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<!-- =========================
     JOURNEY MODAL
========================= -->

<div id="journeyModal" class="modal-bg">

    <div class="modal">

        <h2 id="journeyModalTitle">
            新增旅程
        </h2>

        <div class="field">

            <label>
                主標題
            </label>

            <input
                id="journeyTitle"
                placeholder="例如：大阪 5 天 4 夜"
            >

        </div>

        <div class="field">

            <label>
                副標題
            </label>

            <input
                id="journeySubtitle"
                placeholder="例如：五天四夜只要兩萬"
            >

        </div>

        <div class="field">

            <label>
                創作者名稱
            </label>

            <input
                id="journeyCreator"
                placeholder="例如：IVY"
            >

        </div>

        <div class="field">

            <label>
                日期
            </label>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

                <input
                    id="journeyStartDate"
                    type="date"
                >

                <input
                    id="journeyEndDate"
                    type="date"
                >

            </div>

        </div>

        <div class="field">

            <label>
                旅程介紹
            </label>

            <textarea
                id="journeyDescription"
                placeholder="可以寫一些旅程介紹..."
            ></textarea>

        </div>

        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeModal('journeyModal')"
            >
                取消
            </button>

            <button
                class="btn"
                onclick="saveJourney()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ITINERARY MODAL
========================= -->

<div id="itineraryModal" class="modal-bg">

    <div class="modal">

        <h2 id="itineraryModalTitle">
            新增行程
        </h2>

        <div class="field">

            <label>
                行程名稱
            </label>

            <input
                id="itineraryTitle"
                placeholder="例如：伏見稻荷大社"
            >

        </div>

        <div class="field">

            <label>
                地點
            </label>

            <input
                id="itineraryLocation"
                placeholder="例如：京都"
            >

        </div>

        <div class="field">

            <label>
                交通
            </label>

            <input
                id="itineraryTransport"
                placeholder="例如：JR"
            >

        </div>

        <div class="field">

            <label>
                價格（台幣）
            </label>

            <input
                id="itineraryPrice"
                type="number"
                min="0"
                placeholder="0"
            >

        </div>

        <div class="field">

            <label>
                需要時間
            </label>

            <input
                id="itineraryDuration"
                placeholder="例如：2 小時"
            >

        </div>

        <div class="field">

            <label>
                時間
            </label>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

                <input
                    id="itineraryStartTime"
                    type="time"
                >

                <input
                    id="itineraryEndTime"
                    type="time"
                >

            </div>

        </div>

        <div class="field">

            <label>
                備註
            </label>

            <textarea
                id="itineraryNotes"
                placeholder="可以寫注意事項..."
            ></textarea>

        </div>

        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeModal('itineraryModal')"
            >
                取消
            </button>

            <button
                class="btn"
                onclick="saveItinerary()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<!-- =========================
     STAY MODAL
========================= -->

<div id="stayModal" class="modal-bg">

    <div class="modal">

        <h2 id="stayModalTitle">
            新增住宿
        </h2>

        <div class="field">

            <label>
                住宿名稱
            </label>

            <input
                id="stayName"
                placeholder="例如：大阪難波飯店"
            >

        </div>

        <div class="field">

            <label>
                地址
            </label>

            <input
                id="stayAddress"
                placeholder="輸入住宿地址"
            >

        </div>

        <div class="field">

            <label>
                入住／退房
            </label>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

                <input
                    id="stayCheckIn"
                    type="date"
                >

                <input
                    id="stayCheckOut"
                    type="date"
                >

            </div>

        </div>

        <div class="field">

            <label>
                價格（台幣）
            </label>

            <input
                id="stayPrice"
                type="number"
                min="0"
                placeholder="0"
            >

        </div>

        <div class="field">

            <label>
                訂房資訊
            </label>

            <input
                id="stayBooking"
                placeholder="例如：Booking.com"
            >

        </div>

        <div class="field">

            <label>
                備註
            </label>

            <textarea
                id="stayNotes"
                placeholder="例如：已付款、含早餐..."
            ></textarea>

        </div>

        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeModal('stayModal')"
            >
                取消
            </button>

            <button
                class="btn"
                onclick="saveStay()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://vkwriekcbvvvkmsmlbzu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YIXuILncvi7L4It4Mgi99A_neR0cFry";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   STATE
========================================= */

let currentUser = null;

let currentDestination = "";

let currentTrip = null;

let editingDestination = null;

let editingJourney = null;

let editingItinerary = null;

let editingStay = null;

let currentDayNumber = 1;


/* =========================================
   DEFAULT DESTINATIONS
========================================= */

const DEFAULT_DESTINATIONS = [
    "日本",
    "韓國",
    "越南",
    "黃刀鎮極光"
];


/* =========================================
   INIT
========================================= */

window.addEventListener("load", async () => {

    const {
        data
    } = await supabaseClient.auth.getSession();

    if(data.session){

        currentUser =
            data.session.user;

        showDestinations();

    }else{

        showLogin();

    }

});


/* =========================================
   AUTH
========================================= */

async function login(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document
        .getElementById("loginMessage");

    message.textContent =
        "登入中...";

    const {
        data,
        error
    } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if(error){

        message.textContent =
            error.message;

        return;

    }

    currentUser =
        data.user;

    message.textContent = "";

    showDestinations();

}


async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;

    showLogin();

}


/* =========================================
   HEADER
========================================= */

function updateHeader(){

    const header =
        document.getElementById("headerRight");

    if(!currentUser){

        header.innerHTML = "";

        return;

    }

    header.innerHTML = `

        <span class="user-email">
            ${escapeHtml(currentUser.email || "")}
        </span>

        <button
            class="btn btn-light"
            onclick="logout()"
        >
            登出
        </button>

    `;

}


/* =========================================
   PAGE SWITCH
========================================= */

function hideAllPages(){

    document
        .getElementById("loginPage")
        .style.display = "none";

    document
        .getElementById("destinationPage")
        .style.display = "none";

    document
        .getElementById("journeyPage")
        .style.display = "none";

    document
        .getElementById("detailPage")
        .style.display = "none";

}


function showLogin(){

    hideAllPages();

    document
        .getElementById("loginPage")
        .style.display = "flex";

    updateHeader();

}


async function showDestinations(){

    hideAllPages();

    document
        .getElementById("destinationPage")
        .style.display = "block";

    updateHeader();

    await renderDestinations();

}


async function showJourneys(destination){

    currentDestination =
        destination;

    hideAllPages();

    document
        .getElementById("journeyPage")
        .style.display = "block";

    document
        .getElementById("journeyPageTitle")
        .textContent =
            destination;

    updateHeader();

    await renderJourneys(destination);

}


async function showDetail(tripId){

    hideAllPages();

    document
        .getElementById("detailPage")
        .style.display = "block";

    await loadTripDetail(tripId);

}


/* =========================================
   DESTINATION STORAGE
========================================= */

function getDestinations(){

    let list =
        localStorage.getItem(
            "goya_destinations"
        );

    if(!list){

        list =
            DEFAULT_DESTINATIONS;

        localStorage.setItem(

        );

    }

    try{

async function renderDestinations(){

    const grid =
        document.getElementById(
            "destinationGrid"
        );

    const destinations =
        getDestinations();

    let tripCounts = {};

    const {
        data: trips
    } = await supabaseClient
        .from("trips")
        .select("destination");

    if(trips){

        trips.forEach(trip => {

            const destination =
                trip.destination || "";

            tripCounts[destination] =
                (tripCounts[destination] || 0) + 1;

        });

    }

    grid.innerHTML = "";

    if(!destinations.length){

        grid.innerHTML = `
            <div class="empty">
                還沒有目的地
            </div>
        `;

        return;

    }

    destinations.forEach((destination,index) => {

        const card =
            document.createElement("div");

        card.className =
            "destination-card";

        card.draggable = true;

        card.dataset.index =
            index;

        card.innerHTML = `

            <div class="drag-handle">
                ⋮⋮
            </div>

            <div
                class="destination-name"
            >
                ${escapeHtml(destination)}
            </div>

            <div
                class="destination-count"
            >
                ${tripCounts[destination] || 0}
                個旅程
            </div>

            <div
                class="destination-actions"
            >

                <button
                    onclick="
                        event.stopPropagation();
                        openDestinationModal(${index})
                    "
                >
                    編輯
                </button>

                <button
                    class="delete"
                    onclick="
                        event.stopPropagation();
                        deleteDestination(${index})
                    "
                >
                    刪除
                </button>

            </div>

        `;

        card.addEventListener(
            "click",
            () => showJourneys(destination)
        );

        card.addEventListener(
            "dragstart",
            () => {

                card.classList.add("dragging");

            }
        );

        card.addEventListener(
            "dragend",
            () => {

                card.classList.remove("dragging");

            }
        );

        card.addEventListener(
            "dragover",
            event => {

                event.preventDefault();

                const dragging =
                    document.querySelector(
                        ".destination-card.dragging"
                    );

                if(!dragging || dragging === card)
                    return;

                const rect =
                    card.getBoundingClientRect();

                const after =
                    event.clientY >
                    rect.top +
                    rect.height / 2;

                const parent =
                    card.parentNode;

                if(after){

                    parent.insertBefore(
                        dragging,
                        card.nextSibling
                    );

                }else{

                    parent.insertBefore(
                        dragging,
                        card
                    );

                }

                saveDestinationOrder();

            }
        );

        grid.appendChild(card);

    });

}


function saveDestinationOrder(){

    const cards =
        [...document.querySelectorAll(
            ".destination-card"
        )];

    const list =
        cards.map(card =>
            card.querySelector(
                ".destination-name"
            ).textContent
        );

    saveDestinations(list);

}

function saveDestination(){

    const input =
        document.getElementById(
            "destinationInput"
        );

    const name =
        input.value.trim();

    if(!name){

        alert("請輸入目的地名稱");

        return;

    }

    const list =
        getDestinations();

    if(editingDestination === null){

        if(list.includes(name)){

            alert("這個目的地已經存在");

            return;

        }

        list.push(name);

    }else{

        const oldName =
            list[editingDestination];

        list[editingDestination] =
            name;

        if(oldName !== name){

            updateTripsDestination(
                oldName,
                name
            );

        }

    }

    saveDestinations(list);

    closeModal(
        "destinationModal"
    );

    renderDestinations();

}


async function updateTripsDestination(
    oldName,
    newName
){

    await supabaseClient
        .from("trips")
        .update({
            destination:newName
        })
        .eq(
            "destination",
            oldName
        );

}


async function deleteDestination(index){

    const list =
        getDestinations();

    const name =
        list[index];

    const confirmDelete =
        confirm(
            `確定要刪除「${name}」嗎？`
        );

    if(!confirmDelete)
        return;

    list.splice(index,1);

    saveDestinations(list);

    renderDestinations();

}

/* =========================================
   JOURNEY META
========================================= */

function parseTripMeta(trip){

    let meta = {
        subtitle:"",
        creator:""
    };

    if(trip.description){

        try{

            const parsed =
                JSON.parse(
                    trip.description
                );

            if(parsed &&
               typeof parsed === "object"){

                meta.subtitle =
                    parsed.subtitle || "";

                meta.creator =
                    parsed.creator || "";

                meta.description =
                    parsed.description || "";

                return meta;

            }

        }catch(e){}

    }

    return meta;

}


function makeTripDescription(
    subtitle,
    creator,
    description
){

    return JSON.stringify({
        subtitle:
            subtitle || "",

        creator:
            creator || "",

        description:
            description || ""
    });

}

   JOURNEY ORDER
========================================= */

function getJourneyOrder(
    destination
){

    const key =
        "goya_journey_order_" +
        destination;

    const value =
        localStorage.getItem(key);

    if(!value)
        return [];

    try{

        return JSON.parse(value);

    }catch{

        return [];

    }

}


function saveJourneyOrder(
    destination
){

    const cards =
        [...document.querySelectorAll(
            ".journey-card"
        )];

    const order =
        cards.map(card =>
            card.dataset.id
        );

    localStorage.setItem(
        "goya_journey_order_" +
        destination,
        JSON.stringify(order)
    );

}


function sortTripsByOrder(
    trips,
    order
){

    if(!order.length)
        return trips;

    return [
        ...trips
            .filter(t =>
                order.includes(t.id)
            )
            .sort(
                (a,b) =>
                    order.indexOf(a.id) -
                    order.indexOf(b.id)
            ),

        ...trips.filter(
            t =>
                !order.includes(t.id)
        )
    ];

}

        return;

    const {
        data
    } = await supabaseClient
        .from("itineraries")
        .select("day_number")
        .eq(
            "trip_id",
            currentTrip.id
        )
        .order(
            "day_number",
            {
                ascending:false
            }
        )
        .limit(1);

    let nextDay = 1;

    if(data && data.length){

        nextDay =
            Number(

    openItineraryModal(
        nextDay

}

async function openItineraryModal(
    dayNumber,
    itemId = null
){

    currentDayNumber =
        dayNumber;

    editingItinerary =
        itemId;

    document
        .getElementById(
            "itineraryModal"
        )
        .classList.add("show");

    document
        .getElementById(
            "itineraryModalTitle"
        )
        .textContent =
            itemId
            ?
            `編輯 Day ${dayNumber} 行程`
            :
            `新增 Day ${dayNumber} 行程`;

    if(!itemId){

        clearItineraryForm();

        return;

    }

    const {
        data,
        error
    } = await supabaseClient
        .from("itineraries")
        .select("*")
        .eq(
            "id",
            itemId
        )
        .single();

    if(error){

        alert(error.message);

        return;

    }

    document
        .getElementById("itineraryTitle")
        .value =
            data.title || "";

    document
        .getElementById("itineraryLocation")
        .value =
            data.location || "";

    document
        .getElementById("itineraryTransport")
        .value =
            data.transport || "";

    document
        .getElementById("itineraryPrice")
        .value =
            data.price || "";

    document
        .getElementById("itineraryDuration")
        .value =
            data.duration || "";

    document
        .getElementById("itineraryStartTime")
        .value =
            data.start_time || "";

    document
        .getElementById("itineraryEndTime")
        .value =
            data.end_time || "";

    document
        .getElementById("itineraryNotes")
        .value =
            data.notes || "";

}


function clearItineraryForm(){

    document
        .getElementById("itineraryTitle")
        .value = "";

    document
        .getElementById("itineraryLocation")
        .value = "";

    document
        .getElementById("itineraryTransport")
        .value = "";

    document
        .getElementById("itineraryPrice")
        .value = "";

    document
        .getElementById("itineraryDuration")
        .value = "";

    document
        .getElementById("itineraryStartTime")
        .value = "";

    document
        .getElementById("itineraryEndTime")
        .value = "";

    document
        .getElementById("itineraryNotes")
        .value = "";

}


async function saveItinerary(){

    if(!currentTrip)
        return;

    const payload = {

        trip_id:
            currentTrip.id,

        day_number:
            currentDayNumber,

        title:
            document
            .getElementById("itineraryTitle")
            .value
            .trim(),

        location:
            document
            .getElementById("itineraryLocation")
            .value
            .trim(),

        transport:
            document
            .getElementById("itineraryTransport")
            .value
            .trim(),

        price:
            Number(
                document
                .getElementById("itineraryPrice")
                .value
            ) || 0,

        duration:
            document
            .getElementById("itineraryDuration")
            .value
            .trim(),

        start_time:
            document
            .getElementById("itineraryStartTime")
            .value || null,

        end_time:
            document
            .getElementById("itineraryEndTime")
            .value || null,

        notes:
            document
            .getElementById("itineraryNotes")
            .value
            .trim()

    };


    if(!payload.title){

        alert("請輸入行程名稱");

        return;

    }


    let result;

    if(editingItinerary){

        result =
            await supabaseClient
                .from("itineraries")
                .update(payload)
                .eq(
                    "id",
                    editingItinerary
                );

    }else{

        result =
            await supabaseClient
                .from("itineraries")
                .insert(payload);

    }

    if(result.error){

        alert(
            "儲存失敗：" +
            result.error.message
        );

        return;

    }

    closeModal(
        "itineraryModal"
    );

    await loadTripDetail(
        currentTrip.id
    );

}


async function deleteItinerary(
    id
){

    if(!confirm("確定要刪除這個行程嗎？"))
        return;

    const {
        error
    } = await supabaseClient
        .from("itineraries")
        .delete()
        .eq(
            "id",
            id
        );

    if(error){

        alert(error.message);

        return;

    }

    await loadTripDetail(
        currentTrip.id
    );

}

/* =========================================
   TOTAL
========================================= */

function calculateTotal(
    itineraries,
    stays
){

    let total = 0;

    itineraries.forEach(item => {

        total +=
            Number(item.price) || 0;

    });

    stays.forEach(stay => {

        total +=
            Number(stay.price) || 0;

    });

    return total;

}


/* =========================================
   UTILITIES
========================================= */

function formatNumber(number){

    return Number(number || 0)
        .toLocaleString("zh-TW");

}


function formatDateRange(
    start,
    end
){

    if(start && end)
        return `${start} ～ ${end}`;

    if(start)
        return `開始日期：${start}`;

    if(end)
        return `結束日期：${end}`;

    return "";

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}


/* =========================================
   CLICK OUTSIDE MODAL
========================================= */

document.querySelectorAll(
    ".modal-bg"
).forEach(modal => {

    modal.addEventListener(
        "click",
        event => {

            if(
                event.target === modal
            ){

                modal.classList.remove(
                    "show"
                );

            }

        }
    );

});


/* =========================================
   SESSION CHANGE
========================================= */

supabaseClient.auth.onAuthStateChange(
    (_event, session) => {

        if(session){

            currentUser =
                session.user;

            updateHeader();

        }else{

            currentUser = null;

            showLogin();

        }

    }
);
