<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOYA｜走呀</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f4f1;
    color:#222;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(245,244,241,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #e4e1dc;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    min-height:64px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
}

.logo small{
    font-size:11px;
    color:#888;
    letter-spacing:1px;
    margin-left:5px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px 70px;
}

.hero{
    padding:45px 0 35px;
}

.hero h1{
    margin:0;
    font-size:40px;
    letter-spacing:3px;
}

.hero p{
    margin:12px 0 0;
    color:#777;
    line-height:1.8;
}

.btn{
    border:0;
    border-radius:14px;
    padding:11px 16px;
    background:#222;
    color:#fff;
    font-weight:700;
}

.btn-light{
    background:#fff;
    color:#333;
    border:1px solid #ddd;
}

.btn-small{
    padding:8px 12px;
    font-size:13px;
    border-radius:11px;
}

.btn-danger{
    background:#f1e4e1;
    color:#9c493d;
}

.section{
    margin-top:30px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.section-title{
    margin:0;
    font-size:22px;
    letter-spacing:1px;
}

.section-subtitle{
    color:#888;
    font-size:13px;
    margin-top:4px;
}

.card{
    background:#fff;
    border:1px solid #e6e3df;
    border-radius:22px;
    padding:20px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.destination-card{
    min-height:180px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:25px;
    background:#fff;
    border:1px solid #e6e3df;
    border-radius:24px;
    cursor:pointer;
    transition:.2s;
}

.destination-card:hover{
    transform:translateY(-2px);
}

.destination-card h3{
    margin:0;
    font-size:24px;
}

.destination-card p{
    margin:8px 0 0;
    color:#888;
}

.journey-card{
    background:#fff;
    border:1px solid #e5e2de;
    border-radius:22px;
    overflow:hidden;
}

.journey-cover{
    width:100%;
    height:220px;
    background:#e8e6e2;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    overflow:hidden;
}

.journey-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.journey-body{
    padding:20px;
}

.journey-title{
    font-size:22px;
    font-weight:800;
}

.journey-subtitle{
    color:#888;
    margin-top:7px;
}

.journey-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.meta-pill{
    padding:6px 10px;
    background:#f4f2ef;
    border-radius:10px;
    font-size:12px;
    color:#666;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:#999;
    background:#fff;
    border:1px dashed #ddd;
    border-radius:20px;
}

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal-backdrop.show{
    display:flex;
}

.modal{
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:30px 30px 0 0;
    padding:28px;
}

.modal.large{
    width:min(900px,100%);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:25px;
}

.modal-title{
    margin:0;
    font-size:28px;
}

.close-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#f1f1f1;
    font-size:24px;
    color:#3986e8;
}

.form-group{
    margin-bottom:18px;
}

.form-label{
    display:block;
    margin-bottom:8px;
    color:#666;
    font-size:14px;
}

.input,
.textarea,
.select{
    width:100%;
    border:1px solid #ddd;
    border-radius:16px;
    padding:14px 16px;
    background:#fff;
    outline:none;
}

.input:focus,
.textarea:focus,
.select:focus{
    border-color:#999;
}

.textarea{
    min-height:130px;
    resize:vertical;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:25px;
}

.info-box{
    background:#fff;
    border:1px solid #e5e2de;
    border-radius:22px;
    padding:20px;
    margin-bottom:15px;
}

.info-box-title{
    font-size:18px;
    font-weight:800;
}

.info-box-content{
    margin-top:12px;
}

.info-box-actions{
    margin-top:15px;
}

.text-action{
    border:0;
    background:transparent;
    padding:0;
    color:#3986e8;
    font-size:13px;
}

.trip-detail-title{
    font-size:34px;
    margin:0;
    letter-spacing:1px;
}

.trip-detail-subtitle{
    color:#888;
    margin-top:8px;
    font-size:15px;
}

.trip-description{
    white-space:pre-wrap;
    line-height:1.8;
    color:#555;
}

.total-box{
    background:#1d1d1d;
    color:#fff;
    border-radius:22px;
    padding:22px;
    margin-bottom:20px;
}

.total-label{
    font-size:13px;
    color:#aaa;
}

.total-price{
    margin-top:4px;
    font-size:40px;
    font-weight:800;
}

.day-card{
    background:#fff;
    border:1px solid #e5e2de;
    border-radius:22px;
    padding:20px;
    margin-bottom:15px;
}

.day-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.day-title{
    font-size:21px;
    font-weight:800;
}

.item-card{
    background:#f7f6f3;
    border-radius:16px;
    padding:15px;
    margin-top:10px;
}

.item-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.item-name{
    font-weight:800;
}

.item-meta{
    margin-top:6px;
    color:#777;
    font-size:13px;
    line-height:1.7;
}

.item-price{
    white-space:nowrap;
    font-weight:700;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.photo-card{
    background:#eee;
    border-radius:16px;
    overflow:hidden;
}

.photo-card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.photo-note{
    padding:10px;
    font-size:13px;
    color:#666;
    background:#fff;
}

.visa-list{
    display:grid;
    gap:12px;
}

.visa-card{
    border:1px solid #e4e1dc;
    border-radius:18px;
    padding:16px;
    background:#faf9f7;
}

.visa-name{
    font-size:17px;
    font-weight:800;
}

.visa-link{
    display:block;
    margin-top:7px;
    color:#3986e8;
    font-size:13px;
    text-decoration:none;
    word-break:break-all;
}

.visa-price{
    margin-top:12px;
    font-weight:700;
}

.visa-twd{
    margin-top:4px;
    color:#777;
    font-size:13px;
}

.visa-empty{
    color:#999;
    font-size:14px;
}

.visa-editor{
    border:1px solid #e5e2de;
    border-radius:18px;
    padding:17px;
    margin-bottom:12px;
    background:#faf9f7;
}

.visa-editor-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.visa-editor-title{
    font-weight:800;
}

.visa-remove-btn{
    border:0;
    background:#f2e5e2;
    color:#a14b40;
    border-radius:10px;
    padding:7px 10px;
    font-size:12px;
}

.visa-price-grid{
    display:grid;
    grid-template-columns:1fr 130px;
    gap:10px;
}

.visa-twd-preview{
    margin-top:8px;
    color:#777;
    font-size:13px;
}

.visa-add-btn{
    width:100%;
    border:1px dashed #ccc;
    background:#fff;
    color:#555;
    padding:12px;
    border-radius:14px;
}

.login-screen{
    position:fixed;
    inset:0;
    background:#f5f4f1;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:min(420px,100%);
    background:#fff;
    border-radius:28px;
    padding:30px;
    border:1px solid #e5e2de;
}

.login-box h1{
    margin:0;
    font-size:32px;
}

.login-box p{
    color:#888;
    line-height:1.7;
}

.back-btn{
    border:0;
    background:transparent;
    padding:0;
    color:#666;
    margin-bottom:20px;
}

.photo-upload{
    border:1px dashed #ccc;
    border-radius:16px;
    padding:18px;
    text-align:center;
    color:#888;
}

@media(max-width:700px){
    .container{
        padding:20px 15px 60px;
    }

    .hero h1{
        font-size:32px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .photo-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .modal{
        padding:22px 18px;
    }

    .trip-detail-title{
        font-size:28px;
    }

    .visa-price-grid{
        grid-template-columns:1fr 110px;
    }
}
</style>
</head>

<body>

<!-- 登入 -->
<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>GOYA｜走呀</h1>
        <p>把想去的地方，慢慢整理成自己的旅行。</p>

        <div class="form-group">
            <label class="form-label">Email</label>
            <input id="loginEmail" class="input" type="email" placeholder="Email">
        </div>

        <div class="form-group">
            <label class="form-label">密碼</label>
            <input id="loginPassword" class="input" type="password" placeholder="密碼">
        </div>

        <button class="btn" style="width:100%" onclick="login()">
            登入
        </button>

        <button class="btn btn-light" style="width:100%;margin-top:10px" onclick="register()">
            註冊
        </button>

        <div id="loginMessage" style="margin-top:12px;color:#888;font-size:13px"></div>
    </div>
</div>


<header class="header hidden" id="mainHeader">
    <div class="header-inner">
        <div class="logo">
            GOYA<span style="color:#999">｜走呀</span>
        </div>

        <div class="header-right">
            <button class="btn btn-light btn-small" onclick="showHome()">
                首頁
            </button>

            <button class="btn btn-light btn-small" onclick="logout()">
                登出
            </button>
        </div>
    </div>
</header>


<main class="container hidden" id="app">

    <!-- 首頁 -->
    <section id="homePage">

        <div class="hero">
            <h1>走呀。</h1>
            <p>
                把想去的地方、想走的行程、想花的錢，<br>
                都整理在一起。
            </p>
        </div>

        <div class="section">
            <div class="section-header">
                <div>
                    <h2 class="section-title">目的地</h2>
                    <div class="section-subtitle">想去哪裡，就從這裡開始。</div>
                </div>
            </div>

            <div id="destinationGrid" class="grid"></div>
        </div>


        <div class="section">
            <div class="section-header">
                <div>
                    <h2 class="section-title">我的旅程</h2>
                    <div class="section-subtitle">自己的旅行，可以自己編輯。</div>
                </div>

                <button class="btn btn-small" onclick="openJourneyModal()">
                    ＋ 新增旅程
                </button>
            </div>

            <div id="journeyGrid"></div>
        </div>

    </section>


    <!-- 旅程詳細頁 -->
    <section id="detailPage" class="hidden">

        <button class="back-btn" onclick="showHome()">
            ← 返回
        </button>

        <div id="tripDetail"></div>

    </section>


    <!-- 照片頁 -->
    <section id="photoPage" class="hidden">

        <button class="back-btn" onclick="backToDetail()">
            ← 返回旅程
        </button>

        <div class="section-header">
            <div>
                <h2 class="section-title">旅行照片</h2>
                <div class="section-subtitle">把這趟旅行的照片全部放在這裡。</div>
            </div>

            <button class="btn btn-small" onclick="document.getElementById('photoInput').click()">
                ＋ 新增照片
            </button>
        </div>

        <input
            id="photoInput"
            type="file"
            accept="image/*"
            multiple
            class="hidden"
            onchange="handlePhotoUpload(event)"
        >

        <div id="photoGrid" class="photo-grid"></div>

    </section>

</main>


<!-- 編輯旅程 -->
<div id="journeyModal" class="modal-backdrop">
    <div class="modal">

        <div class="modal-header">
            <h2 class="modal-title" id="journeyModalTitle">
                編輯旅程
            </h2>

            <button class="close-btn" onclick="closeJourneyModal()">
                ×
            </button>
        </div>

        <input id="journeyId" type="hidden">

        <div class="form-group">
            <label class="form-label">主標題</label>
            <input id="journeyTitle" class="input">
        </div>

        <div class="form-group">
            <label class="form-label">副標題</label>
            <input id="journeySubtitle" class="input">
        </div>

        <div class="form-group">
            <label class="form-label">創作者名稱</label>
            <input id="journeyCreator" class="input">
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label class="form-label">開始日期</label>
                <input id="journeyStart" class="input" type="date">
            </div>

            <div class="form-group">
                <label class="form-label">結束日期</label>
                <input id="journeyEnd" class="input" type="date">
            </div>

        </div>

        <div class="form-group">
            <label class="form-label">旅程介紹</label>
            <textarea
                id="journeyDescription"
                class="textarea"
                placeholder="可以寫這趟旅程的特色、適合誰等等"
            ></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">封面照片網址</label>
            <input id="journeyCover" class="input" placeholder="https://...">
        </div>

        <div class="modal-actions">
            <button class="btn btn-light" onclick="closeJourneyModal()">
                取消
            </button>

            <button class="btn" onclick="saveJourney()">
                儲存
            </button>
        </div>

    </div>
</div>


<!-- 簽證獨立編輯 -->
<div id="visaModal" class="modal-backdrop">

    <div class="modal">

        <div class="modal-header">
            <h2 class="modal-title">
                編輯簽證
            </h2>

            <button class="close-btn" onclick="closeVisaModal()">
                ×
            </button>
        </div>

        <div style="color:#888;font-size:13px;line-height:1.7;margin-bottom:20px">
            只需要填寫簽證名稱、連結與價格。
        </div>

        <div id="visaEditorList"></div>

        <button class="visa-add-btn" onclick="addVisaRow()">
            ＋ 新增簽證
        </button>

        <div class="modal-actions">
            <button class="btn btn-light" onclick="closeVisaModal()">
                取消
            </button>

            <button class="btn" onclick="saveVisa()">
                儲存
            </button>
        </div>

    </div>
</div>


<!-- Day 編輯 -->
<div id="dayModal" class="modal-backdrop">

    <div class="modal">

        <div class="modal-header">
            <h2 class="modal-title" id="dayModalTitle">
                Day 1
            </h2>

            <button class="close-btn" onclick="closeDayModal()">
                ×
            </button>
        </div>

        <input id="dayNumber" type="hidden">

        <div class="form-group">
            <label class="form-label">Day 標題</label>
            <input id="dayTitle" class="input" placeholder="Day 1">
        </div>

        <div id="dayItems"></div>

        <button class="visa-add-btn" onclick="addDayItem()">
            ＋ 新增行程
        </button>

        <div class="modal-actions">
            <button class="btn btn-light" onclick="closeDayModal()">
                取消
            </button>

            <button class="btn" onclick="saveDay()">
                儲存
            </button>
        </div>

    </div>
</div>


<script>

const SUPABASE_URL =
    "https://vkwriekcbvvvkmsmlbzu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YIXuILncvi7L4It4Mgi99A_neR0cFry";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let journeys = [];
let currentTrip = null;
let currentVisaRows = [];
let currentDayItems = [];
let editingDayNumber = null;


/* =========================================================
   幣別
========================================================= */

const VISA_CURRENCIES = [
    ["TWD","NT$ 台幣"],
    ["JPY","¥ 日圓"],
    ["KRW","₩ 韓元"],
    ["USD","$ 美金"],
    ["EUR","€ 歐元"],
    ["GBP","£ 英鎊"],
    ["AUD","A$ 澳幣"],
    ["CAD","C$ 加幣"],
    ["VND","₫ 越南盾"],
    ["THB","฿ 泰銖"],
    ["HKD","HK$ 港幣"],
    ["SGD","S$ 新加坡幣"],
    ["CNY","¥ 人民幣"],
    ["NZD","NZ$ 紐幣"]
];

let visaExchangeRates = {};
let visaExchangeRatesLoaded = false;


/* =========================================================
   初始化
========================================================= */

async function init(){

    const {
        data:{
            session
        }
    } = await supabaseClient.auth.getSession();

    if(session){

        currentUser = session.user;

        showApp();

        await loadJourneys();

    }else{

        showLogin();

    }
}


supabaseClient.auth.onAuthStateChange(
    async(event,session)=>{

        if(session){

            currentUser = session.user;

            showApp();

            await loadJourneys();

        }else{

            currentUser = null;

            showLogin();

        }

    }
);


/* =========================================================
   登入
========================================================= */

function showLogin(){

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    document
        .getElementById("mainHeader")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.add("hidden");

}


function showApp(){

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("mainHeader")
        .classList.remove("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    showHome();

}


async function login(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if(!email || !password){

        document.getElementById("loginMessage").textContent =
            "請輸入 Email 與密碼";

        return;

    }

    const {
        error
    } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if(error){

        document.getElementById("loginMessage").textContent =
            error.message;

    }

}


async function register(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if(!email || !password){

        document.getElementById("loginMessage").textContent =
            "請輸入 Email 與密碼";

        return;

    }

    const {
        error
    } = await supabaseClient.auth.signUp({
        email,
        password
    });

    document.getElementById("loginMessage").textContent =
        error
            ? error.message
            : "註冊成功，請確認 Email 後登入。";

}


async function logout(){

    await supabaseClient.auth.signOut();

}


/* =========================================================
   首頁
========================================================= */

function showHome(){

    document
        .getElementById("homePage")
        .classList.remove("hidden");

    document
        .getElementById("detailPage")
        .classList.add("hidden");

    document
        .getElementById("photoPage")

async function loadJourneys(){

    const {
        data,
        error
    } = await supabaseClient
        .from("journeys")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        journeys = [];

        renderJourneys();

        return;

    }

    journeys = data || [];

    renderJourneys();

}


function parseTripDescription(value){

    if(!value){

        return {
            subtitle:"",
            creator:"",
            description:"",
            other:"",
            days:[],
            photos:[],
            visa:[]
        };

    }

    try{

        const parsed =
            typeof value === "string"
                ? JSON.parse(value)
                : value;

        return {
            subtitle:parsed.subtitle || "",
            creator:parsed.creator || "",
            description:parsed.description || "",
            other:parsed.other || "",
            days:Array.isArray(parsed.days)
                ? parsed.days
                : [],
            photos:Array.isArray(parsed.photos)
                ? parsed.photos
                : [],
            visa:Array.isArray(parsed.visa)
                ? parsed.visa
                : []
        };

    }catch(e){

        return {
            subtitle:"",
            creator:"",
            description:String(value),
            other:"",
            days:[],
            photos:[],
            visa:[]
        };

    }

}

async function openJourneyModal(id=null){

    document
        .getElementById("journeyModal")
        .classList.add("show");

    document.getElementById("journeyId").value =
        id || "";

    document.getElementById("journeyModalTitle").textContent =
        id ? "編輯旅程" : "新增旅程";

    document.getElementById("journeyTitle").value = "";
    document.getElementById("journeySubtitle").value = "";
    document.getElementById("journeyCreator").value = "";
    document.getElementById("journeyStart").value = "";
    document.getElementById("journeyEnd").value = "";
    document.getElementById("journeyDescription").value = "";
    document.getElementById("journeyCover").value = "";

    if(!id){

        return;

    }

    const trip =
        journeys.find(x => String(x.id) === String(id));

    if(!trip){

        return;

    }

    const info =
        parseTripDescription(trip.description);

    document.getElementById("journeyTitle").value =
        trip.title || "";

    document.getElementById("journeySubtitle").value =
        info.subtitle || "";

    document.getElementById("journeyCreator").value =
        info.creator || "";

    document.getElementById("journeyStart").value =
        trip.start_date || "";

    document.getElementById("journeyEnd").value =
        trip.end_date || "";

    document.getElementById("journeyDescription").value =
        info.description || "";

    document.getElementById("journeyCover").value =
        trip.cover_image || "";

}


function closeJourneyModal(){

    document
        .getElementById("journeyModal")
        .classList.remove("show");

}


async function saveJourney(){

    const id =
        document.getElementById("journeyId").value;

    const title =
        document.getElementById("journeyTitle").value.trim();

    if(!title){

        alert("請輸入主標題");

        return;

    }

    const oldTrip =
        id
        ?
        journeys.find(x=>String(x.id)===String(id))
        :
        null;

    const oldInfo =
        oldTrip
        ?
        parseTripDescription(oldTrip.description)
        :
        {
            days:[],
            photos:[],
            visa:[],
            other:""
        };

    /*
      這裡非常重要：

      編輯旅程只處理旅程本身的資料。
      不在這裡建立、修改或刪除 visa。

      visa 仍然保存在旅程資料裡，
      但由「簽證／入境資訊 → 編輯」獨立管理。
    */

    const descriptionJson =
        JSON.stringify({

            subtitle:
                document
                    .getElementById("journeySubtitle")
                    .value
                    .trim(),

            creator:
                document
                    .getElementById("journeyCreator")
                    .value
                    .trim(),

            description:
                document
                    .getElementById("journeyDescription")
                    .value
                    .trim(),

            other:
                oldInfo.other || "",

            days:
                oldInfo.days || [],

            photos:
                oldInfo.photos || [],

            visa:
                oldInfo.visa || []

        });


    const payload = {

        title,

        start_date:
            document
                .getElementById("journeyStart")
                .value || null,

        end_date:
            document
                .getElementById("journeyEnd")
                .value || null,

        cover_image:
            document
                .getElementById("journeyCover")
                .value
                .trim(),

        description:
            descriptionJson

    };


    let result;

    if(id){

        result =
            await supabaseClient
                .from("journeys")
                .update(payload)
                .eq("id",id);

    }else{

        payload.user_id =
            currentUser.id;

        result =
            await supabaseClient
                .from("journeys")
                .insert(payload);

    }


    if(result.error){

        console.error(result.error);

        alert(
            "儲存失敗：" +
            result.error.message
        );

        return;

    }


    closeJourneyModal();

    await loadJourneys();

}


async function deleteJourney(id){

    if(!confirm("確定要刪除這趟旅程嗎？")){

        return;

    }

    const {
        error
    } =
        await supabaseClient
            .from("journeys")
            .delete()
            .eq("id",id);

    if(error){

        alert("刪除失敗：" + error.message);

        return;

    }

    await loadJourneys();

}

function updateVisaRow(id,key,value){

    const row =
        currentVisaRows.find(
            x => x.id === id
        );

    if(!row){

        return;

    }

    row[key] = value;

    if(key === "price" || key === "currency"){

        const preview =
            document.getElementById(
                "visaPreview_" + id
            );

        if(preview){

            preview.textContent =
                formatVisaTWD(row);

        }

    }

}


function getVisaCurrencyOptions(selected){

    return VISA_CURRENCIES
        .map(([code,label])=>`

            <option
                value="${code}"
                ${code === selected ? "selected" : ""}>

                ${label}

            </option>

        `)
        .join("");

}


async function loadVisaExchangeRates(){

    if(visaExchangeRatesLoaded){

        return;

    }

    try{

        const response =
            await fetch(
                "https://open.er-api.com/v6/latest/TWD"
            );

        const data =
            await response.json();

        if(
            data &&
            data.result === "success" &&
            data.rates
        ){

            visaExchangeRates =
                data.rates;

            visaExchangeRatesLoaded =
                true;

        }

    }catch(error){

        console.error(
            "匯率載入失敗",
            error
        );

    }

}


function convertVisaToTWD(
    amount,
    currency
){

    const number =
        Number(amount);

    if(
        !number ||
        number <= 0
    ){

        return null;

    }

    if(currency === "TWD"){

        return number;

    }

    const rate =
        visaExchangeRates[currency];

    if(!rate){

        return null;

    }

    return number / rate;

}


function formatVisaOriginalPrice(row){

    if(
        row.price === "" ||
        row.price === null ||
        row.price === undefined
    ){

        return "";

    }

    const currency =
        getVisaCurrency(row.currency);

    return `${currency.symbol}${formatNumber(row.price)} ${row.currency}`;

}


function formatVisaTWD(row){

    if(
        row.price === "" ||
        row.price === null ||
        row.price === undefined
    ){

        return "";

    }

    const twd =
        convertVisaToTWD(
            row.price,
            row.currency || "TWD"
        );

    if(twd === null){

        return "台幣換算載入中…";

    }

    return `約 NT$ ${formatNumber(twd)}`;

}


function getVisaCurrency(code){

    const found =
        VISA_CURRENCIES.find(
            x => x[0] === code
        );

    if(!found){

        return {
            code:"TWD",
            label:"台幣",
            symbol:"NT$"
        };

    }

    const symbols = {

        TWD:"NT$",
        JPY:"¥",
        KRW:"₩",
        USD:"$",
        EUR:"€",
        GBP:"£",
        AUD:"A$",
        CAD:"C$",
        VND:"₫",
        THB:"฿",
        HKD:"HK$",
        SGD:"S$",
        CNY:"¥",
        NZD:"NZ$"

    };

    return {

        code:found[0],
        label:found[1],
        symbol:symbols[found[0]] || ""

    };

}

                                )}
                            </div>
                            `
                            :
                            ""
                        }

                    </div>

                `).join("")
            }

        </div>

    `;

}

async function saveDay(){

    if(!currentTrip){

        return;

    const info =
        parseTripDescription(
            currentTrip.description
        );

    let days =
        Array.isArray(info.days)
        ?

            JSON.stringify(info.days)
        )

        Number(
            document
                .getElementById("dayNumber")
                .value
        );


    const dayObject = {

                .getElementById("dayTitle")
                .value

    };

        days.findIndex(

        );


    if(index >= 0){

        days[index] =
            dayObject;

    }else{

        days.push(dayObject);

    }


    days.sort(
        (a,b) =>
            Number(a.day) -
            Number(b.day)
    );


    const descriptionJson =
        JSON.stringify({

            subtitle:
                info.subtitle || "",

            creator:
                info.creator || "",

            description:
                info.description || "",

            other:
                info.other || "",

            photos:
                info.photos || [],

            visa:
                info.visa || []

        });

        error
    } =
        await supabaseClient
            .from("journeys")
            .update({
                description:
                    descriptionJson
            })
            .eq("id",currentTrip.id);


    if(error){

        alert(
            "儲存失敗：" +
            error.message
        );

        return;

    }


    currentTrip.description =
        descriptionJson;

    const journeyIndex =
        journeys.findIndex(

        );

    closeDayModal();

function handlePhotoUpload(event){

    const files =
        Array.from(
            event.target.files || []
        );

    if(!files.length){

        return;

    }

    const info =
        parseTripDescription(
            currentTrip.description
        );

    const photos =
        Array.isArray(info.photos)
            ?
            info.photos
            :
            [];


    let finished = 0;

    files.forEach(file=>{

        const reader =
            new FileReader();

        reader.onload =
            async function(e){

                photos.push({

                    id:
                        "photo_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .slice(2),

                    url:e.target.result,

                    note:""

                });

                finished++;

                if(finished === files.length){

                    await savePhotos(
                        photos,
                        info
                    );

                }

            };

        reader.readAsDataURL(file);

    });

}

/* =========================================================
   工具
========================================================= */

function formatNumber(number){

    const n =
        Number(number);

    if(isNaN(n)){

        return "0";

    }

    return n.toLocaleString(
        "zh-TW",
        {
            maximumFractionDigits:2
        }
    );

}


function escapeHtml(value=""){

    return String(value)
        .replace(/[&<>"']/g,match=>({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        })[match]);

}


function escapeJs(value=""){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}


function safeUrl(url=""){

    const value =
        String(url).trim();

    if(
        /^https?:\/\//i.test(value)
    ){

        return value;

    }

    return "#";

}
