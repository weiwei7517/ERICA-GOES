<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERICA GOES｜躺平也能玩，小資也能飛</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f4f1;
    color:#292929;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    sans-serif;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    max-width:760px;
    margin:auto;
    min-height:100vh;
    background:#f5f4f1;
}

.header{
    padding:25px 20px 18px;
    background:#f5f4f1;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
}

.tagline{
    margin-top:5px;
    color:#888;
    font-size:13px;
}

.section{
    padding:0 18px 22px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:11px;
}

.section-title h2{
    margin:0;
    font-size:18px;
}

.btn{
    border:0;
    border-radius:12px;
    padding:9px 13px;
    background:#292929;
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.btn-light{
    background:#fff;
    color:#292929;
    border:1px solid #ddd;
}

.btn-danger{
    background:#eee;
    color:#777;
}

.empty{
    background:#fff;
    border:1px dashed #d5d4d0;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;
    color:#999;
    font-size:13px;
}

.trip-list{
    display:grid;
    gap:11px;
}

.trip-card{
    background:#fff;
    border:1px solid #e3e2de;
    border-radius:18px;
    padding:17px;
}

.trip-card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.trip-country{
    font-size:12px;
    color:#999;
    margin-bottom:4px;
}

.trip-name{
    font-size:19px;
    font-weight:900;
}

.trip-date{
    margin-top:7px;
    font-size:12px;
    color:#777;
}

.trip-note{
    margin-top:10px;
    background:#f6f5f2;
    border-radius:10px;
    padding:9px;
    color:#777;
    font-size:12px;
    line-height:1.6;
}

.trip-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:13px;
}

.trip-actions button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:9px;
    padding:7px 9px;
    font-size:11px;
}

.partner-list{
    display:grid;
    gap:9px;
}

.partner-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:17px;
    padding:14px;
}

.partner-category{
    color:#999;
    font-size:11px;
    margin-bottom:4px;
}

.partner-name{
    font-size:16px;
    font-weight:800;
}

.partner-desc{
    color:#777;
    font-size:12px;
    line-height:1.6;
    margin-top:5px;
}

.partner-link{
    display:inline-block;
    margin-top:9px;
    color:#292929;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
}

.detail-page{
    display:none;
}

.detail-header{
    padding:18px;
}

.back-btn{
    border:0;
    background:transparent;
    padding:0;
    font-size:13px;
    color:#777;
}

.detail-title{
    margin-top:15px;
}

.detail-title h1{
    margin:0;
    font-size:25px;
}

.detail-info{
    margin-top:6px;
    color:#888;
    font-size:12px;
}

.detail-note{
    margin-top:12px;
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:14px;
    padding:12px;
    color:#777;
    font-size:12px;
    line-height:1.6;
}

.detail-section{
    padding:0 18px 22px;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.feature-btn{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:14px;
    padding:13px;
    text-align:left;
    font-size:12px;
    font-weight:700;
}

.day-list{
    display:grid;
    gap:10px;
}

.day-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:18px;
    padding:15px;
}

.day-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.day-title{
    font-size:18px;
    font-weight:900;
}

.day-actions{
    display:flex;
    gap:5px;
}

.day-actions button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:6px 8px;
    font-size:11px;
}

.itinerary-list{
    display:grid;
    gap:9px;
    margin-top:12px;
}

.itinerary-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:17px;
    padding:15px;
}

.itinerary-number{
    color:#999;
    font-size:11px;
    margin-bottom:4px;
}

.itinerary-title{
    font-size:17px;
    font-weight:800;
}

.itinerary-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.info-box{
    background:#f5f4f1;
    border-radius:10px;
    padding:9px;
}

.info-label{
    color:#999;
    font-size:10px;
}

.info-value{
    font-size:13px;
    font-weight:600;
    margin-top:3px;
}

.itinerary-platform{
    margin-top:9px;
    font-size:12px;
    color:#777;
}

.itinerary-note{
    margin-top:9px;
    font-size:12px;
    color:#777;
    line-height:1.6;
}

.itinerary-link{
    display:inline-block;
    margin-top:9px;
    color:#292929;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
}

.recommendation{
    margin-top:10px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.recommendation span{
    display:inline-block;
    background:#f5f4f1;
    border-radius:9px;
    padding:5px 8px;
    font-size:10px;
    color:#888;
}

.item-actions{
    display:flex;
    gap:6px;
    margin-top:11px;
}

.item-actions button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:6px 8px;
    font-size:10px;
}

.total-box{
    background:#292929;
    color:#fff;
    border-radius:18px;
    padding:18px;
}

.total-label{
    font-size:11px;
    opacity:.65;
}

.total-value{
    margin-top:5px;
    font-size:28px;
    font-weight:900;
}

.list-box{
    display:grid;
    gap:9px;
}

.simple-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:15px;
    padding:13px;
}

.simple-title{
    font-weight:800;
    font-size:14px;
}

.simple-text{
    margin-top:5px;
    color:#777;
    font-size:12px;
    line-height:1.6;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.photo-card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #e1e0dc;
}

.photo-card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.photo-info{
    padding:9px;
}

.photo-place{
    font-size:12px;
    font-weight:700;
}

.photo-note{
    margin-top:4px;
    font-size:11px;
    color:#888;
}

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:1000;
    align-items:flex-end;
    justify-content:center;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:min(760px,100%);
    max-height:90vh;
    overflow:auto;
    background:#f5f4f1;
    border-radius:22px 22px 0 0;
    padding:22px 18px 28px;
}

.modal h2{
    margin:0 0 18px;
    font-size:20px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:11px;
    color:#777;
    font-weight:700;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #ddd;
    background:#fff;
    border-radius:11px;
    padding:11px;
    outline:none;
    font-size:13px;
}

.form-group textarea{
    min-height:85px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.modal-actions button{
    flex:1;
}

.radio-group{
    display:flex;
    gap:7px;
}

.radio-option{
    position:relative;
    flex:1;
}

.radio-option input{
    position:absolute;
    opacity:0;
}

.radio-option label{
    display:block;
    border:1px solid #ddd;
    background:#fff;
    border-radius:10px;
    padding:10px 5px;
    text-align:center;
    font-size:11px;
    color:#777;
    cursor:pointer;
}

.radio-option input:checked + label{
    background:#292929;
    color:#fff;
    border-color:#292929;
}

.check-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:13px;
    padding:11px;
}

.check-left{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
}

.check-left.done{
    text-decoration:line-through;
    color:#999;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    background:#292929;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:500px){

    .form-row{
        grid-template-columns:1fr;
    }

    .itinerary-info{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

<body>

<div class="app">

<div id="homePage">

<header class="header">

<div class="logo">
ERICA GOES
</div>

<div class="tagline">
躺平也能玩，小資也能飛。
</div>

</header>


<section class="section">

<div class="section-title">

<h2>
我的旅行
</h2>

<button
class="btn"
onclick="openTripModal()">

＋ 新增旅行

</button>

</div>

<div
id="tripList"
class="trip-list">
</div>

</section>


<section class="section">

<div class="section-title">

<h2>
🤝 推薦／合作
</h2>

<button
class="btn"
onclick="openPartnerModal()">

＋ 新增

</button>

</div>

<div
id="partnerList"
class="partner-list">
</div>

</section>

</div>


<div
id="detailPage"
class="detail-page">

<header class="detail-header">

<button
class="back-btn"
onclick="goHome()">

← 回到我的旅行

</button>

<div class="detail-title">

<h1 id="detailTripName">
</h1>

<div
id="detailTripInfo"
class="detail-info">
</div>

</div>

<div
id="detailTripNote"
class="detail-note">
</div>

</header>


<section class="detail-section">

<div class="feature-grid">

<button
class="feature-btn"
onclick="openVisaModal()">
🛂 簽證資訊
</button>

<button
class="feature-btn"
onclick="openChecklistModal()">
📋 出發前清單
</button>

<button
class="feature-btn"
onclick="openStayModal()">
🏨 住宿資訊
</button>

<button
class="feature-btn"
onclick="openBookingModal()">
✈️ 旅遊資訊
</button>

<button
class="feature-btn"
onclick="openPhotoModal()">
📷 旅行照片
</button>

</div>

</section>


<section class="detail-section">

<div class="section-title">

<h2>
📅 每日行程
</h2>

<button
class="btn"
onclick="addDay()">

＋ 新增 Day

</button>

</div>

<div
id="dayList"
class="day-list">
</div>

</section>


<section class="detail-section">

<div class="section-title">

<h2>
🛂 簽證資訊
</h2>

<button
class="btn btn-light"
onclick="openVisaModal()">

＋ 新增

</button>

</div>

<div
id="visaList"
class="list-box">
</div>

</section>


<section class="detail-section">

<div class="section-title">

<h2>
📋 出發前清單
</h2>

<button
class="btn btn-light"
onclick="openChecklistModal()">

＋ 新增

</button>

</div>

<div
id="checklistList"
class="list-box">
</div>

</section>


<section class="detail-section">

<div class="section-title">

<h2>
🏨 住宿資訊
</h2>

<button
class="btn btn-light"
onclick="openStayModal()">

＋ 新增

</button>

</div>

<div
id="stayList"
class="list-box">
</div>

</section>


<section class="detail-section">

<div class="section-title">

<h2>
📷 旅行照片
</h2>

<button
class="btn btn-light"
onclick="openPhotoModal()">

＋ 新增

</button>

</div>

<div
id="photoList"
class="photo-grid">
</div>

</section>


<section class="detail-section">

<div class="section-title">

<h2>
✈️ 旅遊資訊
</h2>

<button
class="btn btn-light"
onclick="openBookingModal()">

＋ 新增

</button>

</div>

<div
id="bookingList"
class="list-box">
</div>

</section>


<section class="detail-section">

<div class="total-box">

<div class="total-label">
目前預估總花費
</div>

<div
id="totalValue"
class="total-value">
NT$ 0
</div>

</div>

</section>

</div>

</div>


<!-- Trip Modal -->

<div
class="modal-bg"
id="tripModal">

<div class="modal">

<h2 id="tripModalTitle">
新增旅行
</h2>

<div class="form-group">

<label>
國家／地區
</label>

<input
id="tripCountry"
placeholder="例如：日本">

</div>

<div class="form-group">

<label>
旅行名稱
</label>

<input
id="tripName"
placeholder="例如：大阪京都五日遊">

</div>

<div class="form-row">

<div class="form-group">

<label>
開始日期
</label>

<input
id="tripStart"
type="date">

</div>

<div class="form-group">

<label>
結束日期
</label>

<input
id="tripEnd"
type="date">

</div>

</div>

<div class="form-group">

<label>
旅遊預算
</label>

<input
id="tripBudget"
type="number"
placeholder="例如：30000">

</div>

<div class="form-group">

<label>
旅行備注
</label>

<textarea
id="tripNote"
placeholder="例如：這次想吃很多美食、不要排太滿"></textarea>

</div>

<div class="modal-actions">

<button
class="btn btn-light"
onclick="closeModals()">

取消

</button>

<button
class="btn"
onclick="saveTrip()">

儲存

</button>

</div>

</div>

</div>


<!-- Itinerary Modal -->

<div
class="modal-bg"
id="itineraryModal">

<div class="modal">

<h2 id="itineraryModalTitle">
新增行程
</h2>

<div class="form-group">

<label>
行程名稱
</label>

<input
id="itineraryTitle"
placeholder="例如：關西機場 → 難波">

</div>

<div class="form-row">

<div class="form-group">

<label>
交通工具
</label>

<input
id="itineraryTransport"
placeholder="地鐵 / JR / 巴士 / 步行">

</div>

<div class="form-group">

<label>
花費（台幣）
</label>

<input
id="itineraryPrice"
type="number"
placeholder="0">

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>
需要時間
</label>

<input
id="itineraryTime"
placeholder="例如：45 分鐘">

</div>

<div class="form-group">

<label>
訂購平台
</label>

<input
id="itineraryPlatform"
placeholder="Klook / 官網 / 現場">

</div>

</div>


<div class="form-group">

<label>
店家資訊連結
</label>

<input
id="itineraryShopUrl"
type="url"
placeholder="https://...">

</div>


<div class="form-group">

<label>
店家地址
</label>

<input
id="itineraryAddress"
placeholder="例如：大阪府大阪市中央区...">

</div>


<div class="form-group">

<label>
推薦程度
</label>

<div class="radio-group">

<div class="radio-option">

<input
type="radio"
id="recGood"
name="itineraryRecommendation"
value="👍🏻 值得">

<label for="recGood">
👍🏻 值得
</label>

</div>

<div class="radio-option">

<input
type="radio"
id="recNormal"
name="itineraryRecommendation"
value="👌 普通">

<label for="recNormal">
👌 普通
</label>

</div>

<div class="radio-option">

<input
type="radio"
id="recBad"
name="itineraryRecommendation"
value="👎🏻 不用去">

<label for="recBad">
👎🏻 不用去
</label>

</div>

</div>

</div>


<div class="form-group">

<label>
備注
</label>

<textarea
id="itineraryNote"
placeholder="例如：建議先買票、要注意末班車"></textarea>

</div>


<div class="modal-actions">

<button
class="btn btn-light"
onclick="closeModals()">

取消

</button>

<button
class="btn"
onclick="saveItinerary()">

儲存

</button>

</div>

</div>

</div>


<!-- Partner Modal -->

<div
class="modal-bg"
id="partnerModal">

<div class="modal">

<h2>
新增推薦／合作
</h2>

<div class="form-group">

<label>
分類
</label>

<select id="partnerCategory">

<option>📱 eSIM 網路</option>
<option>🏨 住宿</option>
<option>✈️ 機票</option>
<option>🎟️ 景點／票券</option>
<option>🚆 交通</option>
<option>🍽️ 餐廳</option>
<option>🛍️ 購物</option>
<option>💰 優惠碼</option>
<option>🔗 其他</option>

</select>

</div>

<div class="form-group">

<label>
名稱
</label>

<input
id="partnerName"
placeholder="例如：日本 eSIM">

</div>

<div class="form-group">

<label>
介紹
</label>

<textarea
id="partnerDesc"
placeholder="簡單介紹這個推薦"></textarea>

</div>

<div class="form-group">

<label>
連結
</label>

<input
id="partnerUrl"
type="url"
placeholder="https://...">

</div>

<div class="modal-actions">

<button
class="btn btn-light"
onclick="closeModals()">
取消
</button>

<button
class="btn"
onclick="savePartner()">
儲存
</button>

</div>

</div>

</div>


<!-- Visa Modal -->

<div
class="modal-bg"
id="visaModal">

<div class="modal">

<h2>
新增簽證資訊
</h2>

<div class="form-group">

<label>
國家
</label>

<input
id="visaCountry"
placeholder="例如：日本">

</div>

<div class="form-group">

<label>
項目
</label>

<input
id="visaTitle"
placeholder="例如：台灣護照免簽">

</div>

<div class="form-group">

<label>
狀態
</label>

<input
id="visaNeed"
placeholder="免簽 / 需要申請">

</div>

<div class="form-group">

<label>
官方網站
</label>

<input
id="visaUrl"
type="url"
placeholder="https://...">

</div>

<div class="form-group">

<label>
備注
</label>

<textarea
id="visaNote"></textarea>

</div>

<div class="modal-actions">

<button
class="btn btn-light"
onclick="closeModals()">
取消
</button>

<button

<script>

const TRIP_KEY =
"ERICA_GOES_TRIPS";

const PARTNER_KEY =
"ERICA_GOES_PARTNERS";


let trips =
JSON.parse(
localStorage.getItem(TRIP_KEY) ||
"[]"
);

let partners =
JSON.parse(
localStorage.getItem(PARTNER_KEY) ||
"[]"
);


let currentTripId =
null;

let editingTripId =
null;

let editingItineraryId =
null;


function saveData(){

    localStorage.setItem(
        TRIP_KEY,
        JSON.stringify(trips)
    );

    localStorage.setItem(
        PARTNER_KEY,
        JSON.stringify(partners)
    );

}


function showToast(message){

    const toast =
    document.getElementById("toast");

    toast.textContent =
    message;

    toast.classList.add("show");

    setTimeout(
        () => {
            toast.classList.remove("show");
        },
        1800
    );

}


function escapeHTML(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeUrl(url){

    try{

        const parsed =
        new URL(url);

        if(
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        ){

            return parsed.href;

        }

    }catch(e){}

    return "#";

}


function getGoogleMapsUrl(
    title,
    address
){

    const query =
    [title,address]
    .filter(Boolean)
    .join(", ");

    return "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(query);

}


function ensureTripData(trip){

    if(!Array.isArray(trip.days)){
        trip.days = [];
    }

    if(!Array.isArray(trip.visa)){
        trip.visa = [];
    }

    if(!Array.isArray(trip.checklist)){
        trip.checklist = [];
    }

    if(!Array.isArray(trip.stays)){
        trip.stays = [];
    }

    if(!Array.isArray(trip.photos)){
        trip.photos = [];
    }

    if(!Array.isArray(trip.bookings)){
        trip.bookings = [];
    }

    if(!trip.note){
        trip.note = "";
    }

}


function getCurrentTrip(){

    return trips.find(
        trip =>
        trip.id === currentTripId
    );

}


function renderTrips(){

    const list =
    document.getElementById(
        "tripList"
    );

    if(!trips.length){

        list.innerHTML = `
        <div class="empty">
            還沒有旅行，先新增第一趟吧 ✈️
        </div>
        `;

        return;

    }

    list.innerHTML =
    trips.map(
        trip => {

            ensureTripData(trip);

            const dateText =
            trip.start && trip.end
            ?
            `${trip.start} ～ ${trip.end}`
            :
            "日期尚未設定";

            return `

            <div class="trip-card">

                <div class="trip-card-top">

                    <div>

                        <div class="trip-country">
                            ${escapeHTML(
                                trip.country ||
                                "未設定國家"
                            )}
                        </div>

                        <div class="trip-name">
                            ${escapeHTML(
                                trip.name ||
                                "未命名旅行"
                            )}
                        </div>

                        <div class="trip-date">
                            ${escapeHTML(dateText)}
                        </div>

                    </div>

                </div>

                ${
                    trip.note
                    ?
                    `
                    <div class="trip-note">
                        ${escapeHTML(trip.note)}
                    </div>
                    `
                    :
                    ""
                }

                <div class="trip-actions">

                    <button
                    onclick="openTrip(${trip.id})">
                        查看旅行
                    </button>

                    <button
                    onclick="editTrip(${trip.id})">
                        編輯
                    </button>

                    <button
                    onclick="deleteTrip(${trip.id})">
                        刪除
                    </button>

                </div>

            </div>

            `;

        }
    ).join("");

}


function openTripModal(){

    editingTripId = null;

    document.getElementById(
        "tripModalTitle"
    ).textContent =
    "新增旅行";

    clearTripForm();

    document.getElementById(
        "tripModal"
    ).classList.add("show");

}


function editTrip(id){

    const trip =
    trips.find(
        t => t.id === id
    );

    if(!trip) return;

    editingTripId =
    id;

    document.getElementById(
        "tripModalTitle"
    ).textContent =
    "編輯旅行";

    document.getElementById(
        "tripCountry"
    ).value =
    trip.country || "";

    document.getElementById(
        "tripName"
    ).value =
    trip.name || "";

    document.getElementById(
        "tripStart"
    ).value =
    trip.start || "";

    document.getElementById(
        "tripEnd"
    ).value =
    trip.end || "";

    document.getElementById(
        "tripBudget"
    ).value =
    trip.budget || "";

    document.getElementById(
        "tripNote"
    ).value =
    trip.note || "";

    document.getElementById(
        "tripModal"
    ).classList.add("show");

}


function saveTrip(){

    const country =
    document.getElementById(
        "tripCountry"
    ).value.trim();

    const name =
    document.getElementById(
        "tripName"
    ).value.trim();

    if(!name){

        alert("請輸入旅行名稱");

        return;

    }

    const data = {

        country,

        name,

        start:
        document.getElementById(
            "tripStart"
        ).value,

        end:
        document.getElementById(
            "tripEnd"
        ).value,

        budget:
        Number(
            document.getElementById(
                "tripBudget"
            ).value
        ) || 0,

        note:
        document.getElementById(
            "tripNote"
        ).value.trim()

    };

    if(editingTripId){

        const trip =
        trips.find(
            t =>
            t.id ===
            editingTripId
        );

        Object.assign(
            trip,
            data
        );

        showToast(
            "旅行已更新"
        );

    }else{

        trips.push({

            id:Date.now(),

            ...data,

            days:[],
            visa:[],
            checklist:[],
            stays:[],
            photos:[],
            bookings:[]

        });

        showToast(
            "旅行已新增"
        );

    }

    saveData();

    renderTrips();

    closeModals();

}


function deleteTrip(id){

    if(
        !confirm(
            "確定要刪除這趟旅行嗎？"
        )
    ){
        return;
    }

    trips =
    trips.filter(
        trip =>
        trip.id !== id
    );

    saveData();

    renderTrips();

    showToast(
        "旅行已刪除"
    );

}


function clearTripForm(){

    document.getElementById(
        "tripCountry"
    ).value = "";

    document.getElementById(
        "tripName"
    ).value = "";

    document.getElementById(
        "tripStart"
    ).value = "";

    document.getElementById(
        "tripEnd"
    ).value = "";

    document.getElementById(
        "tripBudget"
    ).value = "";

    document.getElementById(
        "tripNote"
    ).value = "";

}


function openTrip(id){

    currentTripId =
    id;

    const trip =
    getCurrentTrip();

    if(!trip) return;

    ensureTripData(trip);

    document.getElementById(
        "homePage"
    ).style.display =
    "none";

    document.getElementById(
        "detailPage"
    ).style.display =
    "block";

    renderDetail();

}


function goHome(){

    currentTripId =
    null;

    document.getElementById(
        "detailPage"
    ).style.display =
    "none";

    document.getElementById(
        "homePage"
    ).style.display =
    "block";

    renderTrips();

}


function renderDetail(){

    const trip =
    getCurrentTrip();

    if(!trip) return;

    ensureTripData(trip);

    document.getElementById(
        "detailTripName"
    ).textContent =
    trip.name || "未命名旅行";

    const dateText =
    trip.start && trip.end
    ?
    `${trip.start} ～ ${trip.end}`
    :
    "日期尚未設定";

    document.getElementById(
        "detailTripInfo"
    ).textContent =
    `${trip.country || "未設定國家"} ・ ${dateText}`;

    const note =
    document.getElementById(
        "detailTripNote"
    );

    if(trip.note){

        note.textContent =
        trip.note;

        note.style.display =
        "block";

    }else{

        note.style.display =
        "none";

    }

    renderDays();

    renderVisa();

    renderChecklist();

    renderStays();

    renderPhotos();

    renderBookings();

    updateTotal();

}


function addDay(){

    const trip =
    getCurrentTrip();

    if(!trip) return;

    ensureTripData(trip);

    trip.days.push({

        id:Date.now(),

        day:
        trip.days.length + 1,

        itineraries:[]

    });

    saveData();

    renderDays();

    showToast(
        "Day 已新增"
    );

}


function deleteDay(dayId){

    const trip =
    getCurrentTrip();

    if(!trip) return;

    if(
        !confirm(
            "確定要刪除這一天嗎？"
        )
    ){
        return;
    }

    trip.days =
    trip.days.filter(
        d =>
        d.id !== dayId
    );

    trip.days.forEach(
        (day,index) => {
            day.day =
            index + 1;
        }
    );

    saveData();

    renderDays();

    updateTotal();

}


function renderDays(){

    const trip =
    getCurrentTrip();

    if(!trip) return;

    const list =
    document.getElementById(
        "dayList"
    );

    if(!trip.days.length){

        list.innerHTML = `
        <div class="empty">
            還沒有行程，先新增 Day 1 吧 ✈️
        </div>
        `;

        return;

    }

    list.innerHTML =
    trip.days.map(
        day => {

            return `

            <div class="day-card">

                <div class="day-head">

                    <div class="day-title">
                        Day ${day.day}
                    </div>

                    <div class="day-actions">

                        <button
                        onclick="openItineraryModal(${day.id})">
                            ＋ 行程
                        </button>

                        <button
                        onclick="deleteDay(${day.id})">
                            刪除
                        </button>

                    </div>

                </div>

                <div class="itinerary-list">

                ${
                    day.itineraries.length
                    ?
                    day.itineraries.map(
                        (item,index) => {

                            return `

                            <div class="itinerary-card">

                                <div class="itinerary-number">
                                    行程 ${index + 1}
                                </div>

                                <div class="itinerary-title">
                                    ${escapeHTML(
                                        item.title ||
                                        "未命名行程"
                                    )}
                                </div>

                                <div class="itinerary-info">

                                    <div class="info-box">

                                        <div class="info-label">
                                            🚆 交通
                                        </div>

                                        <div class="info-value">
                                            ${escapeHTML(
                                                item.transport ||
                                                "未設定"
                                            )}
                                        </div>

                                    </div>

                                    <div class="info-box">

                                        <div class="info-label">
                                            💰 花費
                                        </div>

                                        <div class="info-value">

                                            NT$ ${
                                                Number(
                                                    item.price ||
                                                    0
                                                ).toLocaleString()
                                            }

                                        </div>

                                    </div>

                                    <div class="info-box">

                                        <div class="info-label">
                                            ⏱️ 需要時間
                                        </div>

                                        <div class="info-value">
                                            ${escapeHTML(
                                                item.time ||
                                                "未設定"
                                            )}
                                        </div>

                                    </div>

                                </div>

                                ${
                                    item.platform
                                    ?
                                    `
                                    <div class="itinerary-platform">
                                        訂購平台：
                                        ${escapeHTML(
                                            item.platform
                                        )}
                                    </div>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    item.shopUrl
                                    ?
                                    `
                                    <a
                                        class="itinerary-link"
                                        href="${safeUrl(item.shopUrl)}"
                                        target="_blank"
                                        rel="noopener noreferrer">

                                        🔗 查看店家資訊

                                    </a>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    item.address
                                    ?
                                    `
                                    <div class="itinerary-note">

                                        📍 ${escapeHTML(
                                            item.address
                                        )}

                                    </div>

                                    <a
                                        class="itinerary-link"
                                        href="${getGoogleMapsUrl(
                                            item.title,
                                            item.address
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer">

                                        🗺️ 開啟 Google Maps

                                    </a>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    item.recommendation
                                    ?
                                    `
                                    <div class="recommendation">

                                        <span>
                                            ${escapeHTML(
                                                item.recommendation
                                            )}
                                        </span>

                                    </div>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    item.note
                                    ?
                                    `
                                    <div class="itinerary-note">
                                        ${escapeHTML(
                                            item.note
                                        )}
                                    </div>
                                    `
                                    :
                                    ""
                                }

                                <div class="item-actions">

                                    <button
                                    onclick="editItinerary(
                                        ${day.id},
                                        ${item.id}
                                    )">
                                        編輯
                                    </button>

                                    <button
                                    onclick="deleteItinerary(
                                        ${day.id},
                                        ${item.id}
                                    )">
                                        刪除
                                    </button>

                                </div>

                            </div>

                            `;

                        }
                    ).join("")
                    :
                    `
                    <div class="empty">
                        這天還沒有行程
                    </div>
                    `
                }

                </div>

            </div>

            `;

        }
    ).join("");

}


function openItineraryModal(dayId){

    editingItineraryId =
    null;

    clearItineraryForm();

    document.getElementById(
        "itineraryModalTitle"
    ).textContent =
    "新增行程";

    document.getElementById(
        "itineraryModal"
    ).dataset.dayId =
    dayId;

    document.getElementById(
        "itineraryModal"
    ).classList.add("show");

}


function editItinerary(
    dayId,
    itemId
){

    const trip =
    getCurrentTrip();

    if(!trip) return;

    const day =
    trip.days.find(
        d => d.id === dayId
    );

    if(!day) return;

    const item =
    day.itineraries.find(
        i => i.id === itemId
    );

    if(!item) return;

    editingItineraryId =
    itemId;

    document.getElementById(
        "itineraryModalTitle"
    ).textContent =
    "編輯行程";

    document.getElementById(
        "itineraryTitle"
    ).value =
    item.title || "";

    document.getElementById(
        "itineraryTransport"
    ).value =
    item.transport || "";

    document.getElementById(
        "itineraryPrice"
    ).value =
    item.price || "";

    document.getElementById(
        "itineraryTime"
    ).value =
    item.time || "";

    document.getElementById(
        "itineraryPlatform"
    ).value =
    item.platform || "";


    document.getElementById(
        "itineraryShopUrl"
    ).value =
    item.shopUrl || "";


    document.getElementById(
        "itineraryAddress"
    ).value =
    item.address || "";


    document.getElementById(
        "itineraryNote"
    ).value =
    item.note || "";

    document.querySelectorAll(
        'input[name="itineraryRecommendation"]'
    ).forEach(
        input => {

            input.checked =
            input.value ===
            item.recommendation;

        }
    );

    document.getElementById(
        "itineraryModal"
    ).dataset.dayId =
    dayId;

    document.getElementById(
        "itineraryModal"
    ).classList.add("show");

}


function saveItinerary(){

    const trip =
    getCurrentTrip();

    if(!trip) return;

    const dayId =
    Number(
        document.getElementById(
            "itineraryModal"
        ).dataset.dayId
    );

    const day =
    trip.days.find(
        d => d.id === dayId
    );

    if(!day) return;

    const title =
    document.getElementById(
        "itineraryTitle"
    ).value.trim();

    if(!title){

        alert("請輸入行程名稱");

        return;

    }

    const selectedRecommendation =
    document.querySelector(
        'input[name="itineraryRecommendation"]:checked'
    );

    const data = {

        title:title,

        transport:
        document.getElementById(
            "itineraryTransport"
        ).value.trim(),

        price:
        Number(
            document.getElementById(
                "itineraryPrice"
            ).value
        ) || 0,

        time:
        document.getElementById(
            "itineraryTime"
        ).value.trim(),

        platform:
        document.getElementById(
            "itineraryPlatform"
        ).value.trim(),


        shopUrl:
        document.getElementById(
            "itineraryShopUrl"
        ).value.trim(),


        address:
        document.getElementById(
            "itineraryAddress"
        ).value.trim(),


        recommendation:
        selectedRecommendation
        ?
        selectedRecommendation.value
        :
        "",

        note:
        document.getElementById(
            "itineraryNote"
        ).value.trim()

    };

    if(editingItineraryId){

        const item =
        day.itineraries.find(
            i =>
            i.id ===
            editingItineraryId
        );

        Object.assign(
            item,
            data
        );

        showToast(
            "行程已更新"
        );

    }else{

        day.itineraries.push({

            id:Date.now(),

            ...data

        });

        showToast(
            "行程已新增"
        );

    }

    saveData();

    renderDays();

    updateTotal();

    closeModals();

}


function deleteItinerary(
    dayId,
    itemId
){

    const trip =
    getCurrentTrip();

    if(!trip) return;

    const day =
    trip.days.find(
        d =>
        d.id === dayId
    );

    if(!day) return;

    day.itineraries =
    day.itineraries.filter(
        item =>
        item.id !== itemId
    );

    saveData();

    renderDays();

    updateTotal();

    showToast(
        "行程已刪除"
    );

}


function clearItineraryForm(){

    document.getElementById(
        "itineraryTitle"
    ).value = "";

    document.getElementById(
        "itineraryTransport"
    ).value = "";

    document.getElementById(
        "itineraryPrice"
    ).value = "";

function calculateNights(
    start,
    end
){

    if(!start || !end)
        return 1;

    const a =
    new Date(start);

    const b =
    new Date(end);

    const diff =
    Math.ceil(
        (b-a) /
        (1000*60*60*24)
    );

    return diff > 0
    ? diff
    : 1;

}

function getTripTotal(trip){

    let total = 0;

    trip.days.forEach(
        day => {

            day.itineraries.forEach(
                item => {

                    total +=
                    Number(
                        item.price || 0
                    );

                }
            );

        }
    );

    trip.bookings.forEach(
        item => {

            total +=
            Number(
                item.price || 0
            );

        }
    );

    trip.stays.forEach(
        item => {

            const nights =
            calculateNights(
                item.checkIn,
                item.checkOut
            );

            total +=
            Number(
                item.price || 0
            ) * nights;

        }
    );

    return total;

}


function updateTotal(){

    const trip =
    getCurrentTrip();

    if(!trip) return;

    const total =
    getTripTotal(trip);

    document.getElementById(
        "totalValue"

    "NT$ " +
    total.toLocaleString();

}
