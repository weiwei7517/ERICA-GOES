<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERICA GOES｜躺平也能玩，小資也能飛</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f4f1;
    color:#292929;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Noto Sans TC",Arial,sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    background:#f5f4f1;
    padding:25px 18px 17px;
    position:sticky;
    top:0;
    z-index:30;
    border-bottom:1px solid #deddd9;
}

.brand{
    max-width:760px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
}

.logo{
    font-size:29px;
    font-weight:900;
    letter-spacing:2px;
}

.tagline{
    color:#777;
    font-size:12px;
    margin-top:5px;
    letter-spacing:1px;
}

.add-main{
    border:0;
    background:#292929;
    color:#fff;
    border-radius:30px;
    padding:10px 15px;
    font-size:13px;
    font-weight:700;
}

.container{
    max-width:760px;
    margin:auto;
    padding:22px 16px 90px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.hero{
    padding:12px 2px 25px;
}

.hero h1{
    font-size:30px;
    margin:0 0 8px;
    letter-spacing:-1px;
}

.hero p{
    margin:0;
    color:#777;
    line-height:1.7;
    font-size:14px;
}

.trip-list{
    display:grid;
    gap:14px;
}

.trip-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:20px;
    padding:18px;
}

.trip-country{
    color:#888;
    font-size:12px;
    margin-bottom:5px;
}

.trip-name{
    font-size:22px;
    font-weight:800;
}

.trip-date{
    color:#888;
    font-size:13px;
    margin-top:6px;
}

.trip-note{
    background:#f5f4f1;
    border-radius:10px;
    padding:10px;
    margin-top:11px;
    color:#666;
    font-size:12px;
    line-height:1.6;
}

.trip-total{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #eee;
    margin-top:16px;
    padding-top:14px;
}

.trip-total span{
    color:#888;
    font-size:12px;
}

.trip-total strong{
    font-size:20px;
}

.trip-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
    flex-wrap:wrap;
}

.btn{
    border:1px solid #ddd;
    background:#fff;
    border-radius:10px;
    padding:9px 12px;
    font-size:12px;
}

.btn.dark{
    background:#292929;
    color:#fff;
    border-color:#292929;
}

.empty{
    text-align:center;
    color:#888;
    padding:60px 20px;
}

.empty-icon{
    font-size:38px;
    margin-bottom:10px;
}

/* 詳細頁 */

.back{
    border:0;
    background:none;
    color:#666;
    padding:0;
    margin-bottom:18px;
}

.trip-header{
    margin-bottom:25px;
}

.trip-header h2{
    margin:0;
    font-size:29px;
}

.trip-header p{
    margin:7px 0 0;
    color:#888;
    font-size:13px;
}

.detail-note{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:15px;
    padding:12px 14px;
    margin-top:12px;
    color:#666;
    font-size:12px;
    line-height:1.7;
}

/* 總覽 */

.summary{
    background:#292929;
    color:#fff;
    border-radius:20px;
    padding:18px;
    margin-bottom:25px;
}

.summary-title{
    font-size:12px;
    opacity:.65;
}

.summary-price{
    font-size:29px;
    font-weight:800;
    margin-top:5px;
}

.summary-note{
    font-size:12px;
    opacity:.65;
    margin-top:5px;
}

/* Day */

.day-section{
    margin-bottom:25px;
}

.day-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:11px;
}

.day-title{
    font-size:20px;
    font-weight:900;
}

.day-add{
    border:0;
    background:#292929;
    color:#fff;
    border-radius:20px;
    padding:8px 12px;
    font-size:11px;
}

.itinerary-list{
    display:grid;
    gap:9px;
}

.itinerary-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:17px;
    padding:15px;
}

.itinerary-number{
    color:#999;
    font-size:11px;
    margin-bottom:4px;
}

.itinerary-title{
    font-size:17px;
    font-weight:800;
}

.itinerary-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.info-box{
    background:#f5f4f1;
    border-radius:10px;
    padding:9px;
}

.info-label{
    color:#999;
    font-size:10px;
}

.info-value{
    font-size:13px;
    font-weight:600;
    margin-top:3px;
}

.itinerary-platform{
    margin-top:9px;
    font-size:12px;
    color:#777;
}

.itinerary-note{
    margin-top:9px;
    font-size:12px;
    color:#777;
    line-height:1.6;
}

.recommend-display{
    display:inline-flex;
    align-items:center;
    margin-top:10px;
    padding:6px 10px;
    border-radius:20px;
    background:#f5f4f1;
    color:#555;
    font-size:11px;
    font-weight:700;
}

.card-actions{
    display:flex;
    gap:6px;
    margin-top:11px;
}

.card-actions button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:6px 9px;
    font-size:10px;
}

/* 評價選擇 */

.recommend-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.recommend-option{
    position:relative;
}

.recommend-option input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.recommend-option label{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:45px;
    border:1px solid #ddd;
    border-radius:11px;
    background:#fafafa;
    color:#666;
    font-size:12px;
    cursor:pointer;
    transition:.15s;
}

.recommend-option input:checked + label{
    background:#292929;
    color:#fff;
    border-color:#292929;
    font-weight:700;
}

.recommend-option label::before{
    content:"○";
    margin-right:5px;
    font-size:14px;
}

.recommend-option input:checked + label::before{
    content:"✓";
}

/* 新增 Day */

.add-day{
    width:100%;
    border:1px dashed #bbb;
    background:transparent;
    border-radius:15px;
    padding:14px;
    color:#666;
    margin-bottom:30px;
}

/* 照片 */

.section{
    margin-top:30px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.section-header h3{
    margin:0;
    font-size:19px;
}

.section-header button{
    border:0;
    background:#292929;
    color:#fff;
    border-radius:20px;
    padding:8px 12px;
    font-size:11px;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.photo-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:15px;
    overflow:hidden;
}

.photo{
    width:100%;
    aspect-ratio:1/1;
    background:#e9e8e4;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.photo-info{
    padding:11px;
}

.photo-place{
    font-size:14px;
    font-weight:800;
}

.photo-note{
    color:#777;
    font-size:11px;
    line-height:1.5;
    margin-top:4px;
}

.photo-actions{
    display:flex;
    gap:5px;
    margin-top:8px;
}

.photo-actions button{
    flex:1;
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:6px;
    font-size:10px;
}

/* 預訂資訊 */

.booking-list{
    display:grid;
    gap:9px;
}

.booking-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:15px;
    padding:14px;
}

.booking-type{
    color:#888;
    font-size:11px;
}

.booking-title{
    font-size:16px;
    font-weight:800;
    margin-top:3px;
}

.booking-detail{
    color:#777;
    font-size:12px;
    line-height:1.7;
    margin-top:7px;
}

/* 推薦合作 */

.partner-list{
    display:grid;
    gap:9px;
}

.partner-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:15px;
    padding:14px;
}

.partner-type{
    color:#888;
    font-size:11px;
}

.partner-title{
    font-size:16px;
    font-weight:800;
    margin-top:3px;
}

.partner-description{
    color:#777;
    font-size:12px;
    line-height:1.6;
    margin-top:6px;
}

.partner-link{
    display:inline-block;
    margin-top:9px;
    color:#292929;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
}

.partner-actions{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.partner-actions button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:6px 9px;
    font-size:10px;
}

/* Modal */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:760px;
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:25px 25px 0 0;
    padding:22px 18px 30px;
}

.modal h2{
    margin:0 0 18px;
    font-size:21px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    color:#777;
    font-size:11px;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:10px;
    padding:10px;
    outline:none;
}

.form-group textarea{
    min-height:75px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.modal-buttons button{
    flex:1;
    border:0;
    border-radius:11px;
    padding:12px;
}

.cancel{
    background:#eee;
}

.save{
    background:#292929;
    color:#fff;
}

/* Toast */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#292929;
    color:#fff;
    padding:10px 16px;
    border-radius:30px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(min-width:650px){

    .photo-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:560px){

    .form-row{
        grid-template-columns:1fr;
    }

    .recommend-options{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <div>
            <div class="logo">ERICA GOES</div>

            <div class="tagline">
                躺平也能玩，小資也能飛。
            </div>
        </div>

        <button class="add-main" onclick="openTripModal()">
            ＋ 新增旅行
        </button>

    </div>

</header>

<main class="container">

<!-- =========================
     首頁
========================= -->

<section id="homePage" class="page active">

    <div class="hero">

        <h1>去哪裡玩？</h1>

        <p>
            行程、交通、花費、照片、預訂資訊<br>
            全部放在同一趟旅行裡。
        </p>

    </div>

    <div id="tripList" class="trip-list"></div>

    <!-- 推薦／合作 -->

    <div class="section">

        <div class="section-header">

            <h3>🤝 推薦／合作</h3>

            <button onclick="openPartnerModal()">
                ＋ 新增
            </button>

        </div>

        <div id="partnerList" class="partner-list"></div>

    </div>

</section>

<!-- =========================
     旅行詳細頁
========================= -->

<section id="tripPage" class="page">

    <button class="back" onclick="goHome()">
        ← 我的旅行
    </button>

    <div class="trip-header">

        <h2 id="detailTripName"></h2>

        <p id="detailTripInfo"></p>

        <div id="detailTripNote"></div>

    </div>

    <div class="summary">

        <div class="summary-title">
            目前這趟旅行花費
        </div>

        <div class="summary-price" id="detailTotal">
            NT$ 0
        </div>

        <div class="summary-note">
            行程與旅遊資訊會自動累計
        </div>

    </div>

    <!-- Day 行程 -->

    <div id="dayList"></div>

    <button class="add-day" onclick="addDay()">
        ＋ 新增 DAY
    </button>

    <!-- 照片 -->

    <div class="section">

        <div class="section-header">

            <h3>📷 旅行照片</h3>

            <button onclick="openPhotoModal()">
                ＋ 新增照片
            </button>

        </div>

        <div id="photoGrid" class="photo-grid"></div>

    </div>

    <!-- 旅遊資訊 -->

    <div class="section">

        <div class="section-header">

            <h3>✈️ 旅遊資訊</h3>

            <button onclick="openBookingModal()">
                ＋ 新增
            </button>

        </div>

        <div id="bookingList" class="booking-list"></div>

    </div>

</section>

</main>

<!-- =========================
     新增旅行
========================= -->

<div class="modal-bg" id="tripModal">

<div class="modal">

<h2 id="tripModalTitle">
新增旅行
</h2>

<div class="form-group">
<label>國家 / 地區</label>
<input id="tripCountry" placeholder="例如：日本 🇯🇵">
</div>

<div class="form-group">
<label>旅行名稱</label>
<input id="tripName" placeholder="例如：大阪京都 5日">
</div>

<div class="form-row">

<div class="form-group">
<label>開始日期</label>
<input id="tripStart" type="date">
</div>

<div class="form-group">
<label>結束日期</label>
<input id="tripEnd" type="date">
</div>

</div>

<div class="form-group">
<label>旅遊預算（台幣）</label>
<input id="tripBudget" type="number" placeholder="例如：20000">
</div>

<div class="form-group">
<label>旅行備注</label>
<textarea id="tripNote"
placeholder="例如：這次主打小資旅行"></textarea>
</div>

<div class="modal-buttons">

<button class="cancel" onclick="closeModals()">
取消
</button>

<button class="save" onclick="saveTrip()">
儲存
</button>

</div>

</div>
</div>

<!-- =========================
     新增行程
========================= -->

<div class="modal-bg" id="itineraryModal">

<div class="modal">

<h2 id="itineraryModalTitle">
新增行程
</h2>

<div class="form-group">

<label>行程名稱</label>

<input id="itineraryTitle"
placeholder="例如：關西機場 → 難波">

</div>

<div class="form-row">

<div class="form-group">

<label>交通工具</label>

<input id="itineraryTransport"
placeholder="地鐵 / JR / 巴士 / 步行">

</div>

<div class="form-group">

<label>價格（台幣）</label>

<input id="itineraryPrice"
type="number"
placeholder="0">

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>需要時間</label>

<input id="itineraryTime"
placeholder="例如：45 分鐘">

</div>

<div class="form-group">

<label>訂購平台</label>

<input id="itineraryPlatform"
placeholder="Klook / 官網 / 現場">

</div>

</div>

<div class="form-group">

<label>出發時間</label>

<input id="itineraryStartTime"
type="time">

</div>

<div class="form-group">

<label>推薦程度</label>

<div class="recommend-options">

    <div class="recommend-option">

        <input
            type="radio"
            name="itineraryRecommendation"
            id="recommendWorth"
            value="worth">

        <label for="recommendWorth">
            👍🏻 值得
        </label>

    </div>

    <div class="recommend-option">

        <input
            type="radio"
            name="itineraryRecommendation"
            id="recommendNormal"
            value="normal">

        <label for="recommendNormal">
            👌 普通
        </label>

    </div>

    <div class="recommend-option">

        <input
            type="radio"
            name="itineraryRecommendation"
            id="recommendSkip"
            value="skip">

        <label for="recommendSkip">
            👎🏻 不用去
        </label>

    </div>

</div>

</div>

<div class="form-group">

<label>備注</label>

<textarea id="itineraryNote"
placeholder="例如：建議先買票、要注意末班車"></textarea>

</div>

<div class="modal-buttons">

<button class="cancel" onclick="closeModals()">
取消
</button>

<button class="save" onclick="saveItinerary()">
儲存行程
</button>

</div>

</div>
</div>

<!-- =========================
     新增照片
========================= -->

<div class="modal-bg" id="photoModal">

<div class="modal">

<h2>
新增照片
</h2>

<div class="form-group">

<label>照片</label>

<input
id="photoFile"
type="file"
accept="image/*"
>

</div>

<div class="form-group">

<label>照片地點</label>

<input id="photoPlace"
placeholder="例如：道頓堀">

</div>

<div class="form-group">

<label>備注</label>

<textarea id="photoNote"
placeholder="這張照片想記錄什麼？"></textarea>

</div>

<div class="modal-buttons">

<button class="cancel" onclick="closeModals()">
取消
</button>

<button class="save" onclick="savePhoto()">
新增照片
</button>

</div>

</div>
</div>

<!-- =========================
     旅遊資訊
========================= -->

<div class="modal-bg" id="bookingModal">

<div class="modal">

<h2>
新增旅遊資訊
</h2>

<div class="form-group">

<label>類型</label>

<select id="bookingType">

<option>✈️ 機票</option>
<option>🏨 住宿</option>
<option>🚐 包車</option>
<option>📱 網卡 / eSIM</option>
<option>🎟️ 門票</option>
<option>🚆 車票</option>
<option>🍽️ 餐廳</option>
<option>🛍️ 其他</option>

</select>

</div>

<div class="form-group">

<label>名稱</label>

<input id="bookingTitle"
placeholder="例如：台北 → 大阪">

</div>

<div class="form-group">

<label>訂購平台</label>

<input id="bookingPlatform"
placeholder="例如：Klook / Agoda / 官網">

</div>

<div class="form-group">

<label>價格（台幣）</label>

<input id="bookingPrice"
type="number"
placeholder="0">

</div>

<div class="form-group">

<label>備注</label>

<textarea id="bookingNote"
placeholder="訂單編號、時間、注意事項等等"></textarea>

</div>

<div class="modal-buttons">

<button class="cancel" onclick="closeModals()">
取消
</button>

<button class="save" onclick="saveBooking()">
新增
</button>

</div>

</div>
</div>

<!-- =========================
     推薦合作
========================= -->

<div class="modal-bg" id="partnerModal">

<div class="modal">

<h2 id="partnerModalTitle">
新增推薦／合作
</h2>

<div class="form-group">

<label>分類</label>

<select id="partnerCategory">

<option>📱 eSIM 網路</option>
<option>🏨 住宿</option>
<option>✈️ 機票</option>
<option>🎟️ 景點／票券</option>
<option>🚆 交通</option>
<option>🍽️ 餐廳</option>
<option>🛍️ 購物</option>
<option>💰 優惠碼</option>
<option>🔗 其他</option>

</select>

</div>

placeholder="例如：日本 eSIM 推薦">

</div>

<label>介紹</label>

<textarea id="partnerDescription"
placeholder="例如：日本旅遊上網推薦、輸入優惠碼可享折扣"></textarea>

</div>

<label>連結網址</label>

<input id="partnerUrl"
type="url"
placeholder="https://...">

</div>

取消
</button>

<button class="save" onclick="savePartner()">
儲存
</button>

</div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>

let trips =
JSON.parse(
localStorage.getItem("ERICA_GOES_TRIPS") || "[]"
);

let partners =
JSON.parse(
localStorage.getItem("ERICA_GOES_PARTNERS") || "[]"
);

let currentTripId = null;

let editingTripId = null;

let editingItineraryId = null;

let editingPartnerId = null;

/* =========================
   儲存
========================= */

function saveData(){

    localStorage.setItem(
        "ERICA_GOES_TRIPS",
        JSON.stringify(trips)
    );

    localStorage.setItem(
        "ERICA_GOES_PARTNERS",
        JSON.stringify(partners)
    );

}

/* =========================
   首頁
========================= */

function renderTrips(){

    const list =
    document.getElementById("tripList");

    if(!trips.length){

        list.innerHTML = `
        <div class="empty">

            <div class="empty-icon">🛋️</div>

            <div>
                還沒有旅行
            </div>

            <div style="font-size:12px;margin-top:6px;">
                開始新增你的第一趟小資旅行吧。
            </div>

        </div>
        `;

    }else{

        list.innerHTML = trips.map(trip => {

            const total =
            getTripTotal(trip);

            return `

            <div class="trip-card">

                <div class="trip-country">
                    ${escapeHTML(trip.country || "")}
                </div>

                <div class="trip-name">
                    ${escapeHTML(trip.name || "未命名旅行")}
                </div>

                <div class="trip-date">
                    ${trip.start || "未設定"}
                    ${trip.end ? " — " + trip.end : ""}
                </div>

                ${
                    trip.note
                    ?
                    `
                    <div class="trip-note">
                        📝 ${escapeHTML(trip.note)}
                    </div>
                    `
                    :
                    ""
                }

                <div class="trip-total">

                    <span>
                        目前花費
                    </span>

                    <strong>
                        NT$ ${total.toLocaleString()}
                    </strong>

                </div>

                <div class="trip-actions">

                    <button
                        class="btn dark"
                        onclick="openTrip(${trip.id})">
                        查看旅行
                    </button>

                    <button
                        class="btn"
                        onclick="editTrip(${trip.id})">
                        編輯
                    </button>

                    <button
                        class="btn"
                        onclick="deleteTrip(${trip.id})">
                        刪除
                    </button>

                </div>

            </div>

            `;

        }).join("");

    }

    renderPartners();

}

/* =========================
   推薦／合作
========================= */

function renderPartners(){

    const list =
    document.getElementById("partnerList");

    if(!partners.length){

        list.innerHTML = `
            <div class="empty"
                 style="padding:35px;">
                🤝 還沒有推薦或合作內容
                <div style="font-size:11px;margin-top:5px;">
                    可以新增 eSIM、住宿、票券、優惠碼等等。
                </div>
            </div>
        `;

        return;
    }

    list.innerHTML =
    partners.map(item => {

        return `

        <div class="partner-card">

            <div class="partner-type">
                ${escapeHTML(item.category || "🔗 其他")}
            </div>

            <div class="partner-title">
                ${escapeHTML(item.name || "")}
            </div>

            ${
                item.description
                ?
                `
                <div class="partner-description">
                    ${escapeHTML(item.description)}
                </div>
                `
                :
                ""
            }

            ${
                item.url
                ?
                `
                <a
                    class="partner-link"
                    href="${safeUrl(item.url)}"
                    target="_blank"
                    rel="noopener noreferrer">
                    🔗 前往查看
                </a>
                `
                :
                ""
            }

            <div class="partner-actions">

                <button
                    onclick="editPartner(${item.id})">
                    編輯
                </button>

                <button
                    onclick="deletePartner(${item.id})">
                    刪除
                </button>

            </div>

        </div>

        `;

    }).join("");

}

function openPartnerModal(){

    editingPartnerId = null;

    document.getElementById(
        "partnerModalTitle"
    ).textContent = "新增推薦／合作";

    document.getElementById(
        "partnerCategory"
    ).value = "📱 eSIM 網路";

    document.getElementById(
        "partnerName"
    ).value = "";

    document.getElementById(
        "partnerDescription"
    ).value = "";

    document.getElementById(
        "partnerUrl"
    ).value = "";

    document.getElementById(
        "partnerModal"
    ).classList.add("show");

}

function editPartner(id){

    const item =
    partners.find(p => p.id === id);

    if(!item) return;

    editingPartnerId = id;

    document.getElementById(
        "partnerModalTitle"
    ).textContent = "編輯推薦／合作";

    document.getElementById(
        "partnerCategory"
    ).value =
    item.category || "🔗 其他";

    document.getElementById(
        "partnerName"
    ).value =
    item.name || "";

    document.getElementById(
        "partnerDescription"
    ).value =
    item.description || "";

    document.getElementById(
        "partnerUrl"
    ).value =
    item.url || "";

    document.getElementById(
        "partnerModal"
    ).classList.add("show");

}

function savePartner(){

    const name =
    document.getElementById(
        "partnerName"
    ).value.trim();

    if(!name){

        alert("請輸入名稱");

        return;

    }

    const data = {

        category:
        document.getElementById(
            "partnerCategory"
        ).value,

        name:name,

        description:
        document.getElementById(
            "partnerDescription"
        ).value.trim(),

        url:
        document.getElementById(
            "partnerUrl"
        ).value.trim()

    };

    if(editingPartnerId){

        const item =
        partners.find(
            p => p.id === editingPartnerId
        );

        Object.assign(item,data);

        showToast("推薦／合作已更新");

    }else{

        partners.push({

            id:Date.now(),

            ...data

        });

        showToast("推薦／合作已新增");

    }

    saveData();

    renderPartners();

    closeModals();

}

function deletePartner(id){

    if(!confirm("確定刪除這個推薦／合作內容嗎？"))
        return;

    partners =
    partners.filter(
        p => p.id !== id
    );

    saveData();

    renderPartners();

    showToast("已刪除");

}

/* =========================
   新增 / 編輯旅行
========================= */

function openTripModal(){

    editingTripId = null;

    clearTripForm();

    document.getElementById(
        "tripModalTitle"
    ).textContent = "新增旅行";

    document.getElementById(
        "tripModal"
    ).classList.add("show");

}

function editTrip(id){

    const trip =
    trips.find(t => t.id === id);

    if(!trip) return;

    editingTripId = id;

    document.getElementById(
        "tripModalTitle"
    ).textContent = "編輯旅行";

    document.getElementById("tripCountry").value =
        trip.country || "";

    document.getElementById("tripName").value =
        trip.name || "";

    document.getElementById("tripStart").value =
        trip.start || "";

    document.getElementById("tripEnd").value =
        trip.end || "";

    document.getElementById("tripBudget").value =
        trip.budget || "";

    document.getElementById("tripNote").value =
        trip.note || "";

    document.getElementById(
        "tripModal"
    ).classList.add("show");

}

function saveTrip(){

    const name =
    document.getElementById("tripName")
    .value.trim();

    if(!name){

        alert("請輸入旅行名稱");

        return;
    }

    if(editingTripId){

        const trip =
        trips.find(t => t.id === editingTripId);

        trip.country =
        document.getElementById("tripCountry").value.trim();

        trip.name = name;

        trip.start =
        document.getElementById("tripStart").value;

        trip.end =
        document.getElementById("tripEnd").value;

        trip.budget =
        Number(
            document.getElementById("tripBudget").value
        ) || 0;

        trip.note =
        document.getElementById("tripNote").value.trim();

        showToast("旅行已更新");

    }else{

        trips.push({

            id:Date.now(),

            country:
            document.getElementById("tripCountry").value.trim(),

            name:name,

            start:
            document.getElementById("tripStart").value,

            end:
            document.getElementById("tripEnd").value,

            budget:
            Number(
                document.getElementById("tripBudget").value
            ) || 0,

            note:
            document.getElementById("tripNote").value.trim(),

            days:[
                {
                    id:Date.now()+1,
                    day:1,
                    itineraries:[]
                }
            ],

            photos:[],

            bookings:[]

        });

        showToast("旅行已新增");

    }

    saveData();

    renderTrips();

    closeModals();

}

function deleteTrip(id){

    if(!confirm("確定要刪除這趟旅行嗎？")) return;

    trips =
    trips.filter(t => t.id !== id);

    saveData();

    renderTrips();

    showToast("已刪除");

}

function clearTripForm(){

    document.getElementById("tripCountry").value = "";

    document.getElementById("tripName").value = "";

    document.getElementById("tripStart").value = "";

    document.getElementById("tripEnd").value = "";

    document.getElementById("tripBudget").value = "";

    document.getElementById("tripNote").value = "";

}

/* =========================
   進入旅行
========================= */

function openTrip(id){

    currentTripId = id;

    const trip =
    trips.find(t => t.id === id);

    if(!trip) return;

    /* 舊資料兼容 */

    if(!trip.days){

        trip.days = [
            {
                id:Date.now(),
                day:1,
                itineraries:[]
            }
        ];

    }

    if(!trip.photos)
        trip.photos = [];

    if(!trip.bookings)
        trip.bookings = [];

    document.getElementById(
        "homePage"
    ).classList.remove("active");

    document.getElementById(
        "tripPage"
    ).classList.add("active");

    document.getElementById(
        "detailTripName"
    ).textContent = trip.name;

    document.getElementById(
        "detailTripInfo"
    ).textContent =
    `${trip.country || ""} ${trip.start || ""} ${
        trip.end ? "— " + trip.end : ""
    }`;

    document.getElementById(
        "detailTripNote"
    ).innerHTML =
    trip.note
    ?
    `
    <div class="detail-note">
        📝 ${escapeHTML(trip.note)}
    </div>
    `
    :
    "";

    renderDays();

    renderPhotos();

    renderBookings();

    updateTotal();

    saveData();

    window.scrollTo(0,0);

}

function goHome(){

    document.getElementById(
        "tripPage"
    ).classList.remove("active");

    document.getElementById(
        "homePage"
    ).classList.add("active");

    renderTrips();

    window.scrollTo(0,0);

}

/* =========================
   DAY
========================= */

function renderDays(){

    const trip =
    trips.find(t => t.id === currentTripId);

    const container =
    document.getElementById("dayList");

    if(!trip.days.length){

        container.innerHTML = "";

        return;
    }

    container.innerHTML =
    trip.days.map(day => {

        return `

        <div class="day-section">

            <div class="day-header">

                <div class="day-title">
                    DAY ${day.day}
                </div>

                <button
                    class="day-add"
                    onclick="openItineraryModal(${day.id})">
                    ＋ 新增行程
                </button>

            </div>

            <div class="itinerary-list">

                ${
                    day.itineraries.length

                    ?

                    day.itineraries.map(
                        (item,index) => {

                        const recommendation =
                        getRecommendationText(
                            item.recommendation
                        );

                        return `

                        <div class="itinerary-card">

                            <div class="itinerary-number">
                                第 ${index+1} 站
                            </div>

                            <div class="itinerary-title">
                                ${escapeHTML(
                                    item.title ||
                                    "未命名行程"
                                )}
                            </div>

                            <div class="itinerary-info">

                                <div class="info-box">

                                    <div class="info-label">
                                        🚆 交通
                                    </div>

                                    <div class="info-value">
                                        ${escapeHTML(
                                            item.transport ||
                                            "未設定"
                                        )}
                                    </div>

                                </div>

                                <div class="info-box">

                                    <div class="info-label">
                                        💰 價格
                                    </div>

                                    <div class="info-value">
                                        NT$ ${
                                            Number(
                                                item.price || 0
                                            ).toLocaleString()
                                        }
                                    </div>

                                </div>

                                <div class="info-box">

                                    <div class="info-label">
                                        ⏱️ 需要時間
                                    </div>

                                    <div class="info-value">
                                        ${escapeHTML(
                                            item.time ||
                                            "未設定"
                                        )}
                                    </div>

                                </div>

                                <div class="info-box">

                                    <div class="info-label">
                                        🕐 出發時間
                                    </div>

                                    <div class="info-value">
                                        ${
                                            item.startTime ||
                                            "未設定"
                                        }
                                    </div>

                                </div>

                            </div>

                            ${
                                recommendation
                                ?
                                `
                                <div class="recommend-display">
                                    ${recommendation}
                                </div>
                                `
                                :
                                ""
                            }

                            ${
                                item.platform

                                ?

                                `<div class="itinerary-platform">
                                    🛒 訂購平台：
                                    ${escapeHTML(item.platform)}
                                </div>`

                                :

                                ""
                            }

                            ${
                                item.note

                                ?

                                `<div class="itinerary-note">
                                    📝 ${escapeHTML(item.note)}
                                </div>`

                                :

                                ""
                            }

                            <div class="card-actions">

                                <button
                                    onclick="editItinerary(
                                        ${day.id},
                                        ${item.id}
                                    )">
                                    編輯
                                </button>

                                <button
                                    onclick="deleteItinerary(
                                        ${day.id},
                                        ${item.id}
                                    )">
                                    刪除
                                </button>

                            </div>

                        </div>

                        `;

                    }).join("")

                    :

                    `
                    <div style="
                        background:#fff;

                        padding:20px;
                        text-align:center;
                        color:#aaa;
                        font-size:12px;
                    ">
                        還沒有行程<br>
                        按「＋ 新增行程」開始安排
                    </div>
                    `
                }

            </div>

        </div>

        `;

    }).join("");

}

function addDay(){

    const trip =
    trips.find(t => t.id === currentTripId);

    if(!trip) return;

    const nextDay =
    trip.days.length
    ?
    Math.max(...trip.days.map(d => d.day)) + 1
    :
    1;

    trip.days.push({

        id:Date.now(),

        day:nextDay,

        itineraries:[]

    });

    saveData();

    renderDays();

    showToast(`DAY ${nextDay} 已新增`);

}

/* =========================
   新增行程
========================= */

function openItineraryModal(dayId){

    editingItineraryId = null;

    document.getElementById(
        "itineraryModalTitle"
    ).textContent = "新增行程";

    clearItineraryForm();

    document.getElementById(
        "itineraryModal"
    ).dataset.dayId = dayId;

    document.getElementById(
        "itineraryModal"
    ).classList.add("show");

}

function editItinerary(dayId,itemId){

    const trip =
    trips.find(t => t.id === currentTripId);

    const day =
    trip.days.find(d => d.id === dayId);

    const item =
    day.itineraries.find(i => i.id === itemId);

    if(!item) return;

    editingItineraryId = itemId;

    document.getElementById(
        "itineraryModalTitle"
    ).textContent = "編輯行程";

    document.getElementById(
        "itineraryTitle"
    ).value = item.title || "";

    document.getElementById(
        "itineraryTransport"
    ).value = item.transport || "";

    document.getElementById(
        "itineraryPrice"
    ).value = item.price || "";

    document.getElementById(
        "itineraryTime"
    ).value = item.time || "";

    document.getElementById(
        "itineraryPlatform"
    ).value = item.platform || "";

    document.getElementById(
        "itineraryStartTime"
    ).value = item.startTime || "";

    document.getElementById(
        "itineraryNote"
    ).value = item.note || "";

    document.querySelectorAll(
        'input[name="itineraryRecommendation"]'
    ).forEach(input => {

        input.checked =
        input.value === item.recommendation;

    });

    document.getElementById(
        "itineraryModal"
    ).dataset.dayId = dayId;

    document.getElementById(
        "itineraryModal"
    ).classList.add("show");

}

function saveItinerary(){

    const trip =
    trips.find(t => t.id === currentTripId);

    const dayId =
    Number(
        document.getElementById(
            "itineraryModal"
        ).dataset.dayId
    );

    const day =
    trip.days.find(d => d.id === dayId);

    const title =
    document.getElementById(
        "itineraryTitle"
    ).value.trim();

    if(!title){

        alert("請輸入行程名稱");

        return;

    }

    const selectedRecommendation =
    document.querySelector(
        'input[name="itineraryRecommendation"]:checked'
    );

    const data = {

        title:title,

        transport:
        document.getElementById(
            "itineraryTransport"
        ).value.trim(),

        price:
        Number(
            document.getElementById(
                "itineraryPrice"
            ).value
        ) || 0,

        time:
        document.getElementById(
            "itineraryTime"
        ).value.trim(),

        platform:
        document.getElementById(
            "itineraryPlatform"
        ).value.trim(),

        startTime:
        document.getElementById(
            "itineraryStartTime"
        ).value,

        recommendation:
        selectedRecommendation
        ?
        selectedRecommendation.value
        :
        "",

        note:
        document.getElementById(
            "itineraryNote"
        ).value.trim()

    };

    if(editingItineraryId){

        const item =
        day.itineraries.find(
            i => i.id === editingItineraryId
        );

        Object.assign(item,data);

        showToast("行程已更新");

    }else{

        day.itineraries.push({

            id:Date.now(),

            ...data

        });

        showToast("行程已新增");

    }

    saveData();

    renderDays();

    updateTotal();

    closeModals();

}

function deleteItinerary(dayId,itemId){

    const trip =
    trips.find(t => t.id === currentTripId);

    const day =
    trip.days.find(d => d.id === dayId);

    if(!confirm("確定刪除這個行程？"))
        return;

    day.itineraries =
    day.itineraries.filter(
        i => i.id !== itemId
    );

    saveData();

    renderDays();

    updateTotal();

    showToast("行程已刪除");

}

function clearItineraryForm(){

    document.getElementById(
        "itineraryTitle"
    ).value = "";

    document.getElementById(
        "itineraryTransport"
    ).value = "";

    document.getElementById(
        "itineraryPrice"
    ).value = "";

    document.getElementById(
        "itineraryTime"
    ).value = "";

    document.getElementById(
        "itineraryPlatform"
    ).value = "";

    document.getElementById(
        "itineraryStartTime"
    ).value = "";

    document.getElementById(
        "itineraryNote"
    ).value = "";

    document.querySelectorAll(
        'input[name="itineraryRecommendation"]'
    ).forEach(input => {

        input.checked = false;

    });

}

/* =========================
   評價文字
========================= */

function getRecommendationText(value){

    if(value === "worth")
        return "👍🏻 值得";

    if(value === "normal")
        return "👌 普通";

    if(value === "skip")
        return "👎🏻 不用去";

    return "";

}

/* =========================
   照片
========================= */

function openPhotoModal(){

    document.getElementById(
        "photoFile"
    ).value = "";

    document.getElementById(
        "photoPlace"
    ).value = "";

    document.getElementById(
        "photoNote"
    ).value = "";

    document.getElementById(
        "photoModal"
    ).classList.add("show");

}

function savePhoto(){

    const file =
    document.getElementById(
        "photoFile"
    ).files[0];

    if(!file){

        alert("請選擇照片");

        return;

    }

    const reader =
    new FileReader();

    reader.onload = function(e){

        const trip =
        trips.find(
            t => t.id === currentTripId
        );

        trip.photos.push({

            id:Date.now(),

            image:e.target.result,

            place:
            document.getElementById(
                "photoPlace"
            ).value.trim(),

            note:
            document.getElementById(
                "photoNote"
            ).value.trim()

        });

        saveData();

        renderPhotos();

        closeModals();

        showToast("照片已新增");

    };

    reader.readAsDataURL(file);

}

function renderPhotos(){

    const trip =
    trips.find(t => t.id === currentTripId);

    const grid =
    document.getElementById(
        "photoGrid"
    );

    if(!trip.photos.length){

        grid.innerHTML = `
            <div class="empty"
                 style="grid-column:1/-1;padding:35px;">
                📷 還沒有旅行照片
            </div>
        `;

        return;

    }

    grid.innerHTML =
    trip.photos.map(photo => {

        return `

        <div class="photo-card">

            <div class="photo">
                <img src="${photo.image}">
            </div>

            <div class="photo-info">

                <div class="photo-place">
                    ${escapeHTML(
                        photo.place ||
                        "未命名地點"
                    )}
                </div>

                ${
                    photo.note

                    ?

                    `<div class="photo-note">
                        ${escapeHTML(photo.note)}
                    </div>`

                    :

                    ""
                }

                <div class="photo-actions">

                    <button
                        onclick="deletePhoto(${photo.id})">
                        刪除
                    </button>

                </div>

            </div>

        </div>

        `;

    }).join("");

}

function deletePhoto(id){

    const trip =
    trips.find(t => t.id === currentTripId);

    if(!confirm("確定刪除這張照片？"))
        return;

    trip.photos =
    trip.photos.filter(
        p => p.id !== id
    );

    saveData();

    renderPhotos();

    showToast("照片已刪除");

}

/* =========================
   旅遊資訊
========================= */

function openBookingModal(){

    document.getElementById(
        "bookingType"
    ).value = "✈️ 機票";

    document.getElementById(
        "bookingTitle"
    ).value = "";

    document.getElementById(
        "bookingPlatform"
    ).value = "";

    document.getElementById(
        "bookingPrice"
    ).value = "";

    document.getElementById(
        "bookingNote"
    ).value = "";

    document.getElementById(
        "bookingModal"
    ).classList.add("show");

}

function saveBooking(){

    const trip =
    trips.find(t => t.id === currentTripId);

    const title =
    document.getElementById(
        "bookingTitle"
    ).value.trim();

    if(!title){

        alert("請輸入名稱");

        return;

    }

    trip.bookings.push({

        id:Date.now(),

        type:
        document.getElementById(
            "bookingType"
        ).value,

        title:title,

        platform:
        document.getElementById(
            "bookingPlatform"
        ).value.trim(),

        price:
        Number(
            document.getElementById(
                "bookingPrice"
            ).value
        ) || 0,

        note:
        document.getElementById(
            "bookingNote"
        ).value.trim()

    });

    saveData();

    renderBookings();

    updateTotal();

    closeModals();

    showToast("資訊已新增");

}

function renderBookings(){

    const trip =
    trips.find(t => t.id === currentTripId);

    const list =
    document.getElementById(
        "bookingList"
    );

    if(!trip.bookings.length){

        list.innerHTML = `
            <div class="empty"
                 style="padding:35px;">
                ✈️ 還沒有旅遊資訊
            </div>
        `;

        return;

    }

    list.innerHTML =
    trip.bookings.map(info => {

        return `

        <div class="booking-card">

            <div class="booking-type">
                ${escapeHTML(info.type)}
            </div>

            <div class="booking-title">
                ${escapeHTML(info.title)}
            </div>

            <div class="booking-detail">

                💰 NT$ ${
                    Number(info.price || 0)
                    .toLocaleString()
                }

                ${
                    info.platform
                    ?
                    `<br>🛒 ${
                        escapeHTML(info.platform)
                    }`
                    :
                    ""
                }

                ${
                    info.note
                    ?
                    `<br>📝 ${
                        escapeHTML(info.note)
                    }`
                    :
                    ""
                }

            </div>

            <div class="card-actions">

                <button
                    onclick="deleteBooking(${info.id})">
                    刪除
                </button>

            </div>

        </div>

        `;

    }).join("");

}

function deleteBooking(id){

    const trip =
    trips.find(t => t.id === currentTripId);

    if(!confirm("確定刪除這筆資訊？"))
        return;

    trip.bookings =
    trip.bookings.filter(
        i => i.id !== id
    );

    saveData();

    renderBookings();

    updateTotal();

    showToast("已刪除");

}

/* =========================
   花費
========================= */

function getTripTotal(trip){

    let total = 0;

    (trip.days || []).forEach(day => {

        (day.itineraries || [])
        .forEach(item => {

            total += Number(
                item.price || 0
            );

        });

    });

    (trip.bookings || [])
    .forEach(item => {

        total += Number(
            item.price || 0
        );

    });

    return total;

}

function updateTotal(){

    const trip =
    trips.find(t => t.id === currentTripId);

    if(!trip) return;

    const total =
    getTripTotal(trip);

    document.getElementById(
        "detailTotal"
    ).textContent =
    `NT$ ${total.toLocaleString()}`;

}

/* =========================
   Modal
========================= */

function closeModals(){

    document.querySelectorAll(
        ".modal-bg"
    ).forEach(el => {

        el.classList.remove("show");

    });

}

/* =========================
   工具
========================= */

function safeUrl(url){

    const value = String(url || "").trim();

    if(
        value.startsWith("https://") ||
        value.startsWith("http://")
    ){
        return escapeHTML(value);
    }

    return "#";

}

function showToast(text){

    const toast =
    document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },1800);

}

function escapeHTML(text){

    return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

/* =========================
   啟動
========================= */

renderTrips();

</script>
