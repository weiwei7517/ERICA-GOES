<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERICA GOES｜登入測試</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f5f4f1;
    color:#292929;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.container{
    width:100%;
    max-width:420px;
}

.logo{
    text-align:center;
    margin-bottom:24px;
}

.logo h1{
    margin:0;
    font-size:28px;
    letter-spacing:1px;
}

.logo p{
    margin:8px 0 0;
    color:#777;
    font-size:14px;
}

.card{
    background:#fff;
    border:1px solid #e5e3df;
    border-radius:22px;
    padding:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

label{
    display:block;
    margin:0 0 8px;
    font-size:14px;
    font-weight:600;
}

input{
    width:100%;
    height:48px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 14px;
    font-size:16px;
    outline:none;
    margin-bottom:18px;
    background:#fafafa;
}

input:focus{
    border-color:#999;
    background:#fff;
}

button{
    width:100%;
    height:50px;
    border:0;
    border-radius:12px;
    background:#292929;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.6;
    word-break:break-word;
}

.message.error{
    display:block;
    background:#fff1f1;
    color:#b42318;
    border:1px solid #f2cccc;
}

.message.success{
    display:block;
    background:#f0f8f2;
    color:#287a42;
    border:1px solid #cde7d3;
}

.debug{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid #eee;
    font-size:12px;
    color:#888;
    line-height:1.7;
    word-break:break-all;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>ERICA GOES</h1>
        <p>躺平也能玩，小資也能飛</p>
    </div>

    <div class="card">

        <label for="email">Email</label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="請輸入 Email"
        >

        <label for="password">密碼</label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="請輸入密碼"
        >

        <button
            id="loginButton"
            onclick="login()"
        >
            登入
        </button>

        <div
            id="message"
            class="message"
        ></div>

        <div
            id="debug"
            class="debug"
        >
            尚未登入
        </div>

    </div>

</div>

<script>

/* =========================================
   Supabase 設定
========================================= */

const SUPABASE_URL =
    "https://vkwriekcbvvvkmsmlbzu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YIXuILncvi7L4It4Mgi99A_neR0cFry";


/* =========================================
   建立 Supabase Client
========================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   顯示訊息
========================================= */

function showMessage(text, type){

    const message =
        document.getElementById("message");

    message.className =
        "message " + type;

    message.innerHTML = text;
}


/* =========================================
   HTML Escape
========================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   登入
========================================= */

async function login(){

    const email =
        document.getElementById("email")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    const button =
        document.getElementById("loginButton");

    const debug =
        document.getElementById("debug");


    if(!email){

        showMessage(
            "請輸入 Email",
            "error"
        );

        return;
    }


    if(!password){

        showMessage(
            "請輸入密碼",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "登入中...";


    showMessage(
        "正在連線到 Supabase...",
        "success"
    );


    debug.innerHTML =
        "正在驗證帳號...";


    try{

        const result =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        const data =
            result.data;

        const error =
            result.error;


        console.log(
            "LOGIN DATA:",
            data
        );

        console.log(
            "LOGIN ERROR:",
            error
        );


        /* ================================
           登入失敗
        ================================= */

        if(error){

            showMessage(
                "❌ 登入失敗<br><br>" +
                "<strong>" +
                escapeHtml(
                    error.message
                ) +
                "</strong>",
                "error"
            );


            debug.innerHTML =
                "錯誤訊息：<br>" +
                escapeHtml(
                    error.message
                ) +
                "<br><br>" +

                "錯誤代碼：<br>" +
                escapeHtml(
                    error.code || "無"
                ) +
                "<br><br>" +

                "HTTP Status：<br>" +
                escapeHtml(
                    error.status || "無"
                );

            return;
        }


        /* ================================
           登入成功
        ================================= */

        if(
            data &&
            data.user &&
            data.session
        ){

            showMessage(
                "🎉 登入成功！<br><br>" +
                "新的 Supabase Auth 已經正常運作。",
                "success"
            );


            debug.innerHTML =
                "<strong>✅ 登入成功</strong><br><br>" +

                "User ID：<br>" +
                escapeHtml(
                    data.user.id
                ) +
                "<br><br>" +

                "Email：<br>" +
                escapeHtml(
                    data.user.email || ""
                ) +
                "<br><br>" +

                "Session：正常";

            return;
        }


        /* ================================
           沒有取得預期資料
        ================================= */

        showMessage(
            "⚠️ Supabase 沒有回傳預期的登入資料。",
            "error"
        );


        debug.innerHTML =
            "沒有取得完整 User / Session。";

    }catch(error){

        console.error(
            "LOGIN EXCEPTION:",
            error
        );


        showMessage(
            "❌ 程式發生錯誤<br><br>" +
            escapeHtml(
                error.message ||
                String(error)
            ),
            "error"
        );


        debug.innerHTML =
            "JavaScript Error：<br>" +
            escapeHtml(
                error.message ||
                String(error)
            );

    }finally{

        button.disabled = false;

        button.textContent =
            "登入";
    }

}


/* =========================================
   檢查目前 Session
========================================= */

async function checkSession(){

    try{

        const result =
            await supabaseClient.auth.getSession();


        const data =
            result.data;

        const error =
            result.error;


        if(error){

            console.error(
                "SESSION ERROR:",
                error
            );

            return;
        }


        if(
            data &&
            data.session &&
            data.session.user
        ){

            showMessage(
                "目前已經是登入狀態。",
                "success"
            );


            document.getElementById(
                "debug"
            ).innerHTML =

                "<strong>目前登入中</strong><br><br>" +

                "User ID：<br>" +

                escapeHtml(
                    data.session.user.id
                ) +

                "<br><br>" +

                "Email：<br>" +

                escapeHtml(
                    data.session.user.email || ""
                );
        }

    }catch(error){

        console.error(
            "SESSION EXCEPTION:",
            error
        );

    }

}


/* =========================================
   Auth 狀態監聽
========================================= */

supabaseClient.auth.onAuthStateChange(
    function(event, session){

        console.log(
            "AUTH EVENT:",
            event
        );

        console.log(
            "AUTH SESSION:",
            session
        );

    }
);


/* =========================================
   啟動
========================================= */

checkSession();

</script>

</body>
</html>
