<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOYA｜走呀</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f4f1;
    color:#292929;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
}

.app{
    max-width:900px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:60px;
}

/* =========================
   HEADER
========================= */

.header{
    padding:28px 20px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:34px;
    font-weight:900;
    letter-spacing:1.5px;
    color:#292929;
    line-height:1;
}

.logo span{
    font-size:30px;
    font-weight:600;
    color:#555;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.user-email{
    font-size:13px;
    color:#777;
}

.btn{
    border:none;
    border-radius:12px;
    padding:10px 15px;
    background:#292929;
    color:white;
}

.btn-light{
    background:#e8e6e1;
    color:#292929;
}

.btn-small{
    padding:7px 10px;
    font-size:13px;
}

.btn-danger{
    background:#eee3e1;
    color:#9a4b43;
}

/* =========================
   LOGIN
========================= */

.login-box{
    max-width:420px;
    margin:100px auto;
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,.06);
}

.login-box h1{
    margin:0 0 8px;
}

.login-box p{
    color:#777;
    margin-bottom:25px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    color:#666;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#999;
    background:white;
}

.login-message{
    margin-top:15px;
    color:#a34e45;
    font-size:14px;
}

/* =========================
   PAGE TITLE
========================= */

.home-intro{
    padding:24px 20px 20px;
}

.title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:15px;
}

.home-title{
    margin:0;
    font-size:24px;
    line-height:1.2;
    letter-spacing:-.3px;
    font-weight:700;
}

.home-subtitle{
    margin:6px 0 0;
    color:#999;
    font-size:12px;
    line-height:1.5;
    letter-spacing:.2px;
}

.edit-intro-btn{
    flex-shrink:0;
    border:1px solid #dedcd7;
    background:rgba(255,255,255,.65);
    border-radius:10px;
    padding:7px 13px;
    color:#555;
    font-size:12px;
    transition:.2s ease;
}

.edit-intro-btn:hover{
    background:#fff;
    border-color:#ccc8c0;
    color:#292929;
}

/* =========================
   SECTION
========================= */

.section{
    padding:10px 20px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:15px;
}

.section-title{
    margin:0;
    font-size:22px;
}

.section-description{
    color:#888;
    font-size:13px;
}

/* =========================
   DESTINATION LIST
========================= */

.destination-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.destination-card{
    background:white;
    border-radius:18px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.035);
}

.destination-main{
    flex:1;
    min-width:0;
    cursor:pointer;
}

.destination-name{
    font-size:19px;
    font-weight:700;
}

.destination-count{
    margin-top:4px;
    color:#999;
    font-size:13px;
}

.destination-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.icon-btn{
    width:auto;
    min-width:34px;
    height:34px;
    padding:0 9px;
    border:1px solid #e1dfda;
    border-radius:9px;
    background:#faf9f6;
    color:#555;
    font-size:13px;
    transition:.2s ease;
}

.icon-btn:hover{
    background:#f0efeb;
    border-color:#d4d1ca;
    color:#292929;
}

.icon-btn:disabled{
    opacity:.3;
    cursor:not-allowed;
}

.text-action{
    width:auto;
    height:34px;
    padding:0 10px;
    border:1px solid #e1dfda;
    border-radius:9px;
    background:#faf9f6;
    color:#555;
    font-size:13px;
    transition:.2s ease;
}

.text-action:hover{
    background:#f0efeb;
    border-color:#d4d1ca;
    color:#292929;
}

.text-action.delete{
    color:#8a625d;
}

.text-action.delete:hover{
    background:#f3e9e6;
    border-color:#e3d2ce;
    color:#8a4e47;
}

.add-destination{
    width:100%;
    border:1px dashed #c8c6c1;
    background:transparent;
    color:#555;
    border-radius:16px;
    padding:15px;
    margin-top:3px;
}

/* =========================
   COOPERATION
========================= */

.cooperation-card{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.035);
}

.cooperation-empty{
    color:#999;
    font-size:14px;
    line-height:1.7;
}

.cooperation-title{
    font-size:18px;
    font-weight:750;
}

.cooperation-description{
    margin-top:6px;
    color:#777;
    font-size:14px;
    line-height:1.7;
}

.cooperation-link{
    display:inline-block;
    margin-top:12px;
    padding:8px 12px;
    background:#f0efeb;
    border-radius:10px;
    text-decoration:none;
    font-size:13px;
}

.cooperation-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

/* =========================
   JOURNEYS
========================= */

.back-btn{
    border:none;
    background:transparent;
    color:#555;
    padding:0;
    margin-bottom:15px;
}

.destination-heading{
    font-size:32px;
    margin:0;
}

.journey-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.journey-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.journey-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.journey-main{
    flex:1;
    cursor:pointer;
}

.journey-title{
    font-size:21px;
    font-weight:750;
}

.journey-subtitle{
    margin-top:7px;
    color:#777;
    font-size:14px;
}

.journey-creator{
    margin-top:10px;
    color:#555;
    font-size:14px;
}

.journey-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:flex-start;
}

/* =========================
   DETAIL
========================= */

.detail-header{
    padding:20px;
}

.detail-title{
    margin:0;
    font-size:34px;
}

.detail-subtitle{
    color:#888;
    margin:7px 0;
    font-size:14px;
}

.detail-meta{
    color:#888;
    font-size:14px;
    line-height:1.8;
}

.total-box{
    margin-top:20px;
    background:#292929;
    color:white;
    border-radius:20px;
    padding:20px;
}

.total-label{
    font-size:13px;
    opacity:.7;
}

.total-price{
    font-size:30px;
    font-weight:800;
    margin-top:5px;
}

.info-box{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

.info-box-title{
    font-size:19px;
    font-weight:750;
    margin-bottom:10px;
}

.info-box-content{
    color:#666;
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
}

.info-box-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

/* =========================
   VISA / FLIGHT
========================= */

.trip-tools{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.trip-tool-btn{
    width:100%;
    border:1px solid #e1dfda;
    background:white;
    border-radius:15px;
    padding:15px 12px;
    color:#555;
    text-align:left;
    transition:.2s ease;
    box-shadow:0 4px 15px rgba(0,0,0,.025);
}

.trip-tool-btn:hover{
    background:#faf9f6;
    border-color:#ccc8c0;
}

.trip-tool-title{
    font-size:16px;
    font-weight:700;
    color:#292929;
}

.trip-tool-subtitle{
    margin-top:4px;
    color:#999;
    font-size:12px;
}

.visa-display{
    margin-bottom:15px;
}

.visa-item{
    background:#faf9f6;
    border:1px solid #e7e5e0;
    border-radius:14px;
    padding:13px;
}

.visa-name{
    font-size:16px;
    font-weight:700;
}

.visa-price{
    margin-top:7px;
    font-weight:700;
}

.visa-price-detail{
    color:#888;
    font-size:12px;
    margin-top:3px;
}

.visa-link{
    display:inline-block;
    margin-top:8px;
    padding:6px 9px;
    background:#eeece7;
    border-radius:8px;
    text-decoration:none;
    font-size:12px;
}

.flight-display{
    margin-bottom:15px;
}

.flight-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.flight-field{
    background:#faf9f6;
    border:1px solid #e7e5e0;
    border-radius:13px;
    padding:11px;
}

.flight-label{
    color:#999;
    font-size:11px;
    margin-bottom:4px;
}

.flight-value{
    color:#555;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

/* =========================
   DAY / ITINERARY
========================= */

.day-card{
    background:white;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

.day-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.day-title{
    font-size:21px;
    font-weight:750;
}

.item-card,
.stay-card{
    border:1px solid #e7e5e0;
    border-radius:15px;
    padding:14px;
    margin-bottom:10px;
}

.item-title{
    font-weight:700;
    font-size:16px;
}

.item-info{
    color:#777;
    font-size:13px;
    line-height:1.8;
    margin-top:5px;
}

.item-price{
    margin-top:8px;
    font-weight:700;
}

.item-rating{
    display:inline-block;
    margin-top:8px;
    padding:5px 9px;
    background:#f3f2ee;
    border-radius:8px;
    font-size:12px;
    color:#555;
}

.map-link{
    display:inline-block;
    margin-top:6px;
    padding:5px 9px;
    background:#f0efeb;
    border-radius:8px;
    text-decoration:none;
    font-size:12px;
    color:#555;
}

.item-actions{
    margin-top:10px;
    display:flex;
    gap:6px;
}

.add-item-btn{
    width:100%;
    border:1px dashed #ccc;
    background:#faf9f6;
    padding:11px;
    border-radius:12px;
    color:#666;
}

.add-day-btn{
    width:100%;
    border:1px dashed #bdbab3;
    background:#f5f4f1;
    padding:13px;
    border-radius:13px;
    color:#555;
    margin-top:0;
    margin-bottom:15px;
}

.stay-section{
    margin-top:25px;
}

.stay-section h3{
    margin-bottom:12px;
}

/* =========================
   PHOTO PAGE
========================= */

.photo-toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.photo-add-btn{
    border:1px dashed #c8c6c1;
    background:#fff;
    color:#555;
    border-radius:14px;
    padding:12px 15px;
    font-size:13px;
}

.photo-paste-box{
    background:white;
    border:1px dashed #d5d2cb;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
}

.photo-paste-title{
    font-size:14px;
    color:#555;
    font-weight:700;
    margin-bottom:7px;
}

.photo-paste-input{
    width:100%;
    min-height:70px;
    border:1px solid #e4e1db;
    background:#faf9f6;
    border-radius:12px;
    padding:12px;
    outline:none;
    resize:vertical;
    color:#777;
}

.photo-paste-input:focus{
    background:white;
    border-color:#bbb7af;
}

.photo-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.photo-note-card{
    background:white;
    border-radius:20px;
    padding:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

.photo-note-image-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    background:#f5f4f1;
    border-radius:15px;
    overflow:hidden;
}

.photo-note-image{
    display:block;
    width:100%;
    max-height:520px;
    object-fit:contain;
}

.photo-note-text{
    width:100%;
    min-height:90px;
    margin-top:12px;
    border:1px solid #e5e2dc;
    background:#faf9f6;
    border-radius:12px;
    padding:12px;
    outline:none;
    resize:vertical;
    line-height:1.7;
}

.photo-note-text:focus{
    background:white;
    border-color:#bbb7af;
}

.photo-note-actions{
    display:flex;
    justify-content:flex-end;
    gap:7px;
    margin-top:9px;
}

.photo-empty{
    min-height:300px;
    background:white;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#aaa;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

.photo-empty-inner{
    padding:30px;
}

.photo-empty-title{
    font-size:20px;
    color:#666;
    margin-bottom:8px;
}

.photo-empty-text{
    font-size:13px;
    color:#aaa;
    line-height:1.7;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:40px 20px;
    color:#999;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:1000;
    padding:15px;
}

.modal-backdrop.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:24px;
    padding:24px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    margin:0;
}

.close-btn{
    border:none;
    background:#eee;
    width:36px;
    height:36px;
    border-radius:50%;
}

.modal-footer{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-footer button{
    flex:1;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

/* =========================
   RATING
========================= */

.rating-group{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.rating-option{
    position:relative;
}

.rating-option input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.rating-option label{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:45px;
    padding:8px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fafafa;
    color:#666;
    font-size:13px;
    cursor:pointer;
    text-align:center;
    transition:.2s ease;
}

.rating-option input:checked + label{
    background:#292929;
    border-color:#292929;
    color:white;
}

/* =========================
   LOADING
========================= */

.loading{
    padding:60px 20px;
    text-align:center;
    color:#888;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding:22px 16px 12px;
    }

    .logo{
        font-size:27px;
        letter-spacing:.8px;
    }

    .logo span{
        font-size:24px;
    }

    .user-email{
        display:none;
    }

    .home-intro{
        padding:20px 16px 18px;
    }

    .home-title{
        font-size:22px;
    }

    .home-subtitle{
        font-size:12px;
        margin-top:5px;
    }

    .edit-intro-btn{
        padding:7px 11px;
        font-size:12px;
    }

    .section{
        padding:10px 16px;
    }

    .destination-card{
        padding:14px;
    }

    .destination-actions{
        max-width:150px;
        justify-content:flex-end;
    }

    .destination-actions .icon-btn,
    .destination-actions .text-action{
        height:31px;
        min-width:31px;
        padding:0 8px;
        font-size:12px;
    }

    .journey-top{
        flex-direction:column;
    }

    .journey-actions{
        justify-content:flex-start;
    }

    .detail-title{
        font-size:29px;
    }

    .detail-subtitle{
        font-size:14px;
    }

    .row{
        grid-template-columns:1fr;
    }

    .rating-group{
        grid-template-columns:1fr;
    }

    .trip-tools{
        grid-template-columns:1fr 1fr;
    }

    .flight-grid{
        grid-template-columns:1fr;
    }

    .modal-backdrop{
        padding:0;
    }

    .modal{
        border-radius:24px 24px 0 0;
        max-height:94vh;
    }

    .photo-note-image{
        max-height:420px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<!-- INTRO MODAL -->
<div id="introModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h2>編輯主頁文案</h2>
            <button type="button" class="close-btn" onclick="closeModal('introModal')">×</button>
        </div>

        <div class="field">
            <label>主標題</label>
            <input id="introTitleInput" type="text" placeholder="例如：去哪裡玩？">
        </div>

        <div class="field">
            <label>副標題</label>
            <input id="introSubtitleInput" type="text" placeholder="例如：小資也能輕鬆飛">
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-light" onclick="closeModal('introModal')">取消</button>
            <button type="button" class="btn" onclick="saveIntro()">儲存</button>
        </div>
    </div>
</div>

<!-- COOPERATION MODAL -->
<div id="cooperationModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h2>編輯合作</h2>
            <button type="button" class="close-btn" onclick="closeModal('cooperationModal')">×</button>
        </div>

        <div class="field">
            <label>合作名稱</label>
            <input id="cooperationTitleInput" type="text" placeholder="例如：eSIM 網路">
        </div>

        <div class="field">
            <label>合作說明</label>
            <textarea id="cooperationDescriptionInput" placeholder="例如：出國上網推薦使用這個 eSIM"></textarea>
        </div>

        <div class="field">
            <label>合作連結</label>
            <input id="cooperationLinkInput" type="url" placeholder="https://...">
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-light" onclick="closeModal('cooperationModal')">取消</button>
            <button type="button" class="btn" onclick="saveCooperation()">儲存</button>
        </div>
    </div>
</div>

<!-- DESTINATION MODAL -->
<div id="destinationModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h2 id="destinationModalTitle">新增目的地</h2>
            <button type="button" class="close-btn" onclick="closeModal('destinationModal')">×</button>
        </div>

        <div class="field">
            <label>目的地名稱</label>
            <input id="destinationInput" type="text" placeholder="例如：日本">
        </div>

/* =========================

========================= */

function getTripDayCount(tripId){

    if(!tripId){
        return 1;
    }

    const key =
        "goya_trip_day_count_" +
        String(tripId);

    const saved =
        Number(
            localStorage.getItem(key)
        );

    if(
        Number.isFinite(saved) &&
        saved >= 1
    ){

        return saved;

    }

    return 1;

}

function saveTripDayCount(
    tripId,
    count
){

    if(!tripId){
        return;
    }

    const safeCount =
        Math.max(
            1,
            Number(count) || 1
        );

    localStorage.setItem(
        "goya_trip_day_count_" +
        String(tripId),
        String(safeCount)
    );

}

async function syncTripDayCount(){

    if(!currentTrip){
        return 1;
    }

    let savedCount =
        getTripDayCount(
            currentTrip.id
        );

    const {
        data
    } =
        await supabaseClient
            .from("itineraries")
            .select("day_number")
            .eq(
                "trip_id",
                currentTrip.id
            )
            .order(
                "day_number",
                {
                    ascending:false
                }
            )
            .limit(1);

    let databaseMaxDay = 0;

    if(
        data &&
        data.length
    ){

        databaseMaxDay =
            Number(
                data[0].day_number
            ) || 0;

    }

    const finalCount =
        Math.max(
            1,
            savedCount,
            databaseMaxDay
        );

    saveTripDayCount(
        currentTrip.id,
        finalCount
    );

    return finalCount;

}

async function handlePhotoFiles(event){

    const files =
        Array.from(
            event.target.files || []
        );

    if(!files.length){
        return;
    }

    for(const file of files){

        if(!file.type.startsWith("image/")){
            continue;
        }

        try{

            const dataUrl =
                await readFileAsDataURL(file);

            addPhotoNote(
                dataUrl,
                ""
            );

        }catch(e){

            console.error(e);

        }

    }

    renderPhotoPage();

}

function readFileAsDataURL(file){

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(reader.result);

            reader.onerror =
                () => reject(reader.error);

            reader.readAsDataURL(file);

        }
    );

}

function addPhotoNote(image, text){

    const photos =
        getTripPhotos();

    photos.push({

        id:
            Date.now().toString() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2),

        image,

        text:
            text || "",

        createdAt:
            new Date().toISOString()

    });

    saveTripPhotos(photos);

}

    photoId,
    text
){

    const photos =
        getTripPhotos();

    const photo =
        photos.find(
            item =>
                item.id === photoId
        );

    if(!photo){
        return;
    }

    photo.text = text;

    saveTripPhotos(photos);

}

function setupPhotoPaste(){

    const pasteBox =
        document.getElementById(
            "photoPasteInput"
        );

    if(!pasteBox){
        return;
    }

    pasteBox.addEventListener(
        "paste",
        async function(event){

            const items =
                Array.from(
                    event.clipboardData?.items || []
                );

            const imageItems =
                items.filter(
                    item =>
                        item.type.startsWith("image/")
                );

            if(!imageItems.length){
                return;
            }

            event.preventDefault();

            for(const item of imageItems){

                const file =
                    item.getAsFile();

                if(!file){
                    continue;
                }

                try{

                    const dataUrl =
                        await readFileAsDataURL(file);

                    addPhotoNote(
                        dataUrl,
                        ""
                    );

                }catch(e){

                    console.error(e);

                }

            }

            pasteBox.value = "";

            renderPhotoPage();

        }
    );

}

function sortTripsBySavedOrder(trips){

    const order =
        getJourneyOrder(
            currentDestination
        );

    if(!order.length){
        return trips;
    }

    const map = new Map(
        trips.map(
            trip => [
                trip.id,
                trip
            ]
        )
    );

    const result = [];

    order.forEach(id => {

        if(map.has(id)){

            result.push(
                map.get(id)
            );

            map.delete(id);

        }

    });

    map.forEach(trip => {
        result.push(trip);
    });

    return result;

}

        } =

async function getDestinationCount(
    destination
){

    const {
        count
    } =
        await supabaseClient
            .from("trips")
            .select(
                "id",
                {
                    count:"exact",
                    head:true
                }
            )
            .eq(
                "destination",
                destination
            );

    return {
        count:count || 0
    };

}

            "編輯目的地";

        document.getElementById(
            "destinationInput"

    }

}

async function saveDestination(){

    const input =
        document.getElementById(
            "destinationInput"
        );

    const name =
        input.value.trim();

    if(!name){

        alert("請輸入目的地名稱");

        return;

    }

    const list =
        getDestinations();

    if(
        list.includes(name) &&
        (
            editingDestinationIndex === -1 ||
            list[editingDestinationIndex] !== name
        )
    ){

        alert("這個目的地已經存在");

        return;

    }

    if(
        editingDestinationIndex === -1
    ){

        list.push(name);

        saveDestinations(list);

    }else{

        const oldName =
            list[editingDestinationIndex];

        if(oldName !== name){

            list[editingDestinationIndex] =
                name;

            saveDestinations(list);

            await supabaseClient
                .from("trips")
                .update({
                    destination:name
                })
                .eq(
                    "destination",
                    oldName
                );

            const oldOrder =
                getJourneyOrder(
                    oldName
                );

            if(oldOrder.length){

                saveJourneyOrder(
                    name,
                    oldOrder
                );

                localStorage.removeItem(
                    "goya_journey_order_" +
                    oldName
                );

            }

        }

    }

    closeModal("destinationModal");

    await renderHome();

}

async function deleteDestination(index){

    const list =
        getDestinations();

    const name =
        list[index];

    const ok =
        confirm(
            `確定要刪除「${name}」嗎？\n\n目的地會從主頁移除，但原本的旅程資料不會刪除。`
        );

    if(!ok){
        return;
    }

    list.splice(index,1);

    saveDestinations(list);

    await renderHome();

}

function moveDestination(
    index,
    direction
){

    const list =
        getDestinations();

    const newIndex =
        index + direction;

    if(
        newIndex < 0 ||
        newIndex >= list.length
    ){
        return;
    }

    [
        list[index],
        list[newIndex]
    ] =
    [
        list[newIndex],
        list[index]
    ];

    saveDestinations(list);

    renderHome();

}

async function saveJourney(){

    const title =
        document
            .getElementById(
                "journeyTitleInput"
            )
            .value
            .trim();

    if(!title){

        alert("請輸入旅程主標題");

        return;

    }

    const subtitle =
        document
            .getElementById(
                "journeySubtitleInput"
            )
            .value
            .trim();

    const creator =
        document
            .getElementById(
                "journeyCreatorInput"
            )
            .value
            .trim();

    const startDate =
        document
            .getElementById(
                "journeyStartInput"
            )
            .value || null;

    const endDate =
        document
            .getElementById(
                "journeyEndInput"
            )
            .value || null;

    const description =
        document
            .getElementById(
                "journeyDescriptionInput"
            )
            .value
            .trim();

    const other =
        document
            .getElementById(
                "journeyOtherInput"
            )
            .value
            .trim();

        data:{
            user
        }
    } =
        await supabaseClient
            .auth
            .getUser();

    if(!user){

        alert("登入狀態已失效，請重新登入。");

        return;

    }

    let oldInfo = {
        visa:null,
        flight:null
    };

    if(editingJourneyId){

        const existingTrip =
            currentTrips.find(
                trip =>
                    trip.id === editingJourneyId
            );

        if(existingTrip){

            const parsed =
                parseTripDescription(
                    existingTrip.description
                );

            oldInfo = {
                visa:
                    parsed.visa || null,

                flight:
                    parsed.flight || null
            };

        }

    }

    const descriptionJson =
        JSON.stringify({

            subtitle,

            creator,

            description,

            other,

            visa:
                oldInfo.visa,

            flight:
                oldInfo.flight

        });

    if(!editingJourneyId){

        const {
            data,
            error
        } =
            await supabaseClient
                .from("trips")
                .insert({

                    owner_id:
                        user.id,

                        currentDestination,

                    start_date:
                        startDate,

                        endDate,

                        descriptionJson

            getJourneyOrder(

            currentDestination,

        } =
            await supabaseClient
                .from("trips")
                .update({

                    start_date:
                        startDate,

                    end_date:
                        endDate,

                    description:
                        descriptionJson

                })
                .eq(
                    "id",
                    editingJourneyId
                );

        if(error){

            alert(error.message);

            return;

        }

    }

    closeModal("journeyModal");

    await renderJourneys();

async function updateVisaTwd(){

    const priceInput =
        document.getElementById(
            "visaPriceInput"
        );

    const currencyInput =
        document.getElementById(
            "visaCurrencyInput"
        );

    const preview =
        document.getElementById(
            "visaTwdPreview"
        );

    const message =
        document.getElementById(
            "visaRateMessage"
        );

    if(!priceInput || !currencyInput){
        return;
    }

    const price =
        Number(
            priceInput.value || 0
        );

    const currency =
        currencyInput.value;

    if(!price){

        preview.textContent =
            "台幣換算：NT$ 0";

        message.textContent = "";

        return;

    }

    if(currency === "TWD"){

        preview.textContent =
            `台幣換算：NT$ ${formatMoney(price)}`;

        message.textContent =
            "1 TWD = 1 TWD";

        return;

    }

    preview.textContent =
        "台幣換算：計算中……";

    message.textContent =
        "正在取得目前匯率……";

    try{

        const rate =
            await getCurrencyToTwdRate(
                currency
            );

        const twd =
            price * rate;

        preview.textContent =
            `台幣換算：NT$ ${formatMoney(twd)}`;

        message.textContent =
            `目前換算約 1 ${currency} = NT$ ${rate.toLocaleString(
                "zh-TW",
                {
                    maximumFractionDigits:4
                }
            )}`;

    }catch(error){

        console.error(error);

        preview.textContent =
            "台幣換算：暫時無法取得匯率";

        message.textContent =
            "匯率取得失敗，請稍後再試。";

    }

}

async function getCurrencyToTwdRate(
    currency
){

    if(
        currency === "TWD"
    ){
        return 1;
    }

    if(
        visaRateCache[currency]
    ){

        return visaRateCache[currency];

    }

    const response =
        await fetch(
            `https://open.er-api.com/v6/latest/${encodeURIComponent(currency)}`
        );

    if(!response.ok){

        throw new Error(
            "匯率服務無法使用"
        );

    }

    const data =
        await response.json();

    const rate =
        Number(
            data?.rates?.TWD
        );

    if(
        !Number.isFinite(rate) ||
        rate <= 0
    ){

        throw new Error(

async function saveVisa(){

    if(!currentTrip){

        alert(
            "目前沒有選擇旅程。"
        );

        return;

    }

    const name =
        document
            .getElementById(
                "visaNameInput"
            )
            .value
            .trim();

    const url =
        document
            .getElementById(
                "visaUrlInput"
            )
            .value
            .trim();

    const priceInput =
        document.getElementById(
            "visaPriceInput"
        );

    const currency =
        document
            .getElementById(
                "visaCurrencyInput"
            )
            .value;

    const price =
        Number(
            priceInput.value || 0
        );

    if(!name){

        alert(
            "請輸入簽證名稱"
        );

        return;

    }

    if(
        url &&
        !/^https?:\/\//i.test(url)
    ){

        alert(
            "網址請輸入完整網址，例如：https://..."
        );

        return;

    }

    if(
        !Number.isFinite(price) ||
        price < 0
    ){

        alert(
            "價格格式不正確。"
        );

        return;

    }

    const saveButton =
        document.getElementById(
            "saveVisaButton"
        );

    if(saveButton){

        saveButton.disabled = true;
        saveButton.textContent = "儲存中……";

    }

    try{

        let twd = price;

        if(currency !== "TWD"){

            const rate =
                await getCurrencyToTwdRate(
                    currency
                );

            twd =
                price * rate;

        }

        const info =
            parseTripDescription(
                currentTrip.description
            );

        const newInfo = {

            subtitle:
                info.subtitle || "",

            creator:
                info.creator || "",

            description:
                info.description || "",

            other:
                info.other || "",

            visa:{

                name,

                url,

                price,

                currency,

                twd

            },

            flight:
                info.flight || null

        };

        const {
            data,
            error
        } =
            await supabaseClient
                .from("trips")
                .update({

                    description:
                        JSON.stringify(
                            newInfo
                        )

                })
                .eq(
                    "id",
                    currentTrip.id
                )
                .select()
                .single();

        if(error){

            alert(
                "簽證儲存失敗：\n\n" +
                error.message
            );

            return;

        }

        currentTrip =
            data;

        closeModal("visaModal");

        await renderTripDetail();

    }catch(error){

        console.error(
            "saveVisa:",
            error
        );

        alert(
            "簽證儲存失敗：\n\n" +
            (
                error?.message ||
                String(error)
            )
        );

    }finally{

        if(saveButton){

            saveButton.disabled = false;
            saveButton.textContent = "儲存";

        }

    }

}

        itineraryResult,

        await Promise.all([

            supabaseClient
                .from("itineraries")
                .select("*")
                .eq(
                    "trip_id",
                    trip.id
                )
                .order(
                    "day_number"
                )
                .order(
                    "id"

            supabaseClient
                .from("stays")

async function addNextDay(){

    if(!currentTrip){
        return;
    }

    const currentCount =
        getTripDayCount(
            currentTrip.id
        );

    const nextDay =
        currentCount + 1;

    saveTripDayCount(
        currentTrip.id,
        nextDay
    );

    await renderTripDetail();

}

async function addDayAndItem(){

    if(!currentTrip){
        return;
    }

    const count =
        getTripDayCount(
            currentTrip.id
        );

    saveTripDayCount(
        currentTrip.id,
        Math.max(
            1,
            count
        )
    );

    openItemModal(
        1,
        null
    );

}

function openItemModal(
    day,
    itemId
){

    currentDay =
        Number(day) || 1;

    editingItemId =
        itemId || null;

    if(currentTrip){

        const currentCount =
            getTripDayCount(
                currentTrip.id
            );

        if(
            currentDay > currentCount
        ){

            saveTripDayCount(
                currentTrip.id,
                currentDay
            );

        }

    }

    if(!editingItemId){

        document.getElementById(
            "itemModalTitle"
        ).textContent =
            `Day ${currentDay}｜新增行程`;

        document.getElementById(
            "itemTitleInput"
        ).value = "";

        document.getElementById(
            "itemLocationInput"
        ).value = "";

        document.getElementById(
            "itemTransportInput"
        ).value = "";

        document.getElementById(
            "itemPriceInput"
        ).value = "";

        document.getElementById(
            "itemDurationInput"
        ).value = "";

        document.getElementById(
            "itemNotesInput"
        ).value = "";

        document.getElementById(
            "itemOtherInput"
        ).value = "";

        document.querySelectorAll(
            'input[name="itemRating"]'
        ).forEach(
            radio => {
                radio.checked = false;
            }
        );

        openModal("itemModal");

        setTimeout(() => {

            document
                .getElementById(
                    "itemTitleInput"
                )
                ?.focus();

        },100);

        return;

    }

    loadItemForEdit(
        editingItemId
    );

}

async function loadItemForEdit(
    itemId
){

    const {
        data:item,
        error
    } =
        await supabaseClient
            .from("itineraries")
            .select("*")
            .eq(
                "id",
                itemId
            )
            .single();

    if(error){

        alert(error.message);

        return;

    }

    const extra =
        parseItemNotes(
            item.notes
        );

    editingItemId =
        item.id;

    currentDay =
        Number(item.day_number) || 1;

    if(currentTrip){

        const currentCount =
            getTripDayCount(
                currentTrip.id
            );

        if(
            currentDay > currentCount
        ){

            saveTripDayCount(
                currentTrip.id,
                currentDay
            );

        }

    }

    document.getElementById(
        "itemModalTitle"
    ).textContent =
        `Day ${currentDay}｜編輯行程`;

    document.getElementById(
        "itemTitleInput"
    ).value =
        item.title || "";

    document.getElementById(
        "itemLocationInput"
    ).value =
        item.location || "";

    document.getElementById(
        "itemTransportInput"
    ).value =
        item.transport || "";

    document.getElementById(
        "itemPriceInput"
    ).value =
        item.price || "";

    document.getElementById(
        "itemDurationInput"
    ).value =
        item.duration || "";

    document.getElementById(
        "itemNotesInput"
    ).value =
        extra.text || "";

    document.getElementById(
        "itemOtherInput"
    ).value =
        extra.other || "";

    document.querySelectorAll(
        'input[name="itemRating"]'
    ).forEach(
        radio => {

            radio.checked =
                radio.value ===
                (
                    extra.rating ||
                    item.rating ||
                    ""
                );

        }
    );

    openModal("itemModal");

}

async function saveItem(){

    if(!currentTrip){

        alert(
            "目前沒有選擇旅程，請回到旅程後再新增。"
        );

        return;

    }

    const titleInput =
        document.getElementById(
            "itemTitleInput"
        );

    if(!titleInput){

        alert(
            "找不到行程輸入欄位，請重新整理頁面後再試。"
        );

        return;

    }

    const title =
        titleInput.value.trim();

    if(!title){

        alert("請輸入行程名稱");

        titleInput.focus();

        return;

    }

    const dayNumber =
        Number(currentDay);

    if(
        !Number.isFinite(dayNumber) ||
        dayNumber < 1
    ){

        alert("Day 資料有問題，請重新新增行程。");

        return;

    }

    /*
       只要在某個 Day 新增行程，
       該 Day 就一定被保留。
    */

    const existingDayCount =
        getTripDayCount(
            currentTrip.id
        );

    if(
        dayNumber > existingDayCount
    ){

        saveTripDayCount(
            currentTrip.id,
            dayNumber
        );

    }

    const {
        data:{
            user
        },
        error:userError
    } =
        await supabaseClient
            .auth
            .getUser();

    if(userError){

        alert(
            "無法確認登入狀態：\n\n" +
            userError.message
        );

        return;

    }

    if(!user){

        alert(
            "登入狀態已失效，請重新登入。"
        );

        return;

    }

    const selectedRating =
        document.querySelector(
            'input[name="itemRating"]:checked'
        );

    const notesText =
        document.getElementById(
            "itemNotesInput"
        ).value.trim();

    const otherText =
        document.getElementById(
            "itemOtherInput"
        ).value.trim();

    const priceValue =
        document.getElementById(
            "itemPriceInput"
        ).value;

    const price =
        priceValue === ""
        ?
        0
        :
        Number(priceValue);

    if(!Number.isFinite(price)){

        alert(
            "價格格式不正確。"
        );

        return;

    }

    const payload = {

        owner_id:
            user.id,

        trip_id:
            currentTrip.id,

        day_number:
            dayNumber,

        title,

        location:
            document.getElementById(
                "itemLocationInput"
            ).value.trim(),

        transport:
            document.getElementById(
                "itemTransportInput"
            ).value.trim(),

        price,

        duration:
            document.getElementById(
                "itemDurationInput"
            ).value.trim(),

        notes:
            JSON.stringify({

                text:
                    notesText,

                rating:
                    selectedRating
                    ?
                    selectedRating.value
                    :
                    "",

                other:
                    otherText

            })

    };

    const saveButton =
        document.getElementById(
            "saveItemButton"
        );

    if(saveButton){

        saveButton.disabled = true;
        saveButton.textContent = "儲存中……";

    }

    try{

        let result;

        if(editingItemId){

            result =
                await supabaseClient
                    .from("itineraries")
                    .update(
                        payload
                    )
                    .eq(
                        "id",
                        editingItemId
                    )
                    .select()
                    .single();

        }else{

            result =
                await supabaseClient
                    .from("itineraries")
                    .insert(
                        payload
                    )
                    .select()
                    .single();

        }

        if(result.error){

            console.error(
                "儲存行程失敗：",
                result.error
            );

            alert(
                "行程儲存失敗：\n\n" +
                result.error.message
            );

            return;

        }

        closeModal("itemModal");

        editingItemId = null;

        await renderTripDetail();

    }catch(error){

        console.error(
            "saveItem exception:",
            error
        );

        alert(
            "行程儲存時發生錯誤：\n\n" +
            (
                error?.message ||
                String(error)
            )
        );

    }finally{

        if(saveButton){

            saveButton.disabled = false;
            saveButton.textContent = "儲存";

        }

    }

}

async function deleteItem(
    itemId
){

    if(
        !confirm(
            "確定要刪除這個行程嗎？"
        )
    ){
        return;
    }

    const {
        error
    } =
        await supabaseClient
            .from("itineraries")
            .delete()
            .eq(
                "id",
                itemId
            );

    if(error){

        alert(error.message);

        return;

    }

    /*
       注意：
       刪除行程不會刪除 Day。
       例如 Day 2 的最後一個行程刪掉，
       Day 2 還是會保留。
    */

    await renderTripDetail();

}

========================= */

function parseTripDescription(
    value
){

    if(!value){

        return {
            subtitle:"",
            creator:"",
            description:"",
            visa:null,
            flight:null,
            other:""
        };

    }

    try{

        const parsed =
            JSON.parse(value);

        if(
            typeof parsed === "object"
        ){

            return {

                subtitle:
                    parsed.subtitle || "",

                creator:
                    parsed.creator || "",

                description:
                    parsed.description || "",

                visa:
                    parsed.visa || null,

                flight:
                    parsed.flight || null,

                other:
                    parsed.other || ""

            };

        }

    }catch(e){}

    return {

        subtitle:"",
        creator:"",
        description:value,
        visa:null,
        flight:null,
        other:""

    };

}

function parseStayNotes(
    value
){

    if(!value){

        return {
            other:"",
            notes:""
        };

    }

    try{

        const parsed =
            JSON.parse(value);

        if(
            typeof parsed === "object"
        ){

            return {

                other:
                    parsed.other || "",

                notes:
                    parsed.notes || ""

            };

        }

    }catch(e){}

    return {

        other:"",
        notes:value

    };

}

function parseItemNotes(
    value
){

    if(!value){

        return {
            text:"",
            rating:"",
            other:""
        };

    }

    try{

        const parsed =
            JSON.parse(value);

        if(
            typeof parsed === "object"
        ){

            return {

                text:
                    parsed.text || "",

                rating:
                    parsed.rating || "",

                other:
                    parsed.other || ""

            };

        }

    }catch(e){}

    return {

        text:value,
        rating:"",
        other:""

    };

}

/* =========================
   HELPERS
========================= */

function getRatingText(
    rating
){

    if(rating === "recommend"){
        return "👍🏻 推薦";
    }

    if(rating === "normal"){
        return "👌 普通";
    }

    if(rating === "no"){
        return "👎🏻 不用去";
    }

    return "";

}

function getMapUrl(
    address
){

    return (
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(address)
    );

}

function safeUrl(
    url
){

    const value =
        String(
            url || ""
        ).trim();

    if(!value){
        return "#";
    }

    if(
        /^https?:\/\//i.test(value)
    ){

        return escapeHtml(value);

    }

    return "#";

}

function formatMoney(
    value
){

    return Number(
        value || 0
    )
    .toLocaleString(
        "zh-TW"
    );

}

function formatDate(
    value
){

    if(!value){
        return "";
    }

    return value.replaceAll(
        "-",
        "/"
    );

}

function formatDateTime(
    value
){

    if(!value){
        return "";
    }

    try{

        const date =
            new Date(value);

        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return String(value)
                .replace("T"," ");

        }

        return (
            date.getFullYear() +
            "/" +
            String(
                date.getMonth() + 1
            ).padStart(2,"0") +
            "/" +
            String(
                date.getDate()
            ).padStart(2,"0") +
            " " +
            String(
                date.getHours()
            ).padStart(2,"0") +
            ":" +
            String(
                date.getMinutes()
            ).padStart(2,"0")
        );

    }catch(e){

        return String(value)
            .replace("T"," ");

    }

}

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeJs(
    value
){

    return String(
        value ?? ""
    )
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n","\\n")
    .replaceAll("\r","\\r");

}
