<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOYA｜走呀</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#f4f3f0;
    --card:#ffffff;
    --text:#292929;
    --sub:#777;
    --line:#e7e5e1;
    --soft:#f0efec;
    --dark:#292929;
    --danger:#b85b5b;
    --radius:20px;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:28px;
    padding:36px 28px;
    box-shadow:0 15px 45px rgba(0,0,0,.06);
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo-main{
    font-size:34px;
    font-weight:800;
    letter-spacing:2px;
}

.logo-sub{
    margin-top:5px;
    color:var(--sub);
    font-size:14px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    font-size:13px;
    color:#666;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid var(--line);
    background:#faf9f7;
    border-radius:13px;
    padding:12px 13px;
    outline:none;
    color:var(--text);
}

input:focus,
textarea:focus,
select:focus{
    border-color:#aaa;
    background:#fff;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:13px;
    padding:12px 17px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-dark{
    background:var(--dark);
    color:#fff;
}

.btn-light{
    background:var(--soft);
    color:var(--text);
}

.btn-danger{
    background:#f4e4e4;
    color:#9a4444;
}

.full{
    width:100%;
}

.login-message{
    min-height:22px;
    margin-top:14px;
    font-size:13px;
    text-align:center;
    color:#a44;
}

/* =========================
   APP
========================= */

#app{
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(244,243,240,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(220,218,214,.8);
}

.topbar-inner{
    max-width:1180px;
    margin:auto;
    min-height:70px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    font-weight:800;
    font-size:21px;
    letter-spacing:1px;
}

.brand small{
    display:block;
    color:#888;
    font-size:10px;
    letter-spacing:2px;
    font-weight:500;
}

.user-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-email{
    color:#777;
    font-size:12px;
}

.container{
    max-width:1180px;
    margin:auto;
    padding:28px 20px 60px;
}

/* =========================
   HERO
========================= */

.hero{
    margin-bottom:25px;
}

.hero h1{
    margin:0;
    font-size:32px;
    letter-spacing:-1px;
}

.hero p{
    margin:8px 0 0;
    color:#777;
}

/* =========================
   TRIP LIST
========================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.section-title h2{
    margin:0;
    font-size:20px;
}

.trip-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.trip-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    transition:.2s;
}

.trip-card:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.trip-cover{
    height:170px;
    background:#e9e8e4;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    overflow:hidden;
}

.trip-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.trip-card-body{
    padding:17px;
}

.trip-title{
    font-size:18px;
    font-weight:700;
}

.trip-destination{
    color:#777;
    margin-top:5px;
    font-size:14px;
}

.trip-date{
    color:#999;
    margin-top:10px;
    font-size:12px;
}

.trip-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.trip-actions button{
    flex:1;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    background:#fff;
    border:1px dashed #d8d5d0;
    border-radius:20px;
    padding:45px 20px;
    color:#888;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.38);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal{
    width:100%;
    max-width:620px;
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:24px;
    padding:25px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-head h3{
    margin:0;
    font-size:21px;
}

.close{
    width:35px;
    height:35px;
    border:0;
    background:var(--soft);
    border-radius:50%;
    font-size:18px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-actions .btn{
    flex:1;
}

/* =========================
   DETAIL
========================= */

.detail-head{
    background:#fff;
    border:1px solid var(--line);
    border-radius:24px;
    padding:25px;
    margin-bottom:20px;
}

.back-btn{
    margin-bottom:18px;
}

.detail-title{
    font-size:30px;
    font-weight:800;
}

.detail-destination{
    color:#777;
    margin-top:6px;
}

.detail-description{
    margin-top:15px;
    white-space:pre-wrap;
    line-height:1.7;
    color:#666;
}

.detail-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:20px;
}

.info-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
}

.info-label{
    color:#888;
    font-size:12px;
}

.info-value{
    font-size:17px;
    font-weight:700;
    margin-top:6px;
}

/* =========================
   TABS
========================= */

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:18px;
}

.tab{
    border:1px solid var(--line);
    background:#fff;
    padding:10px 16px;
    border-radius:999px;
    white-space:nowrap;
}

.tab.active{
    background:var(--dark);
    color:#fff;
    border-color:var(--dark);
}

/* =========================
   PANEL
========================= */

.panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
}

.panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.panel-head h3{
    margin:0;
    font-size:19px;
}

/* =========================
   DAY
========================= */

.day-block{
    border:1px solid var(--line);
    border-radius:18px;
    margin-bottom:14px;
    overflow:hidden;
}

.day-head{
    background:#f5f4f1;
    padding:15px 17px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.day-title{
    font-weight:800;
}

.day-body{
    padding:14px;
}

.itinerary-item{
    border:1px solid var(--line);
    border-radius:15px;
    padding:14px;
    margin-bottom:10px;
}

.itinerary-item:last-child{
    margin-bottom:0;
}

.item-title{
    font-weight:700;
    font-size:16px;
}

.item-location{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.item-meta{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:9px;
}

.badge{
    background:#f0efec;
    color:#666;
    padding:5px 8px;
    border-radius:8px;
    font-size:11px;
}

.item-notes{
    margin-top:10px;
    color:#666;
    white-space:pre-wrap;
    line-height:1.6;
    font-size:13px;
}

.item-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.item-actions button{
    font-size:12px;
    padding:7px 10px;
}

/* =========================
   LIST
========================= */

.list-item{
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px;
    margin-bottom:10px;
}

.list-item:last-child{
    margin-bottom:0;
}

.list-title{
    font-weight:700;
}

.list-sub{
    color:#777;
    font-size:13px;
    margin-top:5px;
    line-height:1.6;
}

.list-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

/* =========================
   PHOTO
========================= */

.photo-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.photo-card{
    position:relative;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    background:#eee;
}

.photo-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-delete{
    position:absolute;
    top:7px;
    right:7px;
    width:28px;
    height:28px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:#fff;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){
    .trip-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .photo-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:600px){
    .topbar-inner{
        padding:0 15px;
    }

    .user-email{
        display:none;
    }

    .container{
        padding:20px 15px 45px;
    }

    .hero h1{
        font-size:27px;
    }

    .trip-grid{
        grid-template-columns:1fr;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .detail-title{
        font-size:25px;
    }

    .photo-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .modal{
        padding:20px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

    <div class="login-card">

        <div class="logo">
            <div class="logo-main">GOYA｜走呀</div>
            <div class="logo-sub">你的旅行，整理得剛剛好。</div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                id="loginEmail"
                type="email"
                placeholder="輸入 Email"
            >
        </div>

        <div class="form-group">
            <label>密碼</label>
            <input
                id="loginPassword"
                type="password"
                placeholder="輸入密碼"
            >
        </div>

        <button
            class="btn btn-dark full"
            onclick="login()"
        >
            登入 GOYA
        </button>

        <div
            id="loginMessage"
            class="login-message"
        ></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

    <header class="topbar">

        <div class="topbar-inner">

            <div class="brand">
                GOYA｜走呀
                <small>TRAVEL PLANNER</small>
            </div>

            <div class="user-area">

                <span
                    id="userEmail"
                    class="user-email"
                ></span>

                <button
                    class="btn btn-light"
                    onclick="logout()"
                >
                    登出
                </button>

            </div>

        </div>

    </header>


    <main class="container">

        <!-- HOME -->

        <section id="homeView">

            <div class="hero">

                <h1>走呀 ✈️</h1>

                <p>
                    把想去的地方，慢慢整理成一趟旅行。
                </p>

            </div>


            <div class="section-title">

                <h2>我的旅程</h2>

                <button
                    class="btn btn-dark"
                    onclick="openTripModal()"
                >
                    ＋ 新增旅程
                </button>

            </div>


            <div
                id="tripGrid"
                class="trip-grid"
            ></div>

        </section>


        <!-- DETAIL -->

        <section
            id="detailView"
            class="hidden"
        >

            <button
                class="btn btn-light back-btn"
                onclick="showHome()"
            >
                ← 回到旅程
            </button>

            <div id="detailContent"></div>

        </section>

    </main>

</div>


<!-- =========================
     TRIP MODAL
========================= -->

<div
    id="tripModal"
    class="modal-backdrop hidden"
>

    <div class="modal">

        <div class="modal-head">

            <h3 id="tripModalTitle">
                新增旅程
            </h3>

            <button
                class="close"
                onclick="closeTripModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">
            <label>旅程名稱</label>
            <input id="tripTitle" placeholder="例如：大阪自由行">
        </div>


        <div class="form-group">
            <label>目的地</label>
            <input id="tripDestination" placeholder="例如：日本・大阪">
        </div>


        <div class="form-group">

            <label>開始日期</label>

            <input
                id="tripStart"
                type="date"
            >

        </div>


        <div class="form-group">

            <label>結束日期</label>

            <input
                id="tripEnd"
                type="date"
            >

        </div>


        <div class="form-group">

            <label>封面照片網址（之後會改成直接從相簿上傳）</label>

            <input
                id="tripCover"
                placeholder="https://..."
            >

        </div>


        <div class="form-group">

            <label>旅行介紹</label>

            <textarea
                id="tripDescription"
                placeholder="這趟旅行想怎麼玩？"
            ></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeTripModal()"
            >
                取消
            </button>

            <button
                class="btn btn-dark"
                onclick="saveTrip()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ITINERARY MODAL
========================= -->

<div
    id="itineraryModal"
    class="modal-backdrop hidden"
>

    <div class="modal">

        <div class="modal-head">

            <h3 id="itineraryModalTitle">
                新增行程
            </h3>

            <button
                class="close"
                onclick="closeItineraryModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label>Day</label>

            <input
                id="itineraryDay"
                type="number"
                min="1"
                value="1"
            >

        </div>


        <div class="form-group">

            <label>行程名稱</label>

            <input
                id="itineraryTitle"
                placeholder="例如：伏見稻荷大社"
            >

        </div>


        <div class="form-group">

            <label>地點</label>

            <input
                id="itineraryLocation"
                placeholder="例如：京都"
            >

        </div>


        <div class="form-group">

            <label>交通方式</label>

            <input
                id="itineraryTransport"
                placeholder="例如：地鐵、JR、步行"
            >

        </div>


        <div class="form-group">

            <label>價格</label>

            <input
                id="itineraryPrice"
                type="number"
                placeholder="0"
            >

        </div>


        <div class="form-group">

            <label>需要時間</label>

            <input
                id="itineraryDuration"
                placeholder="例如：2 小時"
            >

        </div>


        <div class="form-group">

            <label>開始時間</label>

            <input
                id="itineraryStart"
                type="time"
            >

        </div>


        <div class="form-group">

            <label>結束時間</label>

            <input
                id="itineraryEnd"
                type="time"
            >

        </div>


        <div class="form-group">

            <label>備註</label>

            <textarea
                id="itineraryNotes"
                placeholder="不限時、有插座、需要預約……"
            ></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeItineraryModal()"
            >
                取消
            </button>

            <button
                class="btn btn-dark"
                onclick="saveItinerary()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<!-- =========================
     STAY MODAL
========================= -->

<div
    id="stayModal"
    class="modal-backdrop hidden"
>

    <div class="modal">

        <div class="modal-head">

            <h3>新增住宿</h3>

            <button
                class="close"
                onclick="closeStayModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">
            <label>住宿名稱</label>
            <input id="stayName" placeholder="例如：大阪飯店">
        </div>


        <div class="form-group">
            <label>地址</label>
            <input id="stayAddress" placeholder="住宿地址">
        </div>


        <div class="form-group">
            <label>入住日期</label>
            <input id="stayCheckIn" type="date">
        </div>


        <div class="form-group">
            <label>退房日期</label>
            <input id="stayCheckOut" type="date">
        </div>


        <div class="form-group">
            <label>價格</label>
            <input id="stayPrice" type="number">
        </div>


        <div class="form-group">
            <label>訂房資訊</label>
            <input id="stayBooking" placeholder="訂房編號、平台等">
        </div>


        <div class="form-group">
            <label>備註</label>
            <textarea id="stayNotes"></textarea>
        </div>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeStayModal()"
            >
                取消
            </button>

            <button
                class="btn btn-dark"
                onclick="saveStay()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<!-- =========================
     FLIGHT MODAL
========================= -->

<div
    id="flightModal"
    class="modal-backdrop hidden"
>

    <div class="modal">

        <div class="modal-head">

            <h3>新增航班</h3>

            <button
                class="close"
                onclick="closeFlightModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">
            <label>航空公司</label>
            <input id="flightAirline">
        </div>


        <div class="form-group">
            <label>航班號碼</label>
            <input id="flightNumber">
        </div>


        <div class="form-group">
            <label>出發機場</label>
            <input id="flightDepartureAirport">
        </div>


        <div class="form-group">
            <label>抵達機場</label>
            <input id="flightArrivalAirport">
        </div>


        <div class="form-group">
            <label>出發時間</label>
            <input id="flightDepartureTime" type="datetime-local">
        </div>


        <div class="form-group">
            <label>抵達時間</label>
            <input id="flightArrivalTime" type="datetime-local">
        </div>


        <div class="form-group">
            <label>價格</label>
            <input id="flightPrice" type="number">
        </div>


        <div class="form-group">
            <label>備註</label>
            <textarea id="flightNotes"></textarea>
        </div>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeFlightModal()"
            >
                取消
            </button>

            <button
                class="btn btn-dark"
                onclick="saveFlight()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<!-- =========================
     COMPANION MODAL
========================= -->

<div
    id="companionModal"
    class="modal-backdrop hidden"
>

    <div class="modal">

        <div class="modal-head">

            <h3>新增旅伴</h3>

            <button
                class="close"
                onclick="closeCompanionModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label>姓名</label>

            <input
                id="companionName"
                placeholder="例如：小美"
            >

        </div>


        <div class="modal-actions">

            <button
                class="btn btn-light"
                onclick="closeCompanionModal()"
            >
                取消

async function saveTrip(){

    const payload = {

        title:
            document
            .getElementById("tripTitle")
            .value
            .trim(),

        destination:
            document
            .getElementById("tripDestination")
            .value
            .trim(),

        end_date:
            document.getElementById("tripEnd").value
            || null,

            .getElementById("tripCover")
            .value
            .trim()

            document
            .getElementById("tripDescription")
            .value
            .trim()

    };


    if(!payload.title){

        alert("請輸入旅程名稱");

        return;

    }


    let result;


    if(editingTripId){

        result =
            await supabaseClient
                .from("trips")
                .update(payload)

    }else{

        result =

function switchTab(button, panelId){

    button.classList.add("active");

    [
        "schedulePanel",
        "stayPanel",
        "flightPanel",
        "companionPanel",

/* =====================================================
   SCHEDULE
===================================================== */

async function renderSchedule(){

    const panel =
        document.getElementById("schedulePanel");

    const {
        data,
        error
    } = await supabaseClient
        .from("itineraries")
        .select("*")
        .eq("trip_id", currentTrip.id)
        .order("day_number", {ascending:true})
        .order("start_time", {ascending:true});

    if(error){

        panel.innerHTML =
            `<div class="panel">${escapeHtml(error.message)}</div>`;

        return;

    }

    const grouped = {};

    (data || []).forEach(item => {

        if(!grouped[item.day_number]){
            grouped[item.day_number] = [];
        }

        grouped[item.day_number].push(item);

    });


    let html = `

        <div class="panel">

            <div class="panel-head">

                <h3>📅 每日行程</h3>

                ${
                    canEditCurrentTrip
                    ?
                    `
                    <button
                        class="btn btn-dark"
                        onclick="openItineraryModal()"
                    >
                        ＋ 新增行程
                    </button>
                    `
                    :
                    ""
                }

            </div>
    `;


    const days =
        Object.keys(grouped)
        .map(Number)
        .sort((a,b)=>a-b);


    if(days.length === 0){

        html += `
            <div class="empty">
                還沒有行程。
            </div>
        `;

    }else{

        days.forEach(day => {

            html += `

                <div class="day-block">

                    <div class="day-head">

                        <div class="day-title">
                            DAY ${day}
                        </div>

                        ${
                            canEditCurrentTrip
                            ?
                            `
                            <button
                                class="btn btn-light"
                                onclick="openItineraryModal(null,${day})"
                            >
                                ＋
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                    <div class="day-body">
            `;


            grouped[day].forEach(item => {

                html += `

                    <div class="itinerary-item">

                        <div class="item-title">
                            ${escapeHtml(item.title || "未命名行程")}
                        </div>

                        ${
                            item.location
                            ?
                            `
                            <div class="item-location">
                                📍 ${escapeHtml(item.location)}
                            </div>
                            `
                            :
                            ""
                        }

                        <div class="item-meta">

                            ${
                                item.start_time
                                ?
                                `<span class="badge">
                                    🕐 ${escapeHtml(item.start_time.slice(0,5))}
                                    ${
                                        item.end_time
                                        ?
                                        ` - ${escapeHtml(item.end_time.slice(0,5))}`
                                        :
                                        ""
                                    }
                                </span>`
                                :
                                ""
                            }

                            ${
                                item.transport
                                ?
                                `<span class="badge">
                                    🚃 ${escapeHtml(item.transport)}
                                </span>`
                                :
                                ""
                            }

                            ${
                                item.duration
                                ?
                                `<span class="badge">
                                    ⏱ ${escapeHtml(item.duration)}
                                </span>`
                                :
                                ""
                            }

                            ${
                                item.price !== null &&
                                item.price !== undefined &&
                                item.price !== ""
                                ?
                                `<span class="badge">
                                    💰 ${escapeHtml(String(item.price))}
                                </span>`
                                :
                                ""
                            }

                        </div>


                        ${
                            item.notes
                            ?
                            `
                            <div class="item-notes">
                                ${escapeHtml(item.notes)}
                            </div>
                            `
                            :
                            ""
                        }


                        ${
                            canEditCurrentTrip
                            ?
                            `
                            <div class="item-actions">

                                <button
                                    class="btn btn-light"
                                    onclick="openItineraryModal('${item.id}')"
                                >
                                    編輯
                                </button>

                                <button
                                    class="btn btn-danger"
                                    onclick="deleteItinerary('${item.id}')"
                                >
                                    刪除
                                </button>

                            </div>
                            `
                            :
                            ""
                        }

                    </div>
                `;

            });


            html += `
                    </div>
                </div>
            `;

        });

    }


    html += `</div>`;

    panel.innerHTML = html;

}

/* =====================================================
   HELPERS
===================================================== */

function formatDate(date){

    if(!date) return "";

    const parts =
        date.split("-");

    if(parts.length !== 3){
        return date;
    }

    return `${parts[0]}/${parts[1]}/${parts[2]}`;

}


function formatDateTime(value){

    if(!value) return "";

    const date =
        new Date(value);

    if(Number.isNaN(date.getTime())){
        return value;
    }

    return date.toLocaleString(
        "zh-TW",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttr(value){

    return escapeHtml(value);

}
