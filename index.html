<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOYA｜走呀</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: #f5f4f1;
    color: #292929;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
button, input, textarea, select {
    font: inherit;
}
button {
    cursor: pointer;
}
a {
    color: inherit;
}
.app {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 60px;
}

/* =========================
   HEADER
========================= */
.header {
    padding: 28px 20px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}
.logo {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #292929;
    line-height: 1;
}
.logo span {
    font-size: 30px;
    font-weight: 600;
    color: #555;
}
.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}
.user-email {
    font-size: 13px;
    color: #777;
}
.btn {
    border: none;
    border-radius: 12px;
    padding: 10px 15px;
    background: #292929;
    color: white;
}
.btn-light {
    background: #e8e6e1;
    color: #292929;
}
.btn-small {
    padding: 7px 10px;
    font-size: 13px;
}
.btn-danger {
    background: #eee3e1;
    color: #9a4b43;
}

/* =========================
   LOGIN
========================= */
.login-box {
    max-width: 420px;
    margin: 100px auto;
    background: white;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,.06);
}
.login-box h1 { margin: 0 0 8px; }
.login-box p { color: #777; margin-bottom: 25px; }
.field { margin-bottom: 15px; }
.field label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    color: #666;
}
.field input, .field textarea, .field select {
    width: 100%;
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 12px;
    padding: 12px;
    outline: none;
}
.field textarea { min-height: 100px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus {
    border-color: #999;
    background: white;
}
.login-message { margin-top: 15px; color: #a34e45; font-size: 14px; }

/* =========================
   新增：幣值與價格群組樣式 (需求3)
========================= */
.price-group {
    display: flex;
    gap: 10px;
    align-items: center;
}
.price-group select {
    width: 35%; /* 幣值選單寬度 */
}
.price-group input {
    width: 65%; /* 價格輸入寬度 */
}

/* =========================
   PAGE TITLE & SECTION (簡略保留)
========================= */
.section { padding: 10px 20px; }
.destination-card {
    background: white; border-radius: 18px; padding: 16px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
}

/* =========================
   VISA
========================= */
.visa-editor {
    border: 1px solid #e5e2dc;
    background: #faf9f6;
    border-radius: 15px;
    padding: 14px;
    margin-bottom: 10px;
}
.visa-editor-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.visa-editor-title { font-size: 14px; font-weight: 700; color: #555; }
.visa-remove-btn {
    border: none; background: #eee3e1; color: #8a4e47; border-radius: 9px; padding: 6px 9px; font-size: 12px;
}

/* 補全截斷的 CSS */
.item-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #ff9800;
    font-size: 14px;
    margin-top: 8px;
}
.page-container {
    display: none; /* 用於切換頁面 */
}
.page-container.active {
    display: block;
}
</style>
</head>
<body>

<div class="app">
    <!-- Header -->
    <header class="header">
        <div class="logo">GOYA<span>.</span></div>
        <div class="header-right" id="header-user-info" style="display:none;">
            <span class="user-email" id="user-email-display"></span>
            <button class="btn btn-light btn-small" onclick="handleLogout()">登出</button>
        </div>
    </header>

    <!-- 登入頁面 -->
    <div id="page-login" class="page-container active">
        <div class="login-box">
            <h1>登入 / 註冊</h1>
            <p>準備好出發了嗎？</p>
            <div class="field">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="example@goya.com">
            </div>
            <div class="field">
                <label>密碼</label>
                <input type="password" id="auth-password" placeholder="••••••••">
            </div>
            <button class="btn" style="width:100%" onclick="handleLogin()">登入</button>
            <div id="login-message" class="login-message"></div>
        </div>
    </div>

    <!-- 首頁 / 列表頁面 -->
    <div id="page-home" class="page-container">
        <div class="section">
            <h2 class="section-title">我的旅程</h2>
            <div class="destination-card" onclick="switchPage('page-detail')">
                <div class="destination-main">
                    <div class="destination-name">東京五日遊 (測試點擊)</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 旅程詳細與編輯頁面 -->
    <div id="page-detail" class="page-container">
        <div class="section">
            <button class="btn btn-light btn-small" onclick="switchPage('page-home')" style="margin-bottom: 20px;">← 返回列表</button>
            
            <h2 class="section-title">編輯旅程資訊</h2>
            
            <!-- 簽證/入境資訊編輯區塊 (需求2) -->
            <div class="visa-editor">
                <div class="visa-editor-header">
                    <span class="visa-editor-title">簽證／入境資訊</span>
                    <button class="visa-remove-btn">移除</button>
                </div>
                
                <div class="field">
                    <label>名稱</label>
                    <input type="text" placeholder="例如：日本 VJW">
                </div>
                
                <div class="field">
                    <label>連結</label>
                    <input type="text" placeholder="https://...">
                </div>
                
                <div class="field">
                    <label>價格 (需求3：手動選擇幣值)</label>
                    <div class="price-group">
                        <select class="currency-select">
                            <option value="TWD">TWD (台幣)</option>
                            <option value="JPY">JPY (日圓)</option>
                            <option value="USD">USD (美金)</option>
                            <option value="KRW">KRW (韓元)</option>
                            <option value="EUR">EUR (歐元)</option>
                        </select>
                        <input type="number" placeholder="輸入價格">
                    </div>
                </div>
            </div>

            <!-- 其他費用區塊 (示範需求3) -->
            <div class="visa-editor">
                <div class="visa-editor-header">
                    <span class="visa-editor-title">新增一般項目 (機票/住宿等)</span>
                </div>
                <div class="field">
                    <label>項目費用 (只要有價格都有幣值選項)</label>
                    <div class="price-group">
                        <select class="currency-select">
                            <option value="TWD">TWD (台幣)</option>
                            <option value="JPY">JPY (日圓)</option>
                            <option value="USD">USD (美金)</option>
                        </select>
                        <input type="number" placeholder="輸入價格">
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
    // Supabase 初始化 (請填入你的 URL 與 Key)
    const supabaseUrl = 'YOUR_SUPABASE_URL';
    const supabaseKey = 'YOUR_SUPABASE_KEY';
    // const supabase = supabase.createClient(supabaseUrl, supabaseKey); 
    // 若尚未連接 supabase，以下會用模擬的方式執行頁面切換邏輯。

    // --- 需求1：頁面刷新時僅需記憶位置，不再跳回登入頁 ---
    
    // 切換頁面函式
    function switchPage(pageId) {
        // 隱藏所有頁面
        document.querySelectorAll('.page-container').forEach(page => {
            page.classList.remove('active');
        });
        // 顯示目標頁面
        document.getElementById(pageId).classList.add('active');
        
        // 儲存當前頁面到 localStorage，刷新時讀取
        localStorage.setItem('goya_current_page', pageId);
    }

    // 頁面載入時驗證狀態
    window.addEventListener('DOMContentLoaded', async () => {
        // 模擬取得 Supabase Session
        // const { data: { session } } = await supabase.auth.getSession();
        
        // 【測試用】模擬已登入，若有真實 supabase 請改成依 session 判斷
        const isUserLoggedIn = true; 

        if (isUserLoggedIn) {
            document.getElementById('header-user-info').style.display = 'flex';
            document.getElementById('user-email-display').textContent = "user@goya.com";
            
            // 讀取上次紀錄的頁面，若無則預設為首頁 (home)
            const savedPage = localStorage.getItem('goya_current_page') || 'page-home';
            
            // 如果存的頁面是 login，但已登入，強制導向首頁
            if (savedPage === 'page-login') {
                switchPage('page-home');
            } else {
                switchPage(savedPage); 
            }
        } else {
            // 未登入則強制前往 login
            switchPage('page-login');
        }
    });

    // 模擬登入
    function handleLogin() {
        // supabase.auth.signInWithPassword(...)
        document.getElementById('header-user-info').style.display = 'flex';
        document.getElementById('user-email-display').textContent = "user@goya.com";
        switchPage('page-home');
    }

    // 模擬登出
    function handleLogout() {
        // supabase.auth.signOut()
        document.getElementById('header-user-info').style.display = 'none';
        localStorage.removeItem('goya_current_page'); // 清除頁面記憶
        switchPage('page-login');
    }
</script>

</body>
</html>
