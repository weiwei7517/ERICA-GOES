<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERICA GOES｜躺平也能玩，小資也能飛</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f4f1;
    color:#292929;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    sans-serif;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    max-width:760px;
    margin:auto;
    min-height:100vh;
    background:#f5f4f1;
}

.header{
    padding:25px 20px 18px;
    background:#f5f4f1;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
}

.tagline{
    margin-top:5px;
    color:#888;
    font-size:13px;
}

.section{
    padding:0 18px 22px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:11px;
}

.section-title h2{
    margin:0;
    font-size:18px;
}

.btn{
    border:0;
    border-radius:12px;
    padding:9px 13px;
    background:#292929;
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.btn-light{
    background:#fff;
    color:#292929;
    border:1px solid #ddd;
}

.btn-danger{
    background:#eee;
    color:#777;
}

.empty{
    background:#fff;
    border:1px dashed #d5d4d0;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;
    color:#999;
    font-size:13px;
}

.trip-list{
    display:grid;
    gap:11px;
}

.trip-card{
    background:#fff;
    border:1px solid #e3e2de;
    border-radius:18px;
    padding:17px;
}

.trip-card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.trip-country{
    font-size:12px;
    color:#999;
    margin-bottom:4px;
}

.trip-name{
    font-size:19px;
    font-weight:900;
}

.trip-date{
    margin-top:7px;
    font-size:12px;
    color:#777;
}

.trip-note{
    margin-top:10px;
    background:#f6f5f2;
    border-radius:10px;
    padding:9px;
    color:#777;
    font-size:12px;
    line-height:1.6;
}

.trip-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:13px;
}

.trip-actions button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:9px;
    padding:7px 9px;
    font-size:11px;
}

.partner-list{
    display:grid;
    gap:9px;
}

.partner-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:17px;
    padding:14px;
}

.partner-category{
    color:#999;
    font-size:11px;
    margin-bottom:4px;
}

.partner-name{
    font-size:16px;
    font-weight:800;
}

.partner-desc{
    color:#777;
    font-size:12px;
    line-height:1.6;
    margin-top:5px;
}

.partner-link{
    display:inline-block;
    margin-top:9px;
    color:#292929;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
}

.detail-page{
    display:none;
}

.detail-header{
    padding:18px;
}

.back-btn{
    border:0;
    background:transparent;
    padding:0;
    font-size:13px;
    color:#777;
}

.detail-title{
    margin-top:15px;
}

.detail-title h1{
    margin:0;
    font-size:25px;
}

.detail-info{
    margin-top:6px;
    color:#888;
    font-size:12px;
}

.detail-note{
    margin-top:12px;
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:14px;
    padding:12px;
    color:#777;
    font-size:12px;
    line-height:1.6;
}

.detail-section{
    padding:0 18px 22px;
}

.total-box{
    background:#292929;
    color:#fff;
    border-radius:18px;
    padding:18px;
}

.total-label{
    font-size:11px;
    opacity:.65;
}

.total-value{
    margin-top:5px;
    font-size:28px;
    font-weight:900;
}

.booking-list{
    display:grid;
    gap:9px;
}

.booking-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:17px;
    padding:15px;
}

.booking-type{
    color:#999;
    font-size:11px;
    margin-bottom:4px;
}

.booking-title{
    font-size:17px;
    font-weight:800;
}

.booking-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.booking-info-box{
    background:#f5f4f1;
    border-radius:10px;
    padding:9px;
}

.booking-label{
    color:#999;
    font-size:10px;
}

.booking-value{
    font-size:13px;
    font-weight:600;
    margin-top:3px;
}

.booking-note{
    margin-top:9px;
    font-size:12px;
    color:#777;
    line-height:1.6;
}

.stay-list{
    display:grid;
    gap:9px;
}

.stay-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:17px;
    padding:15px;
}

.stay-name{
    font-size:17px;
    font-weight:800;
}

.stay-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.stay-info-box{
    background:#f5f4f1;
    border-radius:10px;
    padding:9px;
}

.stay-label{
    color:#999;
    font-size:10px;
}

.stay-value{
    font-size:13px;
    font-weight:600;
    margin-top:3px;
}

.stay-platform{
    margin-top:9px;
    color:#777;
    font-size:12px;
}

.stay-note{
    margin-top:9px;
    color:#777;
    font-size:12px;
    line-height:1.6;
}

.stay-link{
    display:inline-block;
    margin-top:10px;
    color:#292929;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
}

.day-list{
    display:grid;
    gap:10px;
}

.day-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:18px;
    padding:15px;
}

.day-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.day-title{
    font-size:18px;
    font-weight:900;
}

.day-actions{
    display:flex;
    gap:5px;
}

.day-actions button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:6px 8px;
    font-size:11px;
}

.itinerary-list{
    display:grid;
    gap:9px;
    margin-top:12px;
}

.itinerary-card{
    background:#fff;
    border:1px solid #e1e0dc;
    border-radius:17px;
    padding:15px;
}

.itinerary-number{
    color:#999;
    font-size:11px;
    margin-bottom:4px;
}

.itinerary-title{
    font-size:17px;
    font-weight:800;
}

.itinerary-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.info-box{
    background:#f5f4f1;
    border-radius:10px;
    padding:9px;
}

.info-label{
    color:#999;
    font-size:10px;
}

.info-value{
    font-size:13px;
    font-weight:600;
    margin-top:3px;
}

.itinerary-platform{
    margin-top:9px;
    font-size:12px;
    color:#777;
}

.itinerary-note{
    margin-top:9px;
    font-size:12px;
    color:#777;
    line-height:1.6;
}

.itinerary-link{
    display:inline-block;
    margin-top:9px;
    color:#292929;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
}

.recommendation{
    margin-top:10px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.recommendation span{
    display:inline-block;
    background:#f5f4f1;
    border-radius:9px;
    padding:5px 8px;
    font-size:10px;
    color:#888;
}

.item-actions{
    display:flex;
    gap:6px;
    margin-top:11px;
}

.item-actions button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:6px 8px;
    font-size:10px;
}

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:1000;
    align-items:flex-end;
    justify-content:center;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:min(760px,100%);
    max-height:90vh;
    overflow:auto;
    background:#f5f4f1;
    border-radius:22px 22px 0 0;
    padding:22px 18px 28px;
}

.modal h2{
    margin:0 0 18px;
    font-size:20px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:11px;
    color:#777;
    font-weight:700;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #ddd;
    background:#fff;
    border-radius:11px;
    padding:11px;
    outline:none;
    font-size:13px;
}

.form-group textarea{
    min-height:85px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.modal-actions button{
    flex:1;
}

.radio-group{
    display:flex;
    gap:7px;
}

.radio-option{
    position:relative;
    flex:1;
}

.radio-option input{
    position:absolute;
    opacity:0;
}

.radio-option label{
    display:block;
    border:1px solid #ddd;
    background:#fff;
    border-radius:10px;
    padding:10px 5px;
    text-align:center;
    font-size:11px;
    color:#777;
    cursor:pointer;
}

.radio-option input:checked + label{
    background:#292929;
    color:#fff;
    border-color:#292929;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    background:#292929;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:500px){

    .form-row{
        grid-template-columns:1fr;
    }

    .itinerary-info,
    .booking-info,
    .stay-info{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

<body>

<div class="app">

<div id="homePage">

<header class="header">

<div class="logo">
ERICA GOES
</div>

<div class="tagline">
躺平也能玩，小資也能飛。
</div>

</header>


<section class="section">

<div class="section-title">

<h2>
我的旅行
</h2>

<button
class="btn"
onclick="openTripModal()">

＋ 新增旅行

</button>

</div>

<div
id="tripList"
class="trip-list">
</div>

</section>


<section class="section">

<div class="section-title">

<h2>
🤝 推薦／合作
</h2>

<button
class="btn"
onclick="openPartnerModal()">

＋ 新增

</button>

</div>

<div
id="partnerList"
class="partner-list">
</div>

</section>

</div>


<div
id="detailPage"
class="detail-page">

<header class="detail-header">

<button
class="back-btn"
onclick="goHome()">

← 回到我的旅行
