<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IVY GOES｜旅程</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f3f0;
    color:#292929;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

.container{
    width:min(920px, calc(100% - 32px));
    margin:auto;
}

/* =========================
   HEADER
========================= */

.header{
    padding:28px 0 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:27px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    font-weight:400;
}

.logout-btn{
    border:0;
    background:#e5e3df;
    color:#555;
    padding:9px 15px;
    border-radius:999px;
    font-size:13px;
}

/* =========================
   LOGIN
========================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.login-box{
    width:min(420px,100%);
    background:#fff;
    border-radius:24px;
    padding:30px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.login-logo{
    font-size:32px;
    font-weight:800;
    margin-bottom:8px;
}

.login-subtitle{
    color:#888;
    margin-bottom:26px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-size:13px;
    color:#777;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #ddd9d3;
    background:#faf9f7;
    border-radius:13px;
    padding:12px 13px;
    outline:none;
    color:#292929;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#aaa49c;
    background:#fff;
}

.primary-btn{
    width:100%;
    border:0;
    background:#292929;
    color:white;
    border-radius:14px;
    padding:13px;
    font-weight:700;
    margin-top:5px;
}

.message{
    margin-top:12px;
    font-size:13px;
    color:#b44b4b;
}

/* =========================
   HOME
========================= */

.page-title{
    margin:14px 0 6px;
    font-size:25px;
    font-weight:800;
}

.page-subtitle{
    color:#999;
    font-size:14px;
    margin-bottom:22px;
}

.add-trip-btn{
    width:100%;
    border:1px dashed #bdb9b2;
    background:transparent;
    color:#555;
    border-radius:18px;
    padding:17px;
    margin-bottom:18px;
    font-weight:600;
}

.trip-card{
    background:#fff;
    border-radius:21px;
    padding:20px;
    margin-bottom:13px;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

.trip-card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}

.trip-card-title{
    font-size:20px;
    font-weight:750;
}

.creator{
    color:#999;
    font-size:12px;
    margin-top:5px;
}

.trip-card-actions{
    display:flex;
    gap:7px;
}

.small-btn{
    border:0;
    border-radius:10px;
    padding:8px 11px;
    background:#eeeae5;
    color:#555;
    font-size:12px;
}

.delete-btn{
    background:#f4e7e4;
    color:#9a5148;
}

.view-btn{
    width:100%;
    border:0;
    background:#292929;
    color:white;
    border-radius:13px;
    padding:12px;
    margin-top:17px;
    font-weight:650;
}

.empty{
    text-align:center;
    color:#aaa;
    padding:50px 20px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.38);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:1000;
}

.modal-box{
    background:#fff;
    width:min(620px,100%);
    max-height:92vh;
    overflow:auto;
    border-radius:25px 25px 0 0;
    padding:24px;
}

.modal-title{
    font-size:21px;
    font-weight:800;
    margin-bottom:18px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-actions button{
    flex:1;
}

.cancel-btn{
    border:0;
    background:#eeeae5;
    color:#555;
    border-radius:13px;
    padding:13px;
}

/* =========================
   TRIP DETAIL
========================= */

.back-btn{
    border:0;
    background:transparent;
    padding:8px 0;
    color:#777;
    margin:10px 0 8px;
}

.trip-detail-header{
    margin-top:5px;
    margin-bottom:18px;
}

.trip-detail-title{
    font-size:30px;
    font-weight:850;
    line-height:1.25;
}

.trip-destination{
    color:#777;
    font-size:15px;
    margin-top:7px;
}

/* =========================
   TOTAL COST
========================= */

.total-card{
    background:#292929;
    color:#fff;
    border-radius:22px;
    padding:22px;
    margin-bottom:20px;
}

.total-label{
    font-size:13px;
    color:#bbb;
    margin-bottom:8px;
}

.total-amount{
    font-size:32px;
    font-weight:850;
    letter-spacing:.5px;
}

.total-note{
    font-size:12px;
    color:#aaa;
    margin-top:7px;
}

/* =========================
   SECTION
========================= */

.section{
    margin-bottom:22px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:11px;
}

.section-title{
    font-size:20px;
    font-weight:800;
}

.add-btn{
    border:0;
    background:#e7e4df;
    color:#444;
    border-radius:999px;
    padding:8px 13px;
    font-size:12px;
    font-weight:650;
}

/* =========================
   DAY
========================= */

.day-card{
    background:#fff;
    border-radius:20px;
    margin-bottom:13px;
    overflow:hidden;
    box-shadow:0 4px 17px rgba(0,0,0,.035);
}

.day-header{
    padding:17px 18px;
    background:#ebe9e5;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.day-title{
    font-size:18px;
    font-weight:800;
}

.day-actions{
    display:flex;
    gap:7px;
}

.day-content{
    padding:14px;
}

.itinerary-card{
    border:1px solid #eeeae5;
    border-radius:16px;
    padding:15px;
    margin-bottom:10px;
}

.itinerary-card:last-child{
    margin-bottom:0;
}

.itinerary-title{
    font-size:16px;
    font-weight:750;
}

.itinerary-location{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.itinerary-info{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:11px;
}

.tag{
    background:#f1efec;
    color:#666;
    border-radius:999px;
    padding:6px 9px;
    font-size:11px;
}

.itinerary-notes{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #eee;
    color:#777;
    font-size:13px;
    white-space:pre-wrap;
}

.item-actions{
    display:flex;
    gap:6px;
    margin-top:12px;
}

/* =========================
   ACCOMMODATION
========================= */

.stay-card{
    background:#fff;
    border-radius:18px;
    padding:17px;
    margin-bottom:10px;
    box-shadow:0 4px 15px rgba(0,0,0,.03);
}

.stay-name{
    font-size:17px;
    font-weight:750;
}

.stay-address{
    font-size:13px;
    color:#777;
    margin-top:5px;
}

.stay-info{
    margin-top:11px;
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.stay-notes{
    margin-top:10px;
    font-size:13px;
    color:#777;
    white-space:pre-wrap;
}

.no-data{
    background:#fff;
    border-radius:17px;
    padding:18px;
    text-align:center;
    color:#aaa;
    font-size:13px;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){
    .modal{
        align-items:center;
        padding:20px;
    }

    .modal-box{
        border-radius:25px;
    }
}

@media(max-width:520px){
    .container{
        width:min(100% - 24px,920px);
    }

    .header{
        padding-top:20px;
    }

    .trip-card-top{
        flex-direction:column;
    }

    .trip-card-actions{
        align-self:flex-end;
    }

    .trip-detail-title{
        font-size:27px;
    }

    .total-amount{
        font-size:29px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="login-logo">
            IVY GOES
        </div>

        <div class="login-subtitle">
            把想去的地方，好好記下來。
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                id="loginEmail"
                type="email"
                placeholder="輸入 Email"
            >
        </div>

        <div class="form-group">
            <label>密碼</label>
            <input
                id="loginPassword"
                type="password"
                placeholder="輸入密碼"
            >
        </div>

        <button
            class="primary-btn"
            onclick="login()"
        >
            登入
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

    <div class="container">

        <header class="header">

            <div class="logo">
                IVY <span>GOES</span>
            </div>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                登出
            </button>

        </header>


        <!-- =========================
             HOME
        ========================= -->

        <main id="homePage">

            <div class="page-title">
                旅程
            </div>

            <div class="page-subtitle">
                建立你的旅程，也可以查看其他創作者的旅程。
            </div>

            <button
                id="addTripButton"
                class="add-trip-btn"
                onclick="openTripModal()"
            >
                ＋ 新增旅程
            </button>

            <div id="tripList"></div>

        </main>


        <!-- =========================
             TRIP DETAIL
        ========================= -->

        <main id="detailPage" class="hidden">

            <button
                class="back-btn"
                onclick="showHome()"
            >
                ← 回到旅程
            </button>

            <div
                id="tripDetail"
            ></div>

        </main>

    </div>

</div>


<!-- =========================
     TRIP MODAL
========================= -->

<div
    id="tripModal"
    class="modal hidden"
    onclick="closeModalByBackground(event,'tripModal')"
>

    <div class="modal-box">

        <div class="modal-title">
            新增旅程
        </div>

        <div class="form-group">
            <label>旅程名稱</label>
            <input
                id="tripTitle"
                placeholder="例如：大阪 5 天自由行"
            >
        </div>

        <div class="form-group">
            <label>國家／城市</label>
            <input
                id="tripDestination"
                placeholder="例如：日本・大阪"
            >
        </div>

        <div class="form-group">
            <label>開始日期</label>
            <input
                id="tripStartDate"
                type="date"
            >
        </div>

        <div class="form-group">
            <label>結束日期</label>
            <input
                id="tripEndDate"
                type="date"
            >
        </div>

        <div class="form-group">
            <label>旅程介紹</label>
            <textarea
                id="tripDescription"
                placeholder="簡單介紹一下這趟旅程..."
            ></textarea>
        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeModal('tripModal')"
            >
                取消
            </button>

            <button
                class="primary-btn"
                onclick="saveTrip()"
            >
                建立旅程
            </button>

        </div>

        <div id="tripModalMessage" class="message"></div>

    </div>

</div>


<!-- =========================
     ITINERARY MODAL
========================= -->

<div
    id="itineraryModal"
    class="modal hidden"
    onclick="closeModalByBackground(event,'itineraryModal')"
>

    <div class="modal-box">

        <div
            id="itineraryModalTitle"
            class="modal-title"
        >
            新增行程
        </div>

        <div class="form-group">
            <label>行程名稱</label>
            <input
                id="itineraryTitle"
                placeholder="例如：伏見稻荷大社"
            >
        </div>

        <div class="form-group">
            <label>地點</label>
            <input
                id="itineraryLocation"
                placeholder="例如：京都"
            >
        </div>

        <div class="form-group">
            <label>交通</label>
            <input
                id="itineraryTransport"
                placeholder="例如：電車"
            >
        </div>

        <div class="form-group">
            <label>價格（台幣）</label>
            <input
                id="itineraryPrice"
                type="number"
                min="0"
                placeholder="0"
            >
        </div>

        <div class="form-group">
            <label>所需時間</label>
            <input
                id="itineraryDuration"
                placeholder="例如：2 小時"
            >
        </div>

        <div class="form-group">
            <label>開始時間</label>
            <input
                id="itineraryStartTime"
                type="time"
            >
        </div>

        <div class="form-group">
            <label>結束時間</label>
            <input
                id="itineraryEndTime"
                type="time"
            >
        </div>

        <div class="form-group">
            <label>備註</label>
            <textarea
                id="itineraryNotes"
                placeholder="不限時間，可以記任何事情..."
            ></textarea>
        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeModal('itineraryModal')"
            >
                取消
            </button>

            <button
                class="primary-btn"
                onclick="saveItinerary()"
            >
                儲存
            </button>

        </div>

        <div
            id="itineraryMessage"
            class="message"
        ></div>

    </div>

</div>


<!-- =========================
     STAY MODAL
========================= -->

<div
    id="stayModal"
    class="modal hidden"
    onclick="closeModalByBackground(event,'stayModal')"
>

    <div class="modal-box">

        <div class="modal-title">
            新增住宿
        </div>

        <div class="form-group">
            <label>住宿名稱</label>
            <input
                id="stayName"
                placeholder="例如：大阪難波飯店"
            >
        </div>

        <div class="form-group">
            <label>地址</label>
            <input
                id="stayAddress"
                placeholder="輸入住宿地址"
            >
        </div>

        <div class="form-group">
            <label>入住日期</label>
            <input
                id="stayCheckIn"
                type="date"
            >
        </div>

        <div class="form-group">
            <label>退房日期</label>
            <input
                id="stayCheckOut"
                type="date"
            >
        </div>

        <div class="form-group">
            <label>價格（台幣）</label>
            <input
                id="stayPrice"
                type="number"
                min="0"
                placeholder="0"
            >
        </div>

        <div class="form-group">
            <label>訂房資訊</label>
            <input
                id="stayBookingInfo"
                placeholder="例如：Booking 訂單編號"
            >
        </div>

        <div class="form-group">
            <label>備註</label>
            <textarea
                id="stayNotes"
                placeholder="例如：含早餐、可以寄放行李..."
            ></textarea>
        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeModal('stayModal')"
            >
                取消
            </button>

            <button
                class="primary-btn"
                onclick="saveStay()"
            >
                新增住宿
            </button>

        </div>

        <div
            id="stayMessage"
            class="message"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://vkwriekcbvvvkmsmlbzu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YIXuILncvi7L4It4Mgi99A_neR0cFry";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentTrip = null;

let currentPermission = "viewer";

let editingItineraryId = null;


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const {
            data:{
                session
            }
        } = await supabaseClient.auth.getSession();

        if(session){

            currentUser = session.user;

            showApp();

            await loadTrips();

        }else{

            showLogin();

        }

    }
);


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document
        .getElementById("loginMessage");

    message.textContent = "";

    if(!email || !password){

        message.textContent =
            "請輸入 Email 和密碼。";

        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if(error){

        message.textContent =
            error.message;

        return;
    }

    currentUser = data.user;

    showApp();

    await loadTrips();
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentTrip = null;

    showLogin();
}


/* =========================================================
   UI
========================================================= */

function showLogin(){

    document
        .getElementById("loginPage")
        .classList.remove("hidden");

    document
        .getElementById("app")
        .classList.add("hidden");
}


function showApp(){

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    document
        .getElementById("homePage")
        .classList.remove("hidden");

    document
        .getElementById("detailPage")
        .classList.add("hidden");
}


function showHome(){

    currentTrip = null;

    document
        .getElementById("homePage")
        .classList.remove("hidden");

    document
        .getElementById("detailPage")
        .classList.add("hidden");

    loadTrips();
}


/* =========================================================
   TRIPS
========================================================= */

async function loadTrips(){

    const list =
        document.getElementById("tripList");

    list.innerHTML =
        `<div class="empty">載入旅程中...</div>`;

    const {
        data,
        error
    } =
        await supabaseClient
        .from("trips")
        .select("*")
        .order("created_at", {
            ascending:false
        });

    if(error){

        list.innerHTML =
            `<div class="empty">
                載入失敗：${escapeHtml(error.message)}
            </div>`;

        return;
    }

    if(!data || data.length === 0){

        list.innerHTML =
            `<div class="empty">
                還沒有旅程<br><br>
                建立你的第一趟旅行吧 ✈️
            </div>`;

        return;
    }

    list.innerHTML = "";

    for(const trip of data){

        const card =
            document.createElement("div");

        card.className =
            "trip-card";

        const isOwner =
            trip.owner_id === currentUser.id;

        card.innerHTML = `

            <div class="trip-card-top">

                <div>

                    <div class="trip-card-title">
                        ${escapeHtml(trip.title || "未命名旅程")}
                    </div>

                    <div class="creator">
                        ${isOwner ? "by 你" : "旅程創作者"}
                    </div>

                </div>

                ${
                    isOwner
                    ?
                    `
                    <div class="trip-card-actions">

                        <button
                            class="small-btn delete-btn"
                            onclick="deleteTrip('${trip.id}')"
                        >
                            刪除
                        </button>

                    </div>
                    `
                    :
                    ""
                }

            </div>

            <button
                class="view-btn"
                onclick="openTrip('${trip.id}')"
            >
                查看旅程
            </button>

        `;

        list.appendChild(card);
    }
}


/* =========================================================
   ADD TRIP
========================================================= */

function openTripModal(){

    document
        .getElementById("tripTitle")
        .value = "";

    document
        .getElementById("tripDestination")
        .value = "";

    document
        .getElementById("tripStartDate")
        .value = "";

    document
        .getElementById("tripEndDate")
        .value = "";

    document
        .getElementById("tripDescription")
        .value = "";

    document
        .getElementById("tripModalMessage")
        .textContent = "";

    document
        .getElementById("tripModal")
        .classList.remove("hidden");
}


async function saveTrip(){

    const title =
        document
        .getElementById("tripTitle")
        .value
        .trim();

    const destination =
        document
        .getElementById("tripDestination")
        .value
        .trim();

    const startDate =
        document
        .getElementById("tripStartDate")
        .value || null;

    const endDate =
        document
        .getElementById("tripEndDate")
        .value || null;

    const description =
        document
        .getElementById("tripDescription")
        .value
        .trim();

    const message =
        document
        .getElementById("tripModalMessage");

    if(!title){

        message.textContent =
            "請輸入旅程名稱。";

        return;
    }

    const {
        error
    } =
        await supabaseClient
        .from("trips")
        .insert({
            owner_id:currentUser.id,
            title,
            destination,
            start_date:startDate,
            end_date:endDate,
            description
        });

    if(error){

        message.textContent =
            error.message;

        return;
    }

    closeModal("tripModal");

    await loadTrips();
}


/* =========================================================
   DELETE TRIP
========================================================= */

async function deleteTrip(id){

    const yes =
        confirm("確定要刪除這個旅程嗎？");

    if(!yes) return;

    const {
        error
    } =
        await supabaseClient
        .from("trips")
        .delete()
        .eq("id",id);

    if(error){

        alert(error.message);

    }

    await loadTrips();
}


/* =========================================================
   OPEN TRIP
========================================================= */

async function openTrip(id){

    const {
        data:trip,
        error
    } =
        await supabaseClient
        .from("trips")
        .select("*")
        .eq("id",id)
        .single();

    if(error){

        alert(error.message);

        return;
    }

    currentTrip = trip;

    await checkPermission();

    document
        .getElementById("homePage")
        .classList.add("hidden");

    document
        .getElementById("detailPage")
        .classList.remove("hidden");

    await renderTripDetail();
}


/* =========================================================
   PERMISSION
========================================================= */

async function checkPermission(){

    if(!currentTrip){

        currentPermission =
            "viewer";

        return;
    }

    if(
        currentTrip.owner_id ===
        currentUser.id
    ){

        currentPermission =
            "admin";

        return;
    }

    const {
        data
    } =
        await supabaseClient
        .from("trip_members")
        .select("role")
        .eq("trip_id",currentTrip.id)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    currentPermission =
        data?.role || "viewer";
}


function canEdit(){

    return (
        currentPermission === "admin" ||
        currentPermission === "editor"
    );
}


/* =========================================================
   RENDER DETAIL
========================================================= */

async function renderTripDetail(){

    const detail =
        document.getElementById("tripDetail");

    detail.innerHTML =
        `<div class="empty">載入旅程中...</div>`;

    const [
        itineraryResult,
        stayResult
    ] =
        await Promise.all([

            supabaseClient
            .from("itineraries")
            .select("*")
            .eq("trip_id",currentTrip.id)
            .order("day_number",{
                ascending:true
            })
            .order("start_time",{
                ascending:true,
                nullsFirst:false
            }),

            supabaseClient
            .from("stays")
            .select("*")
            .eq("trip_id",currentTrip.id)
            .order("check_in",{
                ascending:true,
                nullsFirst:false
            })

        ]);

    if(itineraryResult.error){

        detail.innerHTML =
            `<div class="empty">
                行程載入失敗：${escapeHtml(itineraryResult.error.message)}
            </div>`;

        return;
    }

    if(stayResult.error){

        detail.innerHTML =
            `<div class="empty">
                住宿載入失敗：${escapeHtml(stayResult.error.message)}
            </div>`;

        return;
    }

    const itineraries =
        itineraryResult.data || [];

    const stays =
        stayResult.data || [];

    let total = 0;

    itineraries.forEach(item => {

        total +=
            Number(item.price) || 0;

    });

    stays.forEach(item => {

        total +=
            Number(item.price) || 0;

    });


    /* =========================
       HEADER
    ========================= */

    let html = `

        <div class="trip-detail-header">

            <div class="trip-detail-title">
                ${escapeHtml(currentTrip.destination || "旅程")}
            </div>

            <div class="trip-destination">
                ${escapeHtml(currentTrip.title || "")}
            </div>

    `;

    if(
        currentTrip.start_date ||
        currentTrip.end_date
    ){

        html += `
            <div class="trip-destination">
                ${formatDate(currentTrip.start_date)}
                ${
                    currentTrip.end_date
                    ? " — " + formatDate(currentTrip.end_date)
                    : ""
                }
            </div>
        `;

    }

    if(currentTrip.description){

        html += `
            <div
                class="trip-destination"
                style="margin-top:12px;line-height:1.6;"
            >
                ${escapeHtml(currentTrip.description)}
            </div>
        `;

    }

    html += `</div>`;


    /* =========================
       TOTAL
    ========================= */

    html += `

        <div class="total-card">

            <div class="total-label">
                旅程總花費
            </div>

            <div class="total-amount">
                NT$ ${formatMoney(total)}
            </div>

            <div class="total-note">
                行程＋住宿自動加總
            </div>

        </div>

    `;


    /* =========================
       ITINERARY
    ========================= */

    html += `

        <section class="section">

            <div class="section-header">

                <div class="section-title">
                    行程
                </div>

                ${
                    canEdit()
                    ?
                    `
                    <button
                        class="add-btn"
                        onclick="addDay()"
                    >
                        ＋ 新增 Day
                    </button>
                    `
                    :
                    ""
                }

            </div>

    `;


    const maxDay =
        itineraries.length
        ?
        Math.max(
            ...itineraries.map(
                item => Number(item.day_number) || 1
            )
        )
        :
        1;


    for(
        let day = 1;
        day <= maxDay;
        day++
    ){

        const dayItems =
            itineraries.filter(
                item =>
                    Number(item.day_number) === day
            );

        html += `

            <div class="day-card">

                <div class="day-header">

                    <div class="day-title">
                        Day ${day}
                    </div>

                    ${
                        canEdit()
                        ?
                        `
                        <div class="day-actions">

                            <button
                                class="small-btn"
                                onclick="openItineraryModal(${day})"
                            >
                                ＋ 新增
                            </button>

                        </div>
                        `
                        :
                        ""
                    }

                </div>

                <div class="day-content">

        `;


        if(dayItems.length === 0){

            html += `
                <div class="no-data">
                    還沒有行程
                </div>
            `;

        }else{

            dayItems.forEach(item => {

                html += renderItinerary(item);

            });

        }


        html += `
                </div>
            </div>
        `;
    }


    html += `</section>`;


    /* =========================
       STAYS
    ========================= */

    html += `

        <section class="section">

            <div class="section-header">

                <div class="section-title">
                    住宿資訊
                </div>

                ${
                    canEdit()
                    ?
                    `
                    <button
                        class="add-btn"
                        onclick="openStayModal()"
                    >
                        ＋ 新增住宿
                    </button>
                    `
                    :
                    ""
                }

            </div>

    `;


    if(stays.length === 0){

        html += `
            <div class="no-data">
                還沒有住宿資訊
            </div>
        `;

    }else{

        stays.forEach(stay => {

            html += renderStay(stay);

        });

    }


    html += `
        </section>
    `;


    detail.innerHTML = html;
}


/* =========================================================
   RENDER ITINERARY
========================================================= */

function renderItinerary(item){

    let info = "";

    if(item.transport){

        info += `
            <span class="tag">
                🚆 ${escapeHtml(item.transport)}
            </span>
        `;

    }

    if(
        item.price !== null &&
        item.price !== undefined &&
        item.price !== ""
    ){

        info += `
            <span class="tag">
                💰 NT$ ${formatMoney(item.price)}
            </span>
        `;

    }

    if(item.duration){

        info += `
            <span class="tag">
                ⏱ ${escapeHtml(item.duration)}
            </span>
        `;

    }

    if(
        item.start_time ||
        item.end_time
    ){

        info += `
            <span class="tag">
                🕐
                ${formatTime(item.start_time)}
                ${
                    item.end_time
                    ? " - " + formatTime(item.end_time)
                    : ""
                }
            </span>
        `;

    }


    return `

        <div class="itinerary-card">

            <div class="itinerary-title">
                ${escapeHtml(item.title || "未命名行程")}
            </div>

            ${
                item.location
                ?
                `
                <div class="itinerary-location">
                    📍 ${escapeHtml(item.location)}
                </div>
                `
                :
                ""
            }

            ${
                info
                ?
                `
                <div class="itinerary-info">
                    ${info}
                </div>
                `
                :
                ""
            }

            ${
                item.notes
                ?
                `
                <div class="itinerary-notes">
                    ${escapeHtml(item.notes)}
                </div>
                `
                :
                ""
            }

            ${
                canEdit()
                ?
                `
                <div class="item-actions">

                    <button
                        class="small-btn"
                        onclick="editItinerary('${item.id}')"
                    >
                        編輯
                    </button>

                    <button
                        class="small-btn delete-btn"
                        onclick="deleteItinerary('${item.id}')"
                    >
                        刪除
                    </button>

                </div>
                `
                :
                ""
            }

        </div>

    `;
}


/* =========================================================
   DAY
========================================================= */

async function addDay(){

    if(!currentTrip || !canEdit()) return;

    const {
        data,
        error
    } =
        await supabaseClient
        .from("itineraries")
        .select("day_number")
        .eq("trip_id",currentTrip.id)
        .order("day_number",{
            ascending:false
        })
        .limit(1);

    if(error){

        alert(error.message);

        return;
    }

    const lastDay =
        data && data.length
        ? Number(data[0].day_number)
        : 0;

    const newDay =
        lastDay + 1;

    openItineraryModal(newDay);
}


/* =========================================================
   ITINERARY MODAL
========================================================= */

function openItineraryModal(
    dayNumber,
    existing = null
){

    editingItineraryId =
        existing
        ? existing.id
        : null;

    document
        .getElementById("itineraryModalTitle")
        .textContent =
            existing
            ? `編輯 Day ${dayNumber}`
            : `新增 Day ${dayNumber} 行程`;

    document
        .getElementById("itineraryTitle")
        .value =
            existing?.title || "";

    document
        .getElementById("itineraryLocation")
        .value =
            existing?.location || "";

    document
        .getElementById("itineraryTransport")
        .value =
            existing?.transport || "";

    document
        .getElementById("itineraryPrice")
        .value =
            existing?.price ?? "";

    document
        .getElementById("itineraryDuration")
        .value =
            existing?.duration || "";

    document
        .getElementById("itineraryStartTime")
        .value =
            existing?.start_time
            ? existing.start_time.substring(0,5)
            : "";

    document
        .getElementById("itineraryEndTime")
        .value =
            existing?.end_time
            ? existing.end_time.substring(0,5)
            : "";

    document
        .getElementById("itineraryNotes")
        .value =
            existing?.notes || "";

    document
        .getElementById("itineraryModal")
        .dataset.day =
            dayNumber;

    document
        .getElementById("itineraryMessage")
        .textContent = "";

    document
        .getElementById("itineraryModal")
        .classList.remove("hidden");
}


async function editItinerary(id){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("itineraries")
        .select("*")
        .eq("id",id)
        .single();

    if(error){

        alert(error.message);

        return;
    }

    openItineraryModal(
        data.day_number,
        data
    );
}


async function saveItinerary(){

    if(!currentTrip || !canEdit()) return;

    const modal =
        document.getElementById(
            "itineraryModal"
        );

    const dayNumber =
        Number(modal.dataset.day) || 1;

    const title =
        document
        .getElementById("itineraryTitle")
        .value
        .trim();

    const location =
        document
        .getElementById("itineraryLocation")
        .value
        .trim();

    const transport =
        document
        .getElementById("itineraryTransport")
        .value
        .trim();

    const priceValue =
        document
        .getElementById("itineraryPrice")
        .value;

    const duration =
        document
        .getElementById("itineraryDuration")
        .value
        .trim();

    const startTime =
        document
        .getElementById("itineraryStartTime")
        .value || null;

    const endTime =
        document
        .getElementById("itineraryEndTime")
        .value || null;

    const notes =
        document
        .getElementById("itineraryNotes")
        .value
        .trim();

    const message =
        document.getElementById(
            "itineraryMessage"
        );

    if(!title){

        message.textContent =
            "請輸入行程名稱。";

        return;
    }

    const payload = {

        trip_id:currentTrip.id,

        day_number:dayNumber,

        title,

        location,

        transport:
            transport || null,

        price:
            priceValue === ""
            ? null
            : Number(priceValue),

        duration:
            duration || null,

        start_time:startTime,

        end_time:endTime,

        notes:
            notes || null
    };


    let result;


    if(editingItineraryId){

        result =
            await supabaseClient
            .from("itineraries")
            .update(payload)
            .eq("id",editingItineraryId);

    }else{

        result =
            await supabaseClient
            .from("itineraries")
            .insert(payload);

    }


    if(result.error){

        message.textContent =
            result.error.message;

        return;
    }

    closeModal("itineraryModal");

    editingItineraryId = null;

    await renderTripDetail();
}


async function deleteItinerary(id){

    if(!canEdit()) return;

    if(!confirm("確定要刪除這筆行程嗎？")){

        return;
    }

    const {
        error
    } =
        await supabaseClient
        .from("itineraries")
        .delete()
        .eq("id",id);

    if(error){

        alert(error.message);

        return;
    }

    await renderTripDetail();
}


/* =========================================================
   STAYS
========================================================= */

function openStayModal(){

    document
        .getElementById("stayName")
        .value = "";

    document
        .getElementById("stayAddress")
        .value = "";

    document
        .getElementById("stayCheckIn")
        .value = "";

    document
        .getElementById("stayCheckOut")
        .value = "";

    document
        .getElementById("stayPrice")
        .value = "";

    document
        .getElementById("stayBookingInfo")
        .value = "";

    document
        .getElementById("stayNotes")
        .value = "";

    document
        .getElementById("stayMessage")
        .textContent = "";

    document
        .getElementById("stayModal")
        .classList.remove("hidden");
}


async function saveStay(){

    if(!currentTrip || !canEdit()) return;

    const name =
        document
        .getElementById("stayName")
        .value
        .trim();

    const address =
        document
        .getElementById("stayAddress")
        .value
        .trim();

    const checkIn =
        document
        .getElementById("stayCheckIn")
        .value || null;

    const checkOut =
        document
        .getElementById("stayCheckOut")
        .value || null;

    const price =
        document
        .getElementById("stayPrice")
        .value;

    const bookingInfo =
        document
        .getElementById("stayBookingInfo")
        .value
        .trim();

    const notes =
        document
        .getElementById("stayNotes")
        .value
        .trim();

    const message =
        document
        .getElementById("stayMessage");

    if(!name){

        message.textContent =
            "請輸入住宿名稱。";

        return;
    }

    const {
        error
    } =
        await supabaseClient
        .from("stays")
        .insert({

            trip_id:currentTrip.id,

            name,

            address:
                address || null,

            check_in:checkIn,

            check_out:checkOut,

            price:
                price === ""
                ? null
                : Number(price),

            booking_info:
                bookingInfo || null,

            notes:
                notes || null
        });

    if(error){

        message.textContent =
            error.message;

        return;
    }

    closeModal("stayModal");

    await renderTripDetail();
}


function renderStay(stay){

    let info = "";

    if(stay.check_in){

        info += `
            <span class="tag">
                入住 ${formatDate(stay.check_in)}
            </span>
        `;

    }

    if(stay.check_out){

        info += `
            <span class="tag">
                退房 ${formatDate(stay.check_out)}
            </span>
        `;

    }

    if(
        stay.price !== null &&
        stay.price !== undefined
    ){

        info += `
            <span class="tag">
                💰 NT$ ${formatMoney(stay.price)}
            </span>
        `;

    }


    return `

        <div class="stay-card">

            <div class="stay-name">
                ${escapeHtml(stay.name || "未命名住宿")}
            </div>

            ${
                stay.address
                ?
                `
                <div class="stay-address">
                    📍 ${escapeHtml(stay.address)}
                </div>
                `
                :
                ""
            }

            ${
                info
                ?
                `
                <div class="stay-info">
                    ${info}
                </div>
                `
                :
                ""
            }

            ${
                stay.booking_info
                ?
                `
                <div class="stay-notes">
                    訂房資訊：${escapeHtml(stay.booking_info)}
                </div>
                `
                :
                ""
            }

            ${
                stay.notes
                ?
                `
                <div class="stay-notes">
                    ${escapeHtml(stay.notes)}
                </div>
                `
                :
                ""
            }

            ${
                canEdit()
                ?
                `
                <div class="item-actions">

                    <button
                        class="small-btn delete-btn"
                        onclick="deleteStay('${stay.id}')"
                    >
                        刪除
                    </button>

                </div>
                `
                :
                ""
            }

        </div>

    `;
}


async function deleteStay(id){

    if(!canEdit()) return;

    if(!confirm("確定要刪除這筆住宿嗎？")){

        return;
    }

    const {
        error
    } =
        await supabaseClient
        .from("stays")
        .delete()
        .eq("id",id);

    if(error){

        alert(error.message);

        return;
    }

    await renderTripDetail();
}


/* =========================================================
   MODAL
========================================================= */

function closeModal(id){

    document
        .getElementById(id)
        .classList.add("hidden");
}


function closeModalByBackground(
    event,
    id
){

    if(event.target.id === id){

        closeModal(id);

    }
}


/* =========================================================
   FORMAT
========================================================= */

function formatMoney(value){

    return Number(value || 0)
        .toLocaleString("zh-TW");
}


function formatDate(value){

    if(!value) return "";

    const parts =
        value.split("-");

    if(parts.length !== 3){

        return value;
    }

    return `${parts[0]}/${parts[1]}/${parts[2]}`;
}


function formatTime(value){

    if(!value) return "";

    return value.substring(0,5);
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
