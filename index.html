<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOYA｜走呀</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f4f1;
    color:#292929;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
}

.app{
    max-width:900px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:60px;
}

/* =========================
   HEADER
========================= */

.header{
    padding:28px 20px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:34px;
    font-weight:900;
    letter-spacing:1.5px;
    color:#292929;
    line-height:1;
}

.logo span{
    font-size:30px;
    font-weight:600;
    color:#555;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.user-email{
    font-size:13px;
    color:#777;
}

.btn{
    border:none;
    border-radius:12px;
    padding:10px 15px;
    background:#292929;
    color:white;
}

.btn-light{
    background:#e8e6e1;
    color:#292929;
}

.btn-small{
    padding:7px 10px;
    font-size:13px;
}

.btn-danger{
    background:#eee3e1;
    color:#9a4b43;
}

/* =========================
   LOGIN
========================= */

.login-box{
    max-width:420px;
    margin:100px auto;
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,.06);
}

.login-box h1{
    margin:0 0 8px;
}

.login-box p{
    color:#777;
    margin-bottom:25px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    color:#666;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#999;
    background:white;
}

.login-message{
    margin-top:15px;
    color:#a34e45;
    font-size:14px;
}

/* =========================
   PAGE TITLE
========================= */

.home-intro{
    padding:24px 20px 20px;
}

.title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:15px;
}

.home-title{
    margin:0;
    font-size:24px;
    line-height:1.2;
    letter-spacing:-.3px;
    font-weight:700;
}

.home-subtitle{
    margin:6px 0 0;
    color:#999;
    font-size:12px;
    line-height:1.5;
    letter-spacing:.2px;
}

.edit-intro-btn{
    flex-shrink:0;
    border:1px solid #dedcd7;
    background:rgba(255,255,255,.65);
    border-radius:10px;
    padding:7px 13px;
    color:#555;
    font-size:12px;
    transition:.2s ease;
}

.edit-intro-btn:hover{
    background:#fff;
    border-color:#ccc8c0;
    color:#292929;
}

/* =========================
   SECTION
========================= */

.section{
    padding:10px 20px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:15px;
}

.section-title{
    margin:0;
    font-size:22px;
}

.section-description{
    color:#888;
    font-size:13px;
}

/* =========================
   DESTINATION LIST
========================= */

.destination-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.destination-card{
    background:white;
    border-radius:18px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.035);
}

.destination-main{
    flex:1;
    min-width:0;
    cursor:pointer;
}

.destination-name{
    font-size:19px;
    font-weight:700;
}

.destination-count{
    margin-top:4px;
    color:#999;
    font-size:13px;
}

.destination-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.icon-btn{
    width:auto;
    min-width:34px;
    height:34px;
    padding:0 9px;
    border:1px solid #e1dfda;
    border-radius:9px;
    background:#faf9f6;
    color:#555;
    font-size:13px;
    transition:.2s ease;
}

.icon-btn:hover{
    background:#f0efeb;
    border-color:#d4d1ca;
    color:#292929;
}

.icon-btn:disabled{
    opacity:.3;
    cursor:not-allowed;
}

.text-action{
    width:auto;
    height:34px;
    padding:0 10px;
    border:1px solid #e1dfda;
    border-radius:9px;
    background:#faf9f6;
    color:#555;
    font-size:13px;
    transition:.2s ease;
}

.text-action:hover{
    background:#f0efeb;
    border-color:#d4d1ca;
    color:#292929;
}

.text-action.delete{
    color:#8a625d;
}

.text-action.delete:hover{
    background:#f3e9e6;
    border-color:#e3d2ce;
    color:#8a4e47;
}

.add-destination{
    width:100%;
    border:1px dashed #c8c6c1;
    background:transparent;
    color:#555;
    border-radius:16px;
    padding:15px;
    margin-top:3px;
}

/* =========================
   COOPERATION
========================= */

.cooperation-card{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.035);
}

.cooperation-empty{
    color:#999;
    font-size:14px;
    line-height:1.7;
}

.cooperation-title{
    font-size:18px;
    font-weight:750;
}

.cooperation-description{
    margin-top:6px;
    color:#777;
    font-size:14px;
    line-height:1.7;
}

.cooperation-link{
    display:inline-block;
    margin-top:12px;
    padding:8px 12px;
    background:#f0efeb;
    border-radius:10px;
    text-decoration:none;
    font-size:13px;
}

.cooperation-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

/* =========================
   JOURNEYS
========================= */

.back-btn{
    border:none;
    background:transparent;
    color:#555;
    padding:0;
    margin-bottom:15px;
}

.destination-heading{
    font-size:32px;
    margin:0;
}

.journey-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.journey-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.journey-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.journey-main{
    flex:1;
    cursor:pointer;
}

.journey-title{
    font-size:21px;
    font-weight:750;
}

.journey-subtitle{
    margin-top:7px;
    color:#777;
    font-size:14px;
}

.journey-creator{
    margin-top:10px;
    color:#555;
    font-size:14px;
}

.journey-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:flex-start;
}

/* =========================
   DETAIL
========================= */

.detail-header{
    padding:20px;
}

.detail-title{
    margin:0;
    font-size:34px;
}

.detail-subtitle{
    color:#888;
    margin:7px 0;
    font-size:14px;
}

.detail-meta{
    color:#888;
    font-size:14px;
    line-height:1.8;
}

.total-box{
    margin-top:20px;
    background:#292929;
    color:white;
    border-radius:20px;
    padding:20px;
}

.total-label{
    font-size:13px;
    opacity:.7;
}

.total-price{
    font-size:30px;
    font-weight:800;
    margin-top:5px;
}

.info-box{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

.info-box-title{
    font-size:19px;
    font-weight:750;
    margin-bottom:10px;
}

.info-box-content{
    color:#666;
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
}

.info-box-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

/* =========================
   VISA
========================= */

.visa-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.visa-card{
    border:1px solid #e7e5e0;
    border-radius:14px;
    padding:13px;
    background:#faf9f6;
}

.visa-name{
    font-size:15px;
    font-weight:700;
    color:#333;
}

.visa-info{
    margin-top:6px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:#777;
}

.visa-price{
    font-weight:700;
    color:#555;
}

.visa-link{
    display:inline-block;
    padding:5px 9px;
    background:#eeece7;
    border-radius:8px;
    text-decoration:none;
    color:#555;
    font-size:12px;
}

.visa-link:hover{
    background:#e5e3dd;
}

.visa-empty{
    color:#999;
    font-size:14px;
}

.visa-editor{
    border:1px solid #e5e2dc;
    background:#faf9f6;
    border-radius:15px;
    padding:14px;
    margin-bottom:10px;
}

.visa-editor-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.visa-editor-title{
    font-size:14px;
    font-weight:700;
    color:#555;
}

.visa-remove-btn{
    border:none;
    background:#eee3e1;
    color:#8a4e47;
    border-radius:9px;
    padding:6px 9px;
    font-size:12px;
}

.visa-editor-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.visa-add-btn{
    width:100%;
    border:1px dashed #c8c6c1;
    background:white;
    color:#666;
    border-radius:12px;
    padding:11px;
    margin-top:4px;
}

.day-card{
    background:white;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.035);
}

.day-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.day-title{
    font-size:21px;
    font-weight:750;
}

.item-card,
.stay-card{
    border:1px solid #e7e5e0;
    border-radius:15px;
    padding:14px;
    margin-bottom:10px;
}

.item-title{
    font-weight:700;
    font-size:16px;
}

.item-info{
    color:#777;
    font-size:13px;
    line-height:1.8;
    margin-top:5px;
}

.item-price{
    margin-top:8px;
    font-weight:700;
}

.item-rating{
    display
